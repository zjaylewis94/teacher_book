  {
    id:'draw3',label:'Draw + Paint 3',color:'#2471A3',
    units:[
      { id:'u11',num:11,title:'Advanced Pencil',overview:'You already know how to shade a sphere; now you\'ll make light and form do what you want. You\'ll push gradients further, construct complex objects from simple forms, and study how cast shadows bend over surfaces. The unit ends with a surreal landscape where impossible forms still obey real light. By the end, you should be able to invent forms from imagination and light them convincingly.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u11p1',tier:'TIER 1',name:'Pencil Intro Worksheet+',pts:2,desc:'Review pencil grades and value zones, then push into edge control, lost and found edges, and full-range values.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p2',tier:'TIER 1',name:'Advanced Gradients',pts:2,desc:'Blend long, seamless gradients across curved and flat planes without visible steps.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p3',tier:'TIER 2',name:'Fruit Studies',pts:4,desc:'Draw fruit from observation, matching subtle value shifts and surface texture.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p4',tier:'TIER 2',name:'Constructing + Editing Form',pts:4,desc:'Build complex objects from basic forms, then refine the drawing by editing edges and proportions.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p5',tier:'TIER 2',name:'Cast Shadow Studies',pts:4,desc:'Draw how cast shadows stretch, bend, and soften as they fall across different surfaces.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p6',tier:'TIER 3',name:'Surrealist Forms Landscape',pts:8,desc:'Invent a surreal landscape of impossible forms that still follow one consistent light source.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p7',tier:'WILD CARD',name:'Tunnel Book',pts:null,desc:'Build a tunnel book of five or more layers, each shaded to push atmospheric depth.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p8',tier:'WILD CARD',name:'Food Truck',pts:null,desc:'Design a food truck in two-point perspective with a full menu, branding, and a shaded 3D body.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u12',num:12,title:'Advanced Pen + Ink',overview:'In the intro course you learned ink\'s rules; now you\'ll learn to bend them. You\'ll combine precise pen texture with loose ink wash and study how a single brushstroke can hold a whole form. The unit builds to Sumi-e, the Japanese ink painting tradition where restraint does the work. By the end, you should be able to move between controlled line and expressive wash in the same piece.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u12p1',tier:'TIER 1',name:'Pen + Ink Intro Worksheet+',pts:2,desc:'Review ink tools and vocabulary, then add brush pens, dip pens, and ink dilution to your toolkit.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p2',tier:'TIER 1',name:'Pen Shading Techniques',pts:2,desc:'Build value scales in hatching, crosshatching, stippling, and scribbling, with tighter control and a wider range.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p3',tier:'TIER 1',name:'Line Quality + Line Weights',pts:2,desc:'Use line weight to show light direction, overlap, and distance in a single contour drawing.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p4',tier:'TIER 2',name:'Contour Line Forms/Objects',pts:4,desc:'Draw complex objects with cross-contour lines that wrap around each form to describe its surface.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p5',tier:'TIER 2',name:'Ink Wash Blockout / Pen Texture',pts:4,desc:'Block in values with diluted ink wash, then layer pen texture on top for detail.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p6',tier:'TIER 3',name:'Ink Wash (Sumi-e)',pts:8,desc:'Paint a subject in the Sumi-e tradition, using as few brushstrokes as possible to capture its essence.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p7',tier:'WILD CARD',name:'Inktober Sketchbook',pts:null,desc:'Complete the daily Inktober prompts through October, trying a new ink technique each week.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p8',tier:'WILD CARD',name:'Halloween Masks',pts:null,desc:'Design and build a Halloween mask decorated with layered ink pattern and wash.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u13',num:13,title:'Acrylic',overview:'Acrylic is fast, flexible, and unforgiving of muddy color, which makes it the right paint for this level. You\'ll mix precise value scales, paint crinkled and reflective surfaces, and learn to glaze, layer, and build texture. You\'ll finish with a large painting that pulls all of it together. By the end, you should be able to mix and layer acrylic to paint convincing light, reflection, and surface.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u13p1',tier:'TIER 1',name:'Acrylic Intro Worksheet',pts:2,desc:'Learn acrylic handling, brushes, canvas prep, drying time, and palette care.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p2',tier:'TIER 1',name:'Color Theory / Value Scales Worksheet+',pts:2,desc:'Mix tints, shades, tones, and a matched value scale for each color on the wheel.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p3',tier:'TIER 2',name:'That\'s a Wrap!',pts:4,desc:'Paint a wrapped object, capturing the folds, crinkles, and highlights of foil or plastic.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p4',tier:'TIER 2',name:'Sparkmatik Blobs',pts:4,desc:'Paint glossy blob forms with smooth acrylic blends, crisp highlights, and reflected color, in the style of Sparkmatik.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p5',tier:'TIER 2',name:'3D Mecca Chameleon',pts:4,desc:'Paint a chameleon with full form, light, and texture instead of flat shapes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p6',tier:'TIER 3',name:'Candy Box',pts:8,desc:'Paint a candy box composition that shows off color, reflection, and packaging detail.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p7',tier:'WILD CARD',name:'Digital Painting (TBD)',pts:null,desc:'Take this unit\'s painting skills into a digital painting app; project details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p8',tier:'WILD CARD',name:'Vector Painting',pts:null,desc:'Paint an image in flat, hard-edged color shapes inspired by vector art.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u14',num:14,title:'Advanced Water Color',overview:'Now that you can control a wash, you\'ll combine watercolor with other media and work from life. You\'ll layer transparent color under colored pencil detail, paint still lifes from observation, and practice sketching fast on location. The unit ends with an urban sketching piece that captures the feeling of a real place, not just its outline. By the end, you should be able to paint from life with speed and mix watercolor with other media on purpose.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u14p1',tier:'TIER 1',name:'Water Color Worksheet+',pts:2,desc:'Review washes and layering, then add glazing, granulation, masking fluid, and lifting.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p2',tier:'TIER 1',name:'Limited Palette Study',pts:2,desc:'Paint a small scene using only three colors plus water, mixing every other color you need.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u14p3',tier:'TIER 2',name:'Sweet Treats Painting',pts:4,desc:'Paint a dessert in layered watercolor, then add colored pencil details for texture and shine.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p4',tier:'TIER 2',name:'Still Life Practice',pts:4,desc:'Paint a still life from observation, planning your lights before your first wash.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p5',tier:'TIER 3',name:'Urban Sketching Final',pts:8,desc:'Draw and paint a real location on site, capturing its atmosphere with loose line and layered washes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p6',tier:'WILD CARD',name:'Holiday Project (TBD)',pts:null,desc:'A seasonal project to close the semester; details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
    ]
  },
  {
    id:'draw4',label:'Draw + Paint 4',color:'#7D3C98',
    units:[
      { id:'u15',num:15,title:'Advanced Colored Pencil',overview:'You know how to layer color; now you\'ll use it to fool the eye. You\'ll render reflective, transparent, and textured surfaces with enough layers that the paper disappears. The unit ends with a full-face portrait in color. By the end, you should be able to render realistic skin, reflection, and texture in colored pencil.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u15p1',tier:'TIER 1',name:'Colored Pencil Intro Worksheet+',pts:2,desc:'Review layering and burnishing, then add solvent blending, impressed lines, and toned paper.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p2',tier:'TIER 1',name:'Skin Tone Mixing',pts:2,desc:'Mix a range of skin tones by layering, then match three tones from photo references.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u15p3',tier:'TIER 2',name:'Colored Pencil Candy Drawing',pts:4,desc:'Render wrapped or glossy candy, capturing transparency, reflections, and crinkled wrappers.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p4',tier:'TIER 2',name:'Glass + Metal Study',pts:4,desc:'Render a glass or metal object, capturing its reflections and the distorted view through it.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u15p5',tier:'TIER 3',name:'Full Face Celeb (Color Edition)',pts:8,desc:'Draw a full celebrity portrait from a photo, with accurate proportions, skin tones, and lighting.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p6',tier:'WILD CARD',name:'Album Cover',pts:null,desc:'Design and render a cover for a real or imagined album, combining lettering with a realistic object.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u16',num:16,title:'Advanced Charcoal',overview:'Charcoal at this level is about drama and control at the same time. You\'ll build still lifes with strong light, draw a stylized portrait, and spend serious time with the figure. You\'ll work larger and faster than you\'re used to. By the end, you should be able to draw an expressive, anatomically sound figure with a full range of value.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u16p1',tier:'TIER 1',name:'Charcoal Intro Worksheet+',pts:2,desc:'Review charcoal types and erasing, then push into toned paper, white charcoal, and drawing out of a dark ground.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p2',tier:'TIER 1',name:'8 Head Figure Proportions',pts:2,desc:'Map the human figure in 8-head proportions and draw it standing, seated, and in motion.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u16p3',tier:'TIER 1',name:'Gesture Speed Drills',pts:2,desc:'Draw 30-second and 1-minute gestures to warm up for figure work.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u16p4',tier:'TIER 2',name:'Still Life Practice',pts:4,desc:'Draw a still life with dramatic side lighting, focusing on edges and cast shadows.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p5',tier:'TIER 2',name:'Tim Burton Portrait',pts:4,desc:'Draw a portrait in Tim Burton\'s style on toned paper, exaggerating features while keeping the value realistic.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p6',tier:'TIER 3',name:'Figure Drawing',pts:8,desc:'Draw a full figure from a live model or reference, with accurate proportions, weight, and expressive value.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p7',tier:'WILD CARD',name:'Cinematic Frame',pts:null,desc:'Recreate a single frame from a film in charcoal, keeping its lighting and mood.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u17',num:17,title:'Advanced Pastel',overview:'At this level, pastel is about bold, expressive color choices, not just blending. You\'ll build color with visible, layered strokes and push it beyond what you see. You\'ll combine soft and oil pastel on purpose and work on colored grounds. By the end, you should be able to use color expressively to set a mood and lead the viewer\'s eye.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u17p1',tier:'TIER 1',name:'Pastel Intro Worksheet+',pts:2,desc:'Review soft and oil pastel techniques, then add colored grounds, fixative layering, and optical color mixing.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u17p2',tier:'TIER 1',name:'Color Temperature Study',pts:2,desc:'Draw the same object twice, once in warm colors and once in cool, and compare the moods.',materials:[],steps:[],tip:'',rubric:[],suggested:true},

// Project detail panel (desktop): collapse and resize. On phones it's a full-screen sheet instead.
function initCurriculumSidebarControls(wrap) {
  var detail = document.getElementById('curr-detail');
  var handle = document.getElementById('curr-detail-resize');
  var collapse = document.getElementById('curr-detail-collapse');
  if (!wrap || !detail || !handle || !collapse) return;

  function layout() {
    if (window.innerWidth <= 900) {
      detail.classList.remove('collapsed'); detail.style.width = ''; collapse.style.display = 'none';
      return;
    }
    detail.style.width = clamp(S.ui.currDetailWidth || 400, 280, 620) + 'px';
    detail.classList.toggle('collapsed', !!S.ui.currDetailCollapsed);
    collapse.style.display = 'flex';
    collapse.textContent = S.ui.currDetailCollapsed ? '◀' : '>';
    collapse.title = S.ui.currDetailCollapsed ? 'Expand project detail sidebar' : 'Collapse project detail sidebar';
    collapse.style.left = S.ui.currDetailCollapsed ? '-28px' : '8px';
  }
  collapse.onclick = function() {
    if (window.innerWidth <= 900) return;
    S.ui.currDetailCollapsed = !S.ui.currDetailCollapsed;
    save(); layout();
  };
  handle.onmousedown = function(e) {
    if (window.innerWidth <= 900) return;
    e.preventDefault();
    wrap.classList.add('dragging-curr-sidebars'); handle.classList.add('dragging');
    function move(ev) {
      S.ui.currDetailCollapsed = false;
      S.ui.currDetailWidth = clamp(wrap.getBoundingClientRect().right - ev.clientX, 280, 620);
      layout();
    }
    function up() {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      wrap.classList.remove('dragging-curr-sidebars'); handle.classList.remove('dragging');
      save();
    }
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  };
  layout();
}

// Re-render the unit view without losing the reader's place (the page on phones, the unit column on desktop)
function currKeepScroll(fn) {
  var cvEl = document.getElementById('canvas'), m = document.getElementById('curr-main');
  var y = window.scrollY, cy = cvEl ? cvEl.scrollTop : 0, my = m ? m.scrollTop : 0;
  fn();
  window.scrollTo(0, y);
  if (cvEl) cvEl.scrollTop = cy;
  var m2 = document.getElementById('curr-main'); if (m2) m2.scrollTop = my;
}

function renderCurriculum(cv) {
  cv.style.cssText='padding:0;overflow:hidden;display:flex;flex-direction:column;flex:1';

  var curriculum = S.curriculum || CURRICULUM;
  var editMode = !!S.currEditMode;

  function saveCurr(){ save(); }
  function getCourse(){ return curriculum.find(function(c){return c.id===currCourseId;}); }
  function getUnit(course){ return (course&&course.units||[]).find(function(u){return u.id===currUnitId;}); }
  function getProj(unit){ return (unit&&unit.projects||[]).find(function(p){return p.id===currProjId;}); }

  function makeProjectTemplate(tier, sourceProj){
    var template = sourceProj ? dc(sourceProj) : {
      tier:tier,
      name:'New Project',
      pts:(CURR_TIER_PTS[tier]===undefined?2:CURR_TIER_PTS[tier]),
      desc:'',
      materials:[''],
      steps:[''],
      tip:'',
      rubric:[{name:'Category',desc:'',d:{4:'',3:'',2:'',1:'',0:''}}]
    };
    template.id = 'u'+Date.now()+Math.random().toString(36).slice(2,6);
    template.tier = tier;
    delete template.suggested;
    template.name = sourceProj && sourceProj.name ? sourceProj.name+' Copy' : 'New Project';
    template.materials = Array.isArray(template.materials) ? template.materials.slice() : [''];
    template.steps = Array.isArray(template.steps) ? template.steps.slice() : [''];
    template.rubric = Array.isArray(template.rubric) ? dc(template.rubric) : [{name:'Category',desc:'',d:{4:'',3:'',2:'',1:'',0:''}}];
    return template;

  function addProjectToTier(unitObj, tier){

// --- RICH TEXT EDITOR ---------------------------------------------
function buildEditor(placeholder, htmlContent, onSave) {
  var wrap = el('div','editor-wrap');

  // Toolbar
  var tb = el('div','editor-toolbar');

  // Font size
  var sizeSelect = el('select','tb-select');
  sizeSelect.title = 'Font size';
  [['1','Small'],['3','Normal'],['4','Large'],['5','X-Large'],['6','Huge']].forEach(function(o) {
    var opt = document.createElement('option');
    opt.value = o[0]; opt.textContent = o[1];
    if (o[0]==='3') opt.selected = true;
    sizeSelect.appendChild(opt);
  });
  sizeSelect.onchange = function() {
    document.execCommand('fontSize', false, sizeSelect.value);
    body.focus();
  };
  tb.appendChild(sizeSelect);

  var sep0 = el('div','tb-sep'); tb.appendChild(sep0);

  // Format buttons
  function tbBtn(label, cmd, val, title) {
    var btn = el('button','tb-btn');
    btn.innerHTML = label; btn.title = title || cmd;
    btn.onmousedown = function(e) {
      e.preventDefault();
      document.execCommand(cmd, false, val || null);
      body.focus();
      updateToolbarState();
    };
    tb.appendChild(btn);
    return btn;
  }

  var bBtn = tbBtn('<b>B</b>',   'bold',          null, 'Bold');
  var iBtn = tbBtn('<i>I</i>',   'italic',        null, 'Italic');
  var uBtn = tbBtn('<u>U</u>',   'underline',     null, 'Underline');
  var sBtn = tbBtn('<s>S</s>',   'strikeThrough', null, 'Strikethrough');

  var sep1 = el('div','tb-sep'); tb.appendChild(sep1);

  tbBtn('H1', 'formatBlock', 'h2', 'Heading 1');
  tbBtn('H2', 'formatBlock', 'h3', 'Heading 2');
  tbBtn('¶',  'formatBlock', 'p',  'Paragraph');

  var sep2 = el('div','tb-sep'); tb.appendChild(sep2);

  // Bullet list -- works on selection too
  var ulBtn = el('button','tb-btn'); ulBtn.textContent='• List'; ulBtn.title='Convert selection to bullet list';
  ulBtn.onmousedown = function(e) {
    e.preventDefault();
    var sel = window.getSelection();
    var selText = sel ? sel.toString().trim() : '';
    if (selText && selText.indexOf('\n') !== -1) {
      var lines = selText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
      var html = '<ul>' + lines.map(function(l){return '<li>'+l+'</li>';}).join('') + '</ul>';
      document.execCommand('insertHTML', false, html);
    } else {
      document.execCommand('insertUnorderedList', false, null);
    }
    body.focus(); updateToolbarState();
  };
  tb.appendChild(ulBtn);
  tbBtn('1. List', 'insertOrderedList', null, 'Numbered list');

  var sep3 = el('div','tb-sep'); tb.appendChild(sep3);

  // Checkbox
  var cbBtn = el('button','tb-btn');
  cbBtn.textContent = '☑ Check'; cbBtn.title = 'Convert selection to checkboxes (or insert one)';
  cbBtn.onmousedown = function(e) {
    e.preventDefault();
    var sel = window.getSelection();
    var selText = sel ? sel.toString().trim() : '';
    if (selText) {
      // Convert each selected line into a checkbox
      var lines = selText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
      var html = lines.map(function(line) {
        var uid = 'cb' + Date.now() + Math.random().toString(36).slice(2,5);
        // No "for" attr on label -- clicking text places cursor, only checkbox itself toggles
        return '<div><input type="checkbox" id="'+uid+'"><label> '+line+'</label></div>';
      }).join('');
      document.execCommand('insertHTML', false, html);
    } else {
      var uid = 'cb' + Date.now();
      document.execCommand('insertHTML', false,
        '<div><input type="checkbox" id="'+uid+'"><label> &nbsp;</label></div>'
      );
    }
    body.focus();
  };
  tb.appendChild(cbBtn);

  // Table
  var tblBtn = el('button','tb-btn');
  tblBtn.textContent = '⊞ Table'; tblBtn.title = 'Insert table';
  tblBtn.onmousedown = function(e) {
    e.preventDefault();
    var rows = parseInt(prompt('Rows?', '3') || '3', 10);
    var cols = parseInt(prompt('Columns?', '3') || '3', 10);
    if (isNaN(rows)||rows<1) rows=3;
    if (isNaN(cols)||cols<1) cols=3;
    var html = '<table>';
    // Header row
    html += '<tr>';
    for (var c=0;c<cols;c++) html += '<th>Header</th>';
    html += '</tr>';
    for (var r=0;r<rows-1;r++) {
      html += '<tr>';
      for (var cc=0;cc<cols;cc++) html += '<td>&nbsp;</td>';
      html += '</tr>';
    }
    html += '</table><p><br></p>';
    document.execCommand('insertHTML', false, html);
    body.focus();
  };
  tb.appendChild(tblBtn);

  var sep4 = el('div','tb-sep'); tb.appendChild(sep4);

  tbBtn('❝ Quote', 'formatBlock', 'blockquote', 'Block quote');
  tbBtn('-- Line',  'insertHorizontalRule', null, 'Horizontal rule');

  var sep5 = el('div','tb-sep'); tb.appendChild(sep5);

  // Align
  tbBtn('⬛L', 'justifyLeft',   null, 'Align left');
  tbBtn('⬛C', 'justifyCenter', null, 'Center');

  var sep6 = el('div','tb-sep'); tb.appendChild(sep6);

  tbBtn('↩ Undo', 'undo', null, 'Undo');
  tbBtn('↪ Redo', 'redo', null, 'Redo');

  // Body
  var body = el('div','editor-body');
  body.contentEditable = 'true';
  body.setAttribute('data-placeholder', placeholder || 'Start writing...');
  if (htmlContent) body.innerHTML = htmlContent;

  // Save on input
  body.oninput = function() {
    if (onSave) onSave(body.innerHTML);
  };

  // Fix: clicking label text in a checkbox row should place cursor, not toggle checkbox.
  // We intercept clicks on labels that have a `for` attribute and only allow the toggle
  // if the click target was the label's own element (not text inside it).
  body.addEventListener('click', function(e) {
    var t = e.target;
    if (t && t.tagName === 'LABEL' && t.htmlFor) {
      // Remove the for link so the browser doesn't auto-toggle the checkbox.
      // The checkbox itself still toggles on direct click.
      t.removeAttribute('for');
    }
  }, true); // capture phase so we intercept before browser default

  // Update toolbar bold/italic state on selection change
  function updateToolbarState() {
    bBtn.classList.toggle('on', document.queryCommandState('bold'));
    iBtn.classList.toggle('on', document.queryCommandState('italic'));
    uBtn.classList.toggle('on', document.queryCommandState('underline'));
    sBtn.classList.toggle('on', document.queryCommandState('strikeThrough'));
  }
  body.addEventListener('keyup', updateToolbarState);
  body.addEventListener('mouseup', updateToolbarState);
  body.addEventListener('keydown', function(e) {
    // Find if cursor is inside a checkbox row
    function getCheckboxRow() {
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount) return null;
      var node = sel.getRangeAt(0).startContainer;
      while (node && node !== body) {
        if (node.nodeType === 1 && node.tagName === 'DIV') {
          var cb = node.querySelector('input[type=checkbox]');
          if (cb) return node;
        }
        node = node.parentNode;
      }
      return null;
    }

    if (e.key === 'Enter') {
      var row = getCheckboxRow();
      if (row) {
        e.preventDefault();
        // Get current indent
        var currentPad = parseInt(row.style.paddingLeft) || 0;
        var uid = 'cb' + Date.now();
        var newRow = document.createElement('div');
        newRow.style.paddingLeft = currentPad ? currentPad + 'px' : '';
        newRow.innerHTML = '<input type="checkbox" id="' + uid + '"><label for="' + uid + '"> \u00a0</label>';
        row.parentNode.insertBefore(newRow, row.nextSibling);
        // Place cursor in new row's label
        var label = newRow.querySelector('label');
        var range = document.createRange();
        var sel2 = window.getSelection();
        range.setStart(label, label.childNodes.length);
        range.collapse(true);
        sel2.removeAllRanges();
        sel2.addRange(range);
        return;
      }
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      var row = getCheckboxRow();
      if (row) {
        // Indent/outdent the checkbox row
        var cur = parseInt(row.style.paddingLeft) || 0;
        var next = e.shiftKey ? Math.max(0, cur - 24) : cur + 24;
        row.style.paddingLeft = next > 0 ? next + 'px' : '';
      } else {
        document.execCommand('insertHTML', false, e.shiftKey ? '' : '\u00a0\u00a0\u00a0\u00a0');
      }
    }
  });

  wrap.appendChild(tb);
  wrap.appendChild(body);
  return {wrap: wrap, body: body};
}

// Helper: convert plain text to basic HTML (preserve newlines)
function textToHtml(txt) {
  if (!txt) return '';
  // If it already looks like HTML, return as-is
  if (txt.indexOf('<') !== -1) return txt;

  var esc = function(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var lines = txt.split('\n');
  var out = [];

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    // Blank line -> spacer
    if (!trimmed) { out.push('<p><br></p>'); continue; }

    // Heavy divider (=== or ═══) -> bold rule
    if (/^[=═]{3,}$/.test(trimmed)) {
      out.push('<hr style="border:none;border-top:2px solid var(--gold);margin:14px 0">');
      continue;
    }
    // Light divider (--- or ─── or ...) -> subtle rule
    if (/^[-─]{3,}$/.test(trimmed)) {
      out.push('<hr style="border:none;border-top:1px solid var(--br);margin:10px 0">');
      continue;
    }

    // Measure leading indent (for nesting)
    var indent = line.length - line.replace(/^\s+/, '').length;
    var pad = indent > 0 ? 'padding-left:' + (indent * 7) + 'px;' : '';

    var letters = trimmed.replace(/[^A-Za-z]/g, '');
    var isCaps = letters.length >= 3 && letters === letters.toUpperCase();
    var endsColon = /[:：]\s*$/.test(trimmed);

    // LEVEL 1 -- big title: ALL CAPS, no trailing colon, not indented
    // (e.g. "UNIT 1: PENCIL", "PROJECT OVERVIEW", "1) WORK FLOW")
    if (isCaps && !endsColon && indent === 0) {
      out.push('<p style="font-size:1.2rem;font-weight:700;color:var(--text);margin:14px 0 5px;letter-spacing:.6px">' + esc(trimmed) + '</p>');
      continue;
    }

    // LEVEL 2 -- section sub-head: ALL CAPS ending in colon, low indent
    // (e.g. "CORE SKILLS:", "BRIEF:", "MATERIALS:", "TWO TRACKS:")
    if (isCaps && endsColon && indent <= 2) {
      out.push('<p style="' + pad + 'font-size:.95rem;font-weight:700;color:var(--gold);margin:10px 0 2px;letter-spacing:.3px">' + esc(trimmed) + '</p>');
      continue;
    }

    // LEVEL 3 -- minor label: Title-case line ending in colon
    // (e.g. "Instructions:", "Concept:", "Title:")
    if (endsColon && trimmed.length < 48 && indent <= 6) {
      out.push('<p style="' + pad + 'font-weight:700;color:var(--mid);margin:6px 0 1px">' + esc(trimmed) + '</p>');
      continue;
    }

    // Body line
    out.push('<p style="' + pad + 'margin:1px 0;line-height:1.55">' + esc(trimmed) + '</p>');
  }

  return out.join('');
}

    {color:'#5e2d80',label:'Free Expression'},
  ];
  legendItems.forEach(function(li) {
    var item = el('div',''); item.style.cssText='display:flex;align-items:center;gap:5px';
    var dot = el('div',''); dot.style.cssText='width:10px;height:10px;border-radius:50%;flex-shrink:0;background:'+li.color;
    var lbl = el('span',''); lbl.textContent=li.label;

  });

  var hint = el('div','');
  hint.style.cssText = 'font-size:10px;color:var(--dim);text-align:center;margin:4px 0 2px';
  hint.textContent = 'Drag any ring to rotate it · Drag white handles on outer ring to resize · Hover for details';
  leftPanel.appendChild(hint);

  cv.appendChild(leftPanel);

  // -- RIGHT: quick info panel (notes are now their own tab) --
  var rightPanel = el('div','');
  rightPanel.style.cssText = 'flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:14px;min-width:0';

  var rnTitle = el('div','dj-label'); rnTitle.textContent = 'The Approach';
  rightPanel.appendChild(rnTitle);

  var blurb = el('div','');
  blurb.style.cssText = 'font-size:.9rem;color:var(--mid);line-height:1.7;max-width:520px';
  blurb.innerHTML = 'Ramhaus is the Bauhaus-inspired wheel behind the curriculum: an overview of everything it offers.<br><br>Click a segment to open it: mediums jump to their units, and the other rings list the projects that cover them. Each segment also keeps its own goals and notes.<br><br>The units themselves are under <b>Art Curriculum</b> in the sidebar.';
  rightPanel.appendChild(blurb);

  cv.appendChild(rightPanel);

  // -- Init wheel on the canvas --
  var SIZE = 580;
  wheelCanvas.width = SIZE*2; wheelCanvas.height = SIZE*2;
  var wCtx = wheelCanvas.getContext('2d');
  wCtx.scale(2,2);
  var wcx=SIZE/2, wcy=SIZE/2;
  var GAP=0.015;

  var R_CORE=72,R_EL_I=75,R_EL_O=147,R_MED_I=150,R_MED_O=238,R_OUT_I=241,R_OUT_O=294;
  var rotEl=0,rotMed=0,rotOut=0;

  var outerData=[
    {label:'Observation & Seeing',color:'#1e4976',tip:'<b>Observation & Seeing</b><br>Training the eye before the hand -- contour, negative space, gesture, drawing what you actually see rather than what you think you see.'},
    {label:'Proportion & Scale',color:'#193f68',tip:'<b>Proportion & Scale</b><br>Measuring relationships between parts, comparative sizing, and how scale creates meaning and spatial hierarchy.'},
    {label:'Light & Shadow',color:'#12304f',tip:'<b>Light & Shadow</b><br>Value structure, light sources, cast vs form shadow, tonal modeling -- the bridge into Color & Value in the next ring.'},
    {label:'Color Theory',color:'#0e2740',tip:'<b>Color Theory</b><br>Color wheel, hue, saturation, temperature, complementary and analogous relationships, color as an expressive tool.'},
    {label:'Art History & Context',color:'#1a3a5c',tip:'<b>Art History & Context</b><br>Key movements, artists, and cultural contexts that shaped drawing and painting.'},
    {label:'Visual Vocabulary',color:'#152f4d',tip:'<b>Visual Vocabulary</b><br>The language of art -- terms, concepts, and critical frameworks students need to describe, analyze, and discuss work.'},
  ];
  var outerLens=outerData.map(function(d){return d.label.length+5;});
  var outerTotal=outerLens.reduce(function(a,b){return a+b;},0);
  var dividers=[];
  (function(){var a=-Math.PI/2; for(var i=0;i<6;i++){dividers.push(a);a+=(outerLens[i]/outerTotal)*Math.PI*2;}})();

  var elData=[
    {label:'Line',color:'#1a5930',textColor:'#c8f0d8',tip:'<b>Line</b><br>Contour, gesture, implied, expressive. The primary tool of drawing.'},
    {label:'Shape & Form',color:'#175230',textColor:'#c8f0d8',tip:'<b>Shape & Form</b><br>2D vs 3D, positive/negative space, geometric vs organic.'},
    {label:'Color & Value',color:'#134828',textColor:'#c8f0d8',tip:'<b>Color & Value</b><br>Hue, saturation, and the full tonal range.'},
    {label:'Texture',color:'#1e5c34',textColor:'#c8f0d8',tip:'<b>Texture</b><br>Actual vs implied texture, mark-making, surface quality.'},
    {label:'Space & Perspective',color:'#174d2c',textColor:'#c8f0d8',tip:'<b>Space & Perspective</b><br>1-, 2-, 3-point perspective, foreshortening, atmospheric depth.'},
    {label:'Composition',color:'#1a5930',textColor:'#c8f0d8',tip:'<b>Composition & Unity</b><br>Rule of thirds, balance, focal point, unity, variety.'},
    {label:'Emphasis & Contrast',color:'#1e5c34',textColor:'#c8f0d8',tip:'<b>Emphasis & Contrast</b><br>Visual hierarchy, creating focus, variety vs harmony.'},
    {label:'Movement & Pattern',color:'#134828',textColor:'#c8f0d8',tip:'<b>Movement & Pattern</b><br>Leading the eye through a composition; rhythm, repetition.'},
  ];
  var medData=[
    {label:'Pencil',color:'#6b2a1a',textColor:'#fde0d0',tip:'<b>Pencil</b><br>Value, line quality, hatching, blending. The foundation of drawing.'},
    {label:'Charcoal',color:'#5c2216',textColor:'#fde0d0',tip:'<b>Charcoal</b><br>Expressive mark-making, broad tonal modeling, erasing as drawing.'},
    {label:'Ink',color:'#4d1c13',textColor:'#fde0d0',tip:'<b>Ink</b><br>Line weight, cross-hatching, wash, permanence and commitment.'},
    {label:'Pastels',color:'#7a3020',textColor:'#fde0d0',tip:'<b>Pastels</b><br>Color blending on paper, layering, soft vs hard pastel techniques.'},
    {label:'Color Pencils',color:'#6b2a1a',textColor:'#fde0d0',tip:'<b>Color Pencils</b><br>Layering color, burnishing, controlled detail and texture.'},
    {label:'Markers',color:'#5c2216',textColor:'#fde0d0',tip:'<b>Markers</b><br>Flat color, gradient blending, bold outlines, speed sketching.'},
    {label:'Tempera',color:'#7a3020',textColor:'#fde0d0',tip:'<b>Tempera Paint</b><br>Opaque flat color, mixing, layering from dark to light.'},
    {label:'Watercolor',color:'#6b2a1a',textColor:'#fde0d0',tip:'<b>Watercolor</b><br>Wet-on-wet, wet-on-dry, transparency and layering.'},
    {label:'Scratchboard',color:'#4d1c13',textColor:'#fde0d0',tip:'<b>Scratchboard</b><br>Subtractive drawing -- scratching light from dark.'},
  ];

  function buildFixed(data,r1,r2,rot){
    var n=data.length,sl=Math.PI*2/n;
    return data.map(function(d,i){return Object.assign({},d,{r1:r1,r2:r2,
      startAngle:rot-Math.PI/2+i*sl+GAP,
      endAngle:rot-Math.PI/2+(i+1)*sl-GAP,
      textColor:d.textColor||'#c8dff8'});});
  }
  function buildOuter(){
    return outerData.map(function(d,i){
      var next=(i+1)%6;
      var sa=dividers[i]+rotOut+GAP,ea=dividers[next]+rotOut-GAP;
      if(ea<=sa)ea+=Math.PI*2;
      return Object.assign({},d,{r1:R_OUT_I,r2:R_OUT_O,startAngle:sa,endAngle:ea,textColor:'#c8dff8'});
    });
  }
  function lighten(hex,a){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return 'rgb('+Math.min(255,r+a*255)+','+Math.min(255,g+a*255)+','+Math.min(255,b+a*255)+')';
  }
  function drawSeg(seg,hov){
    wCtx.save();wCtx.beginPath();
    if(seg.r1===0){wCtx.arc(wcx,wcy,seg.r2,0,Math.PI*2);}
    else{wCtx.arc(wcx,wcy,seg.r2,seg.startAngle,seg.endAngle);wCtx.arc(wcx,wcy,seg.r1,seg.endAngle,seg.startAngle,true);wCtx.closePath();}
    wCtx.fillStyle=hov?lighten(seg.color,.16):seg.color;wCtx.fill();
    wCtx.strokeStyle='rgba(255,255,255,0.35)';wCtx.lineWidth=1.5;wCtx.stroke();
    wCtx.restore();
  }
  function wrapLines(words,maxW){
    var lines=[],cur='';
    for(var wi=0;wi<words.length;wi++){var w=words[wi];var t=cur?cur+' '+w:w;if(wCtx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
    if(cur)lines.push(cur);return lines;
  }
  function drawLabel(seg){
    if(seg.r1===0){
      wCtx.save();wCtx.textAlign='center';wCtx.textBaseline='middle';
      wCtx.fillStyle='#e8d0f8';wCtx.font='700 13px sans-serif';wCtx.fillText('RAMHAUS',wcx,wcy-9);
      wCtx.font='400 10px sans-serif';wCtx.fillStyle='rgba(232,208,248,0.75)';wCtx.fillText('Free Expression',wcx,wcy+6);
      wCtx.font='400 9px sans-serif';wCtx.fillStyle='rgba(232,208,248,0.42)';wCtx.fillText('medium of choice',wcx,wcy+18);
      wCtx.restore();return;
    }
    var mid=(seg.startAngle+seg.endAngle)/2;
    var arcLen=(seg.endAngle-seg.startAngle)*(seg.r1+seg.r2)/2;
    if(arcLen<26)return;
    var lr=(seg.r1+seg.r2)/2;
    var lx=wcx+lr*Math.cos(mid),ly=wcy+lr*Math.sin(mid);
    wCtx.save();wCtx.translate(lx,ly);
    var rot=mid+Math.PI/2;
    if(rot>Math.PI*.5&&rot<Math.PI*1.5)rot-=Math.PI;
    wCtx.rotate(rot);
    var bh=seg.r2-seg.r1,fs=bh>65?11:bh>42?10:9;
    wCtx.font='500 '+fs+'px sans-serif';wCtx.fillStyle=seg.textColor;
    wCtx.textAlign='center';wCtx.textBaseline='middle';
    var words=seg.label.split(' ');
    if(arcLen<55||words.length===1){wCtx.fillText(seg.label,0,0);}
    else{var lines=wrapLines(words,arcLen*.82);var lh=fs+2.5,th=lines.length*lh;lines.forEach(function(l,i){wCtx.fillText(l,0,-th/2+i*lh+lh/2);});}
    wCtx.restore();
  }
  function drawHandles(){
    for(var i=0;i<6;i++){
      var a=dividers[i]+rotOut;
      var hr=R_OUT_I+(R_OUT_O-R_OUT_I)*.5;
      var hx=wcx+hr*Math.cos(a),hy=wcy+hr*Math.sin(a);
      wCtx.save();wCtx.beginPath();wCtx.arc(hx,hy,7,0,Math.PI*2);
      wCtx.fillStyle='rgba(255,255,255,0.18)';wCtx.fill();
      wCtx.strokeStyle='rgba(255,255,255,0.7)';wCtx.lineWidth=1.2;wCtx.stroke();
      wCtx.strokeStyle='rgba(255,255,255,0.8)';wCtx.lineWidth=1.1;
      for(var d=-2;d<=2;d+=2){wCtx.beginPath();wCtx.moveTo(hx-2.5,hy+d);wCtx.lineTo(hx+2.5,hy+d);wCtx.stroke();}
      wCtx.restore();
    }
  }

  var wAllSegs=[];
  function wRebuild(hovIdx){
    var outer=buildOuter();
    var med=buildFixed(medData,R_MED_I,R_MED_O,rotMed);
    var elS=buildFixed(elData,R_EL_I,R_EL_O,rotEl);
    var core=[{label:'RAMHAUS',r1:0,r2:R_CORE,startAngle:0,endAngle:Math.PI*2,color:'#5e2d80',textColor:'#e8d0f8',
      tip:'<b>Free Expression</b><br>Students choose their preferred medium(s) and apply everything learned to create fully personal, expressive work.'}];
    wAllSegs=core.concat(elS).concat(med).concat(outer);
    wCtx.clearRect(0,0,SIZE,SIZE);
    wAllSegs.forEach(function(s,i){drawSeg(s,i===hovIdx);});
    wAllSegs.forEach(function(s){drawLabel(s);});
    drawHandles();
  }

  var DRAG_HIT=14;
  var wState='idle',wDragHdl=-1,wDragStartA=0,wDragStartR=0,wLastHov=-1;

  function wGetHandle(mx,my){
    for(var i=0;i<6;i++){
      var a=dividers[i]+rotOut,hr=R_OUT_I+(R_OUT_O-R_OUT_I)*.5;
      var hx=wcx+hr*Math.cos(a),hy=wcy+hr*Math.sin(a);
      if(Math.hypot(mx-hx,my-hy)<DRAG_HIT)return i;
    }
    return -1;
  }
  function wGetZone(mx,my){
    var d=Math.hypot(mx-wcx,my-wcy);
    if(d<R_CORE)return 'core';
    if(d<R_EL_O)return 'el';
    if(d<R_MED_O)return 'med';
    if(d<R_OUT_O)return 'out';
    return 'none';
  }
  function wGetHov(mx,my){
    var dist=Math.hypot(mx-wcx,my-wcy);
    var angle=((Math.atan2(my-wcy,mx-wcx)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    for(var i=0;i<wAllSegs.length;i++){
      var s=wAllSegs[i];
      if(dist<s.r1||dist>s.r2)continue;
      if(s.r1===0)return i;
      var sa=((s.startAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      var ea=((s.endAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      if(sa<=ea?(angle>=sa&&angle<=ea):(angle>=sa||angle<=ea))return i;
    }
    return -1;
  }
  function wToC(e){
    var rect=wheelCanvas.getBoundingClientRect(),sc=SIZE/rect.width;
    var ex=e.touches?e.touches[0].clientX:e.clientX;
    var ey=e.touches?e.touches[0].clientY:e.clientY;
    return[(ex-rect.left)*sc,(ey-rect.top)*sc];
  }

  wheelCanvas.addEventListener('mousedown',function(e){
    var c=wToC(e),mx=c[0],my=c[1];
    var dh=wGetHandle(mx,my);
    if(dh>=0){wState='handle';wDragHdl=dh;wheelCanvas.style.cursor='grabbing';e.preventDefault();return;}
    var zone=wGetZone(mx,my);
    if(zone==='el'||zone==='med'||zone==='out'){
      wState='ring-'+zone;wDragStartA=Math.atan2(my-wcy,mx-wcx);
      wDragStartR=zone==='el'?rotEl:zone==='med'?rotMed:rotOut;
      wheelCanvas.style.cursor='grabbing';e.preventDefault();
    }
  });
  wheelCanvas.addEventListener('mousemove',function(e){
    var c=wToC(e),mx=c[0],my=c[1];
    if(wState==='handle'){dividers[wDragHdl]=Math.atan2(my-wcy,mx-wcx)-rotOut;tooltip.style.opacity='0';wRebuild(-1);return;}
    if(wState.indexOf('ring-')===0){
      var cur=Math.atan2(my-wcy,mx-wcx),delta=cur-wDragStartA;
      if(wState==='ring-el')rotEl=wDragStartR+delta;
      else if(wState==='ring-med')rotMed=wDragStartR+delta;
      else rotOut=wDragStartR+delta;
      tooltip.style.opacity='0';wRebuild(-1);return;
    }
    var dh=wGetHandle(mx,my),zone=wGetZone(mx,my);
    wheelCanvas.style.cursor=dh>=0?'ew-resize':(zone==='el'||zone==='med'||zone==='out')?'grab':'default';
    var idx=wGetHov(mx,my);
    if(idx!==wLastHov){wLastHov=idx;wRebuild(idx);}
    if(idx>=0){
      var wr=wheelWrap.getBoundingClientRect();
      var tx2=e.clientX-wr.left+14,ty2=e.clientY-wr.top+14;
      if(tx2+225>wr.width)tx2=e.clientX-wr.left-228;
      tooltip.style.left=tx2+'px';tooltip.style.top=ty2+'px';
      tooltip.innerHTML=wAllSegs[idx].tip||wAllSegs[idx].label;
      tooltip.style.opacity='1';
    } else tooltip.style.opacity='0';
  });
  window.addEventListener('mouseup',function(){
    if(wState!=='idle'){wState='idle';wDragHdl=-1;wheelCanvas.style.cursor='pointer';wRebuild(wLastHov);}
  });
  wheelCanvas.addEventListener('mouseleave',function(){
    if(wState==='idle'){wLastHov=-1;wRebuild(-1);tooltip.style.opacity='0';}
  });
  wheelCanvas.addEventListener('touchstart',function(e){
    var c=wToC(e),mx=c[0],my=c[1];
    var dh=wGetHandle(mx,my);
    if(dh>=0){wState='handle';wDragHdl=dh;e.preventDefault();return;}
    var zone=wGetZone(mx,my);
    if(zone==='el'||zone==='med'||zone==='out'){
      wState='ring-'+zone;wDragStartA=Math.atan2(my-wcy,mx-wcx);
      wDragStartR=zone==='el'?rotEl:zone==='med'?rotMed:rotOut;
      e.preventDefault();
    }
  },{passive:false});
  wheelCanvas.addEventListener('touchmove',function(e){
    if(wState==='idle')return;e.preventDefault();
    var c=wToC(e),mx=c[0],my=c[1];
    if(wState==='handle'){dividers[wDragHdl]=Math.atan2(my-wcy,mx-wcx)-rotOut;wRebuild(-1);return;}
    var cur=Math.atan2(my-wcy,mx-wcx),delta=cur-wDragStartA;
    if(wState==='ring-el')rotEl=wDragStartR+delta;
    else if(wState==='ring-med')rotMed=wDragStartR+delta;
    else rotOut=wDragStartR+delta;
    wRebuild(-1);
  },{passive:false});
  wheelCanvas.addEventListener('touchend',function(){wState='idle';wDragHdl=-1;wRebuild(-1);});

  // Click -> the segment's page: what it links to in the curriculum, plus its planning notes
  wheelCanvas.addEventListener('click', function(e) {
    if (wState !== 'idle') return;
    var c = wToC(e), mx = c[0], my = c[1];
    var idx = wGetHov(mx, my);
    if (idx < 0) return;
    var seg = wAllSegs[idx];
    if (!seg) return;
    openRamhausUnit(cv, meta, box, ch, seg);
  });

  wRebuild(-1);
}

// --- RAMHAUS WHEEL LINKS -------------------------------------------
// What a wheel segment opens in the curriculum. Mediums link to their units (intro unit + its advanced partner),
// the core links to the Masterpiece units, and the other rings list projects whose name or description match.
var RAMHAUS_UNIT_LINKS = {
  'Pencil':[1,11], 'Ink':[2,12], 'Tempera':[3,13], 'Watercolor':[4,14], 'Color Pencils':[5,15],
  'Charcoal':[6,16], 'Pastels':[7,17], 'Scratchboard':[8,18], 'Markers':[], 'RAMHAUS':[10,20]
};
var RAMHAUS_KEYWORDS = {
  'Observation & Seeing': [/observation/, /from life/, /gesture/, /still life/, /on site/, /live model/],
  'Proportion & Scale':   [/proportion/, /8 head/, /figure drawing/, /full figure/, /oversized/, /celeb/],
  'Light & Shadow':       [/\blight\b/, /shadow/, /highlight/],
  'Color Theory':         [/color theory/, /color wheel/, /complementar/, /temperature/, /palette/, /saturat/],
  'Art History & Context':[/in the style of/, /pop art/, /koons/, /burton/, /thiebaud/, /sumi-e/, /fauv/, /sparkmatik/, /mecca/],
  'Visual Vocabulary':    [/vocabulary/, /intro worksheet/],
  'Line':                 [/line (quality|weight)/, /contour/, /hatch/, /ink line/, /directional lines/, /loose line/],
  'Shape & Form':         [/\bforms?\b/, /sphere/, /extrud/, /impossible shape/, /flat shapes/, /\b3d\b/],
  'Color & Value':        [/\bvalues?\b/, /gradient/, /blend/],
  'Texture':              [/texture/, /sgraffito/, /\bfur\b/, /strokes/],
  'Space & Perspective':  [/perspective/, /vanishing/, /\bdepth\b/, /\bspace\b/],
  'Composition':          [/composition/, /layout/, /thumbnail/, /\bcrop/],
  'Emphasis & Contrast':  [/emphasis/, /contrast/, /focal/, /dramatic/, /reversal/],
  'Movement & Pattern':   [/movement/, /pattern/, /\bmotion/, /animat/, /\bloop/, /rhythm/]
};
function ramhausLinks(label) {
  var courses = (S.curriculum || []).filter(function(c){ return !c.archived; });
  var out = {units:[], projects:[], byUnit:Object.prototype.hasOwnProperty.call(RAMHAUS_UNIT_LINKS, label)};
  if (out.byUnit) {
    RAMHAUS_UNIT_LINKS[label].forEach(function(num){
      courses.forEach(function(c){ (c.units || []).forEach(function(u){ if (u.num === num) out.units.push({course:c, unit:u}); }); });
    });
    return out;
  }
  var pats = RAMHAUS_KEYWORDS[label] || [];
  courses.forEach(function(c){ (c.units || []).forEach(function(u){ (u.projects || []).forEach(function(p){
    var text = ((p.name || '') + ' ' + (p.desc || '')).toLowerCase();
    if (pats.some(function(re){ return re.test(text); })) out.projects.push({course:c, unit:u, proj:p});
  }); }); });
  return out;
}
function ramhausLinkSection(seg) {
  var links = ramhausLinks(seg.label);
  var sec = el('div','dj-section');
  var lbl = el('div','dj-label'); lbl.textContent = 'In the Curriculum';
  sec.appendChild(lbl);
  if (!links.units.length && !links.projects.length) {
    var none = el('div','rh-note');
    none.textContent = links.byUnit ? 'No unit uses ' + seg.label.toLowerCase() + ' yet.' : 'Nothing in the curriculum matches this yet.';
    sec.appendChild(none);
    return sec;
  }
  var list = el('div','rh-links');
  links.units.forEach(function(l){
    var a = el('button','rh-link'); a.type = 'button';
    a.style.setProperty('--cc', l.course.color);
    var t = el('div','rh-link-title'); t.textContent = 'Unit ' + l.unit.num + ': ' + l.unit.title;
    var s = el('div','rh-link-sub'); s.textContent = l.course.label + ' · ' + (l.unit.projects || []).length + ' projects';
    a.appendChild(t); a.appendChild(s);
    a.onclick = function(){ openUnit(l.course.id, l.unit.id); };
    list.appendChild(a);
  });
  if (links.projects.length) {
    var note = el('div','rh-note'); note.textContent = links.projects.length + ' projects mention it (matched by keyword):';
    sec.appendChild(note);
  }
  links.projects.forEach(function(l){
    var a = el('button','rh-link'); a.type = 'button';
    a.style.setProperty('--cc', l.course.color);
    var t = el('div','rh-link-title'); t.textContent = l.proj.name;
    var s = el('div','rh-link-sub'); s.textContent = 'Unit ' + l.unit.num + ': ' + l.unit.title + ' · ' + l.proj.tier;
    a.appendChild(t); a.appendChild(s);
    a.onclick = function(){ openUnit(l.course.id, l.unit.id, l.proj.id); };
    list.appendChild(a);
  });
  sec.appendChild(list);
  return sec;
}

function openRamhausUnit(cv, meta, box, ch, seg) {
  if (!ch.unitNotes) ch.unitNotes = {};
  cv.innerHTML = '';
  cv.style.cssText = 'padding:0;overflow-y:auto;display:flex;flex-direction:column;flex:1';

  var hdr = el('div','');
  hdr.style.cssText = 'display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--br);background:var(--s1);flex-shrink:0;position:sticky;top:0;z-index:10';

  var backBtn = el('button','');

function renderChapterPage(cv,meta,box) {
  var ch = curChapter ? findChapter(curChapter) : null;

    var empty = el('div','pg-sub'); empty.appendChild(tx('No pages yet -- tap + above to add one.'));
    wrap2.appendChild(empty); cv.appendChild(wrap2); return;

  var wrap = el('div','');
  var h1 = el('div','pg-h1'); h1.style.color = meta.color; h1.appendChild(tx(ch.label));
  var sub = el('div','pg-sub'); sub.appendChild(tx(page.icon + ' ' + page.label));
  wrap.appendChild(h1); wrap.appendChild(sub);

    'Write anything here -- notes, ideas, plans, tasks...',
    textToHtml(page.content||''),
    (function(pg){ return function(html){ pg.content = html; save(); }; })(page)
  );
  wrap.appendChild(ed.wrap); cv.appendChild(wrap);
  setTimeout(function(){ ed.body.focus(); }, 50);
}

// -- GLOBAL TAB KEY FIX ------------------------------------------
// Prevent Tab from shifting focus out of textareas (inputs use their own handlers).
// Skip checkboxes and any element that handles Tab itself.
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Tab') return;
  var el2 = document.activeElement;
  if (!el2) return;
  // Only handle plain text inputs and textareas
  if (el2.tagName === 'INPUT' && el2.type !== 'text' && el2.type !== 'search' && el2.type !== '') return;
  if (el2.tagName !== 'INPUT' && el2.tagName !== 'TEXTAREA') return;
  // Skip contenteditable -- handled by the rich text editor
  if (el2.isContentEditable) return;
  e.preventDefault();
  try {
    var start = el2.selectionStart;
    var end   = el2.selectionEnd;
    var spaces = '    ';
    el2.value = el2.value.substring(0, start) + spaces + el2.value.substring(end);
    el2.selectionStart = el2.selectionEnd = start + spaces.length;
    el2.dispatchEvent(new Event('input', { bubbles: true }));
  } catch(err) {}
}, true);

<!-- GitHub Sync — drop-in replacement for Firebase, same _fbLoad/_fbSave interface -->
<script>
(function(){
  // Config persisted locally (never leaves your browser except to call GitHub)
  var CFG_KEY = 'teacher_book_gh_cfg';
  function getCfg(){
    var c; try{ c = JSON.parse(localStorage.getItem(CFG_KEY)||'{}'); }catch(e){ return {}; }
    // Teaching data belongs in the private repo, never the public SUBROUTINE one
    if(String(c.owner||'').toLowerCase()==='zjaylewis94' && String(c.repo||'').toLowerCase()==='subroutine'){
      c.repo = 'subroutine-data'; delete c._sha; setCfg(c);
    }
    return c;
  }
  function setCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }

  function ghHeaders(token){
    return { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' };
  }
  function apiURL(c){
    return 'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'teacher_book_data.json')+(c.branch?('?ref='+c.branch):'');
  }

  // LOAD: returns parsed state object or null
  window._fbLoad = async function(){
    var c = getCfg();
    if(!c.token || !c.owner || !c.repo) return null;
    try{
      var res = await fetch(apiURL(c), { headers: ghHeaders(c.token) });
      if(res.status===404) return null; // file not created yet
      if(!res.ok){ console.warn('GitHub load failed:', res.status); return null; }
      var j = await res.json();
      // remember the blob sha for next write
      c._sha = j.sha; setCfg(c);
      var content = decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
      return JSON.parse(content);
    }catch(e){ console.warn('GitHub load error:', e); return null; }
  };

  // SAVE: accepts a JSON string (matches old Firebase interface)
  var saveTimer=null, pending=null;
  window._fbSave = async function(json){
    var c = getCfg();
    if(!c.token || !c.owner || !c.repo) return;
    pending = json;
    // debounce writes so we don't hammer the API on every keystroke
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1500);
  };
  async function doSave(){
    var c = getCfg();
    if(!c.token || pending===null) return;
    var body = {
      message: 'teacher book update '+new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(pending))),
      branch: c.branch || undefined
    };
    if(c._sha) body.sha = c._sha;
    try{
      var res = await fetch('https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'teacher_book_data.json'), {
        method:'PUT', headers: ghHeaders(c.token), body: JSON.stringify(body)
      });
      if(res.ok){
        var j = await res.json();
        c._sha = j.content.sha; setCfg(c);
        ghFlash('Synced to GitHub', 'var(--ok)');
      } else if(res.status===409){
        // sha conflict — refetch sha and retry once
        delete c._sha; setCfg(c);
        var r2 = await fetch(apiURL(c), { headers: ghHeaders(c.token) });
        if(r2.ok){ var jj=await r2.json(); c._sha=jj.sha; setCfg(c); return doSave(); }
      } else {
        ghFlash('Sync failed ('+res.status+')', 'var(--danger)');
      }
    }catch(e){ ghFlash('Sync error', 'var(--danger)'); }
    pending=null;
  }

  function ghFlash(msg,color){
    var el=document.getElementById('sync-status');
    if(el){ el.textContent=msg; el.style.color=color||'var(--dim)'; setTimeout(function(){ el.textContent=''; },2500); }
  }

  // ── Settings UI ──
  function openSyncSettings(){
    var c = getCfg();
    var existing = document.getElementById('gh-modal'); if(existing) existing.remove();
    var ov = document.createElement('div'); ov.id='gh-modal';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    var box = document.createElement('div');
    box.style.cssText='background:var(--s1);border:1px solid var(--br2);border-radius:14px;padding:24px;max-width:440px;width:100%;font-family:DM Sans,sans-serif';
    box.innerHTML =
      '<div style="font-family:Rajdhani,sans-serif;font-size:1rem;font-weight:700;letter-spacing:1px;color:var(--text);margin-bottom:4px">GITHUB SYNC</div>'+
      '<div style="font-size:.72rem;color:var(--dim);margin-bottom:18px;line-height:1.5">Edits save to a JSON file in your repo. Create a <b>fine-grained token</b> with Contents read/write on the repo, then paste below.</div>'+
      fld('Owner (username)','gh-owner',c.owner||'zjaylewis94')+
      fld('Repo','gh-repo',c.repo||'subroutine-data')+
      fld('Branch (optional)','gh-branch',c.branch||'')+
      fld('File path','gh-path',c.path||'teacher_book_data.json')+
      fld('Token','gh-token',c.token||'','password')+
      '<div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">'+
        '<button id="gh-cancel" style="background:none;border:1px solid var(--br2);border-radius:7px;color:var(--dim);padding:8px 14px;cursor:pointer;font-family:Rajdhani,sans-serif;font-weight:600;letter-spacing:1px">CANCEL</button>'+
        '<button id="gh-save" style="background:var(--teaching);border:none;border-radius:7px;color:#fff;padding:8px 16px;cursor:pointer;font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:1px">SAVE & SYNC</button>'+
      '</div>';
    function fld(label,id,val,type){
      return '<div style="margin-bottom:11px"><label style="display:block;font-size:.64rem;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px">'+label+'</label>'+
        '<input id="'+id+'" type="'+(type||'text')+'" value="'+(val||'').replace(/"/g,'&quot;')+'" style="width:100%;background:var(--s2);border:1px solid var(--br2);border-radius:7px;color:var(--text);padding:8px 10px;font-family:DM Sans,sans-serif;font-size:.82rem;outline:none"></div>';
    }
    ov.appendChild(box); document.body.appendChild(ov);
    document.getElementById('gh-cancel').onclick=function(){ ov.remove(); };
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    document.getElementById('gh-save').onclick=async function(){
      var nc = {
        owner: document.getElementById('gh-owner').value.trim(),
        repo: document.getElementById('gh-repo').value.trim(),
        branch: document.getElementById('gh-branch').value.trim(),
        path: document.getElementById('gh-path').value.trim()||'teacher_book_data.json',
        token: document.getElementById('gh-token').value.trim()
      };
      setCfg(nc);
      ov.remove();
      ghFlash('Connecting…','var(--gold)');
      // pull remote; if newer, hydrate
      var remote = await window._fbLoad();
      if(remote && remote._ts && (!S._ts || remote._ts > S._ts)){
        if(confirm('Found newer data on GitHub. Load it? (Cancel keeps what is on this device.)')){
          localStorage.setItem('teacher_book_v2', JSON.stringify(remote));
          location.reload(); return;
        }
      }
      // otherwise push current up
      if(typeof S!=='undefined'){ window._fbSave(JSON.stringify(S)); }
    };
  }
  window.openSyncSettings = openSyncSettings;

  // Wire the existing Sync button to settings, and do an initial pull
  document.addEventListener('DOMContentLoaded', function(){
    var sb=document.getElementById('sync-btn');
    if(sb) sb.onclick = openSyncSettings;
    var c=getCfg();
    if(c.token && c.owner && c.repo && typeof S!=='undefined'){
      window._fbLoad().then(function(remote){
        if(remote && remote._ts && (!S._ts || remote._ts > S._ts)){
          localStorage.setItem('teacher_book_v2', JSON.stringify(remote));
          location.reload();
        }
      });
    }
  });
})();
</script>

  u3: [
    {"group": "TIER 1", "title": "[TIER 1] Tempera Intro Worksheet", "pts": "2 points", "attach": "the tempera intro worksheet", "desc": "Tempera is your first real paint. Learn how to load and clean a brush, how much paint to use, and the words painters use: opacity, tint, and shade.", "steps": ["Complete every section of the worksheet.", "Paint a swatch with each brush you have (flat, round, liner) and label it.", "Paint one flat, even square with no streaks or paper showing through.", "Mix a tint (color + white) and a shade (color + black) of one color and label them.", "Clean your brushes and palette before you turn it in.", "Turn it in or just show me in class."], "focus": "Focus on even coverage, clean edges, and a clean station."},
    {"group": "TIER 1", "title": "[TIER 1] Color Theory Worksheet", "pts": "2 points", "attach": "the color theory worksheet or a color wheel template", "desc": "Start with three colors and mix everything else. Paint a full color wheel from the primaries, then add tints, shades, and complementary pairs.", "steps": ["Paint the three primaries: red, yellow, and blue.", "Mix the three secondaries: orange, green, and violet.", "Mix the six tertiaries (like red-orange and blue-green) to finish a 12-color wheel.", "Paint a tint and a shade for at least 3 colors.", "Label three complementary pairs (colors straight across the wheel from each other).", "Turn it in or just show me in class."], "focus": "Focus on accurate mixing, clean edges, and correct labels."},
    {"group": "TIER 2", "title": "[TIER 2] Blending Tubes (Smooth + Segmented)", "pts": "4 points", "attach": "a finished example", "desc": "Paint two tubes that twist through space: one blended smoothly from light to dark, and one in stepped bands of color. Same form, two ways to show it.", "steps": ["Draw two tubes that bend, loop, or twist across your page.", "Pick one light source and mark it on your page.", "Tube 1 (smooth): blend from a tint to a shade while the paint is wet, so no hard lines show.", "Tube 2 (segmented): paint at least 5 bands that step from light to dark, with crisp edges between them.", "Make each tube lighter where it faces the light and darker where it turns away.", "Turn it in or just show me in class."], "focus": "Focus on smooth blends, crisp bands, and one consistent light source."},
    {"group": "TIER 2", "title": "[TIER 2] Impossible Shape Painting", "pts": "4 points", "attach": "examples of impossible shapes (Penrose triangle, impossible cube)", "desc": "Paint an impossible figure, like a Penrose triangle, using flat value planes to sell an illusion that can't exist in real life.", "steps": ["Pick an impossible shape (Penrose triangle, impossible cube, endless staircase) and draw it with a ruler.", "Choose one color and mix 3 values of it: light, middle, and dark.", "Paint every plane that faces the same direction with the same value.", "Keep every edge sharp. Use tape if it helps.", "Paint the background in a color that makes the shape pop.", "Turn it in or just show me in class."], "focus": "Focus on clean edges, 3 clear values, and a convincing illusion."},
    {"group": "TIER 2", "title": "[TIER 2] 2D Mecca Chameleon", "pts": "4 points", "attach": "a finished example", "desc": "Paint a chameleon built from flat, bold color shapes and pattern. Keep every edge clean and every color bright.", "steps": ["Draw a chameleon large on your page: body, curled tail, feet, and eye.", "Break the body into shapes and patterns (stripes, scales, spots).", "Plan your colors: at least 6, including one complementary pair.", "Paint each shape flat and opaque, one color at a time, letting each one dry.", "Add a simple background (a branch, leaves) that doesn't compete with the chameleon.", "Clean up the edges last.", "Turn it in or just show me in class."], "focus": "Focus on bright, even color and clean edges."},
    {"group": "TIER 3", "title": "[TIER 3] Burton Morris Product Painting", "pts": "8 points", "attach": "Burton Morris examples", "desc": "Paint an oversized everyday product with bold outlines and flat color in the Pop Art style of Burton Morris. Everything from Unit 3 comes together here.", "steps": ["Look at Burton Morris's work and write down three things he does (thick black outlines, bright flat color, pop lines around the object).", "Pick an everyday product (a soda can, sneaker, candy bar, cereal box) and sketch 3 layouts. Pick the strongest.", "Draw it large so it fills most of the page. Tilt it for energy.", "Paint it in flat, bright colors, with at least one smooth or segmented blend from your tube practice.", "Paint a bold background with pop lines or a pattern.", "Add thick black outlines last and clean up every edge."], "focus": "Focus on bold color, clean outlines, and a composition that pops."},
    {"group": "WILD CARD", "title": "[WILD CARD] Disco Ball Painting", "pts": "4 points", "attach": "a finished example or a disco ball reference photo", "desc": "Paint a disco ball, using a grid of tiles and bounced color to show reflection and light.", "steps": ["Draw a circle and wrap a curved grid across it, so the tiles get smaller and squished near the edges.", "Pick a light source and the colors of the room the ball is reflecting.", "Paint each tile its own flat color: bright tiles face the light, dark tiles turn away.", "Mix reflected room colors into some of the tiles.", "Add a few pure white sparkles on the brightest tiles.", "Turn it in or just show me in class."], "focus": "Focus on tiles that follow the curve, and a clear light side and dark side."},
    {"group": "WILD CARD", "title": "[WILD CARD] Sparkmatik Blobs", "pts": "4 points", "attach": "Sparkmatik examples", "desc": "Paint a set of glossy, candy-colored blob forms with crisp highlights and color-mixed shadows, in the style of Sparkmatik.", "steps": ["Look at Sparkmatik's work and notice how the highlights and shadows are painted.", "Draw 3 or more blob shapes that overlap.", "Paint each blob with a smooth blend from its light side to its shadow side.", "Mix shadows from the blob's own color plus its complement. No black.", "Add sharp white highlights and a little reflected color from the blob next to it.", "Turn it in or just show me in class."], "focus": "Focus on glossy, smooth blends and crisp highlights."},
  ],
  u4: [
    {"group": "TIER 1", "title": "[TIER 1] Water Color Worksheet", "pts": "2 points", "attach": "the watercolor worksheet", "desc": "Watercolor works backward: you save your lights instead of adding them. Practice the washes and tricks you'll use for the rest of the unit.", "steps": ["Paint a flat wash: one even color with no streaks.", "Paint a graded wash: dark at the top, fading down to paper white.", "Paint wet-on-wet: wet the paper first, then drop in color and let it spread.", "Paint wet-on-dry: paint on dry paper for sharp edges.", "Try lifting (blot color out with a tissue) and salt texture (sprinkle salt into a wet wash).", "Label every box.", "Turn it in or just show me in class."], "focus": "Focus on controlled washes and clearly labeled examples."},
    {"group": "TIER 1", "title": "[TIER 1] Value Wash Scale", "pts": "2 points", "attach": "a finished example", "desc": "Build a value scale from one color by layering transparent washes from light to dark. No white or black paint allowed.", "steps": ["Draw a strip of 6 boxes in pencil.", "Paint a light wash over all 6 boxes and let it dry.", "Paint a second wash over boxes 2–6 and let it dry.", "Keep going, one box fewer each time, until box 6 has the most layers.", "Leave a thin strip of paper white above box 1.", "Turn it in or just show me in class."], "focus": "Focus on letting each layer dry and making even steps.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Object Study Painting", "pts": "4 points", "attach": "an object to paint, or a reference photo", "desc": "Paint a single object from observation, building its form in layers from light washes to dark details.", "steps": ["Pick an object with a simple shape and clear light (a mug, a piece of fruit, a shoe).", "Draw it lightly in pencil.", "Circle the highlights and leave them paper white.", "Paint a light first wash over everything except the highlights.", "Add a second and third layer for the middle values and shadows, letting each one dry.", "Finish with small dark details and the cast shadow.", "Turn it in or just show me in class."], "focus": "Focus on planning your lights first and building in layers."},
    {"group": "TIER 2", "title": "[TIER 2] Contour Watercolor Portrait", "pts": "4 points", "attach": "a finished example (students need a waterproof pen)", "desc": "Draw a continuous-line ink portrait, then drop loose watercolor washes over and around the lines.", "steps": ["Draw a face (yours, a friend's, or one from a photo) in one continuous line with a waterproof pen. Don't lift the pen.", "Pick 3 colors.", "Drop loose washes over the face. Let the color go outside the lines.", "Use wet-on-wet in at least one area so the colors bleed together.", "Add a darker wash in the shadows: under the nose, under the chin, and in the hair.", "Turn it in or just show me in class."], "focus": "Focus on one confident line and loose, fresh color.", "sug": true},
    {"group": "TIER 3", "title": "[TIER 3] Urban Sketching Final", "pts": "8 points", "attach": "urban sketching examples", "desc": "Draw and paint a real place, on site or from your own photo, using ink line and watercolor washes. Everything from Unit 4 comes together here.", "steps": ["Pick a real location: a street, the school, a storefront, your kitchen. Draw from life if you can, or use a photo you took yourself.", "Sketch the big shapes lightly in pencil first.", "Ink the drawing with a waterproof pen. Keep the lines loose.", "Paint light washes first (sky, walls) and save your whites.", "Layer the middle values and shadows, then the darkest darks.", "Add people, signs, or small details that make it feel like a real place."], "focus": "Focus on capturing the feel of the place, loose line, and layered washes."},
  ],
  u5: [
    {"group": "TIER 1", "title": "[TIER 1] Colored Pencil Intro Worksheet", "pts": "2 points", "attach": "the colored pencil intro worksheet", "desc": "Colored pencil builds up slowly in thin layers until it looks painted. Learn pressure control, layering, blending, and burnishing, and when to use each one.", "steps": ["Complete every section of the worksheet in colored pencil.", "Make a pressure scale: one color from the lightest touch to the heaviest press, in 5 steps.", "Layer two colors on top of each other to mix a third color.", "Blend two colors together with light, overlapping strokes.", "Burnish one swatch: press hard with a light color until the paper texture disappears.", "Turn it in or just show me in class."], "focus": "Focus on light, even layers and a smooth finish."},
    {"group": "TIER 1", "title": "[TIER 1] Color Layering Gradients", "pts": "2 points", "attach": "a finished example", "desc": "Blend two and three colors into smooth gradients by layering, with no blender. Let the colors mix right on the paper.", "steps": ["Draw 3 long rectangles.", "Rectangle 1: blend one color into a second color, dark to light.", "Rectangle 2: blend three colors that sit next to each other on the color wheel.", "Rectangle 3: blend two complementary colors and notice what happens in the middle.", "Build each one in at least 4 light layers. No pressing hard until the last layer.", "Turn it in or just show me in class."], "focus": "Focus on smooth transitions with no hard lines between colors.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Koons Dog", "pts": "4 points", "attach": "Jeff Koons Balloon Dog reference photos", "desc": "Render Jeff Koons' Balloon Dog, using layered color to show its mirror-like reflections and highlights.", "steps": ["Look at photos of the Balloon Dog and pick one angle.", "Draw the dog lightly, paying attention to where each balloon segment bends.", "Map out the highlights and reflections before you color. Leave the highlights paper white.", "Layer the base color first, then build the darks and the reflected colors from the room.", "Burnish the final layer so it looks shiny and smooth.", "Turn it in or just show me in class."], "focus": "Focus on reflections, sharp highlights, and a glossy finish."},
    {"group": "TIER 2", "title": "[TIER 2] Layered Fruit Study", "pts": "4 points", "attach": "a piece of fruit to draw, or a reference photo", "desc": "Draw a piece of fruit from observation, building at least five layers of color for its form and texture.", "steps": ["Pick a piece of fruit with interesting color and texture (an apple, a peach, a lemon).", "Draw its shape lightly and mark the light source.", "Layer 1: a light base color over everything except the highlight.", "Layers 2–4: build the form with darker and cooler colors in the shadows and warmer colors in the light.", "Layer 5: add surface texture (dots, speckles, streaks) and the cast shadow.", "Turn it in or just show me in class."], "focus": "Focus on at least five layers and believable color.", "sug": true},
    {"group": "TIER 3", "title": "[TIER 3] Half Face Celeb (Color Edition)", "pts": "8 points", "attach": "printed half-face celebrity photos", "desc": "Complete the missing half of a celebrity photo, matching its skin tones, values, and shadows in colored pencil. Everything from Unit 5 comes together here.", "steps": ["Pick a celebrity photo and glue half of it to your paper.", "Lightly draw the missing half, lining up the eyes, nose, mouth, and hairline.", "Match the skin tones by layering colors. Test them on scrap first.", "Match the values: the darkest shadows and brightest highlights should blend right into the photo.", "Finish the hair and background so the two halves read as one image."], "focus": "Focus on matching skin tones and values so the seam disappears."},
    {"group": "WILD CARD", "title": "[WILD CARD] Guided Landscape Revisited", "pts": "4 points", "attach": "your first-week landscape to compare", "desc": "Redraw your first-week landscape now that you know layering, and compare the two side by side.", "steps": ["Find your first landscape from the start of the year.", "Redraw the same scene in colored pencil at the same size.", "Use layering, blending, and burnishing from this unit.", "Add at least 3 improvements you couldn't do before (depth, color mixing, texture).", "Write 2–3 sentences about what changed.", "Turn it in or just show me in class."], "focus": "Focus on showing clear growth from your first try.", "sug": true},
    {"group": "WILD CARD", "title": "[WILD CARD] Sneaker Design", "pts": "4 points", "attach": "sneaker reference photos", "desc": "Design a custom sneaker and render it in colored pencil with shine, stitching, and texture.", "steps": ["Sketch 3 sneaker designs and pick your favorite.", "Draw it large from a side or three-quarter view.", "Plan your colors and at least 2 materials (leather, mesh, rubber, suede).", "Layer the colors, then add stitching, laces, and texture for each material.", "Add highlights and a cast shadow so it looks real.", "Turn it in or just show me in class."], "focus": "Focus on creativity, texture, and shine.", "sug": true},
  ],
  u6: [
    {"group": "TIER 1", "title": "[TIER 1] Charcoal Intro Worksheet", "pts": "2 points", "attach": "the charcoal intro worksheet", "desc": "Charcoal is messy, fast, and dramatic. Learn vine, compressed, and white charcoal, how to blend, and how to pull light out with an eraser.", "steps": ["Complete every section of the worksheet.", "Make a value scale with vine charcoal and another with compressed charcoal. Notice the difference.", "Blend a gradient with a stump, a tissue, and your finger. Label each one.", "Cover a box in dark charcoal, then erase a shape out of it (subtractive drawing).", "Keep your hand off the drawing so it doesn't smudge.", "Turn it in or just show me in class."], "focus": "Focus on a full value range and clean labels."},
    {"group": "TIER 1", "title": "[TIER 1] Toned Paper Shading", "pts": "2 points", "attach": "a finished example", "desc": "On toned paper, the paper is your middle value. Shade forms by adding darks with charcoal and highlights with white.", "steps": ["Draw a sphere, cube, and cylinder on toned paper.", "Pick one light source.", "Add the shadows and cast shadows with charcoal.", "Add the highlights with white charcoal or white pencil.", "Leave the paper showing for the middle values.", "Turn it in or just show me in class."], "focus": "Focus on using the paper as your midtone.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Charcoal Water Droplet", "pts": "4 points", "attach": "water droplet reference photos", "desc": "Render realistic water droplets by blending soft shadows and lifting out sharp highlights.", "steps": ["Tone your paper with a light, even layer of charcoal.", "Draw 3 or more droplets of different sizes.", "Darken the side of each droplet closest to the light and add a soft cast shadow on the opposite side.", "Lift out a bright highlight with a kneaded eraser, and a softer glow inside the shadow.", "Blend the background smooth so the droplets pop.", "Turn it in or just show me in class."], "focus": "Focus on the reversed light and dark inside each drop."},
    {"group": "TIER 2", "title": "[TIER 2] Still Life Practice", "pts": "4 points", "attach": "a still life setup in class", "desc": "Draw a lit still life from observation, focusing on dramatic contrast and cast shadows.", "steps": ["Pick or set up a still life of 3–5 objects with one strong light.", "Block in the big shapes lightly with vine charcoal.", "Mass in the shadows first, then the cast shadows.", "Build the darks with compressed charcoal.", "Lift out the highlights with an eraser.", "Turn it in or just show me in class."], "focus": "Focus on strong contrast and accurate shapes."},
    {"group": "TIER 2", "title": "[TIER 2] Gesture Drawings", "pts": "4 points", "attach": "a timer and a model or pose references", "desc": "Capture a model's pose in 30-second to 2-minute gestures, focusing on movement over detail.", "steps": ["Start with ten 30-second gestures. Draw the line of action first.", "Do five 1-minute gestures. Add the head, torso, and limbs as simple shapes.", "Do three 2-minute gestures. Show weight: which leg holds the body?", "Keep your arm loose and don't erase.", "Circle your 3 best gestures.", "Turn it in or just show me in class."], "focus": "Focus on movement and energy, not details.", "sug": true},
    {"group": "TIER 3", "title": "[TIER 3] Figure Drawing", "pts": "8 points", "attach": "a live model or figure references", "desc": "Draw a full figure from a live model or reference, with accurate proportions and dramatic value. Everything from Unit 6 comes together here.", "steps": ["Start with a gesture to catch the pose and the line of action.", "Check proportions: the body is about 7–8 heads tall.", "Block in the big shapes of the head, torso, arms, and legs.", "Mass in the shadows with one light source.", "Build the full value range from white to your darkest dark.", "Refine the hands, feet, and face last."], "focus": "Focus on proportion, weight, and dramatic value."},
    {"group": "WILD CARD", "title": "[WILD CARD] Expressive Self-Portrait", "pts": "4 points", "attach": "a mirror or a photo of yourself", "desc": "Draw a large, loose self-portrait that exaggerates contrast to show a mood.", "steps": ["Pick a mood you want to show (angry, calm, tired, excited).", "Take a photo or use a mirror with a strong light from one side.", "Draw large and loose with vine charcoal.", "Push the contrast further than real life to match your mood.", "Keep some areas unfinished and energetic.", "Turn it in or just show me in class."], "focus": "Focus on mood, contrast, and bold marks.", "sug": true},
    {"group": "WILD CARD", "title": "[WILD CARD] Night Scene", "pts": "4 points", "attach": "night scene reference photos", "desc": "Draw a street or room at night lit by a single lamp or window, working light out of a dark ground.", "steps": ["Cover your paper in dark charcoal.", "Pick a scene with one light source: a streetlight, a lamp, or a window.", "Sketch the big shapes lightly on top.", "Erase out the light, brightest near the source and fading away from it.", "Add details only where the light hits.", "Turn it in or just show me in class."], "focus": "Focus on one light source and a strong glow.", "sug": true},
  ],
  u7: [
    {"group": "TIER 1", "title": "[TIER 1] Pastel Intro Worksheet", "pts": "2 points", "attach": "the pastel intro worksheet", "desc": "Pastel sits between drawing and painting: you draw with pure pigment and blend it like paint. Learn soft pastel and oil pastel, and the words for both.", "steps": ["Complete every section of the worksheet.", "Make a swatch of soft pastel and oil pastel side by side. Note how each one feels.", "Layer two colors in each and blend them.", "Try light pressure and heavy pressure with each one.", "Label every swatch.", "Turn it in or just show me in class."], "focus": "Focus on clean swatches and clear labels."},
    {"group": "TIER 1", "title": "[TIER 1] Soft Pastel Blending", "pts": "2 points", "attach": "a finished example", "desc": "Practice smooth gradients and color mixing in soft pastel, blending with fingers, stumps, and paper towels.", "steps": ["Draw 3 rectangles.", "Blend two colors in the first one with your finger.", "Blend three colors in the second one with a stump.", "Blend a light-to-dark gradient in the third one with a paper towel.", "Label which tool you used for each.", "Turn it in or just show me in class."], "focus": "Focus on smooth blends with no muddy spots.", "sug": true},
    {"group": "TIER 1", "title": "[TIER 1] Oil Pastel Techniques", "pts": "2 points", "attach": "a finished technique sampler", "desc": "Try sgraffito, wax resist, and heavy layering on a technique sampler.", "steps": ["Divide your paper into 6 boxes.", "Box 1: layer 3 colors heavily.", "Box 2: sgraffito. Layer a light color, cover it with a dark color, then scratch a pattern through.", "Box 3: wax resist. Draw with oil pastel, then paint watercolor over it.", "Boxes 4–6: try blending, stippling, and hatching. Label every box.", "Turn it in or just show me in class."], "focus": "Focus on trying every technique and labeling it.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Color Blend Sunset", "pts": "4 points", "attach": "sunset reference photos", "desc": "Blend a sunset sky in soft pastel, moving through at least four colors without muddy transitions.", "steps": ["Pick a sunset reference photo.", "Lightly mark where each color band sits in the sky.", "Lay in the colors from lightest to darkest.", "Blend where each color meets the next.", "Add a dark silhouette at the bottom (trees, buildings, hills) for contrast.", "Turn it in or just show me in class."], "focus": "Focus on smooth, clean color transitions.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Sgraffito Pattern Study", "pts": "4 points", "attach": "a finished example", "desc": "Layer oil pastel colors, then scratch a pattern through the top layer to reveal the color underneath.", "steps": ["Cover your paper in bright colors of oil pastel, pressing hard.", "Cover all of it with a heavy layer of black or a dark color.", "Plan a pattern or design in your sketchbook first.", "Scratch the design through the top layer with a wooden tool or paper clip.", "Vary your lines: thick, thin, dots, and patterns.", "Turn it in or just show me in class."], "focus": "Focus on bold layers and clean scratch lines.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Complementary Shadow Study", "pts": "4 points", "attach": "an object to draw", "desc": "Draw a simple object with shadows mixed from its complement instead of black.", "steps": ["Pick a simple object with one strong color (a red apple, an orange).", "Find its complement on the color wheel.", "Draw the object and fill in its main color.", "Mix the complement into the shadow side and the cast shadow. No black.", "Add a highlight with white or a light tint.", "Turn it in or just show me in class."], "focus": "Focus on rich shadows with no black.", "sug": true},
    {"group": "TIER 3", "title": "[TIER 3] Bold Still Life", "pts": "8 points", "attach": "a still life setup in class", "desc": "Draw a still life with saturated color and strong light, filling the whole page with no bare paper. Everything from Unit 7 comes together here.", "steps": ["Set up or pick a still life of 3–5 objects with one strong light.", "Sketch the composition so the objects fill the page.", "Lay in bold base colors for every area, background included.", "Build shadows with complements, not black.", "Blend or layer until no bare paper shows.", "Add bright highlights last."], "focus": "Focus on bold color, strong light, and a full page.", "sug": true},
    {"group": "WILD CARD", "title": "[WILD CARD] Wayne Thiebaud Desserts", "pts": "4 points", "attach": "Wayne Thiebaud examples", "desc": "Draw a row of cakes or pies with thick color and colored shadows, in the style of Wayne Thiebaud.", "steps": ["Look at Wayne Thiebaud's paintings and notice his colored outlines and shadows.", "Draw a row of 3–5 desserts on a counter.", "Fill them with thick, bold color.", "Add colored shadows (blue, purple) instead of gray.", "Outline some edges in a bright color, like he does.", "Turn it in or just show me in class."], "focus": "Focus on thick color and colored shadows.", "sug": true},
  ],
  u8: [
    {"group": "TIER 1", "title": "[TIER 1] Scratchboard Intro Worksheet", "pts": "2 points", "attach": "the scratchboard intro worksheet", "desc": "Scratchboard flips drawing upside down: you start with black and scratch your way to the light. Learn the tools, how to scratch safely, and the basic marks.", "steps": ["Complete every section of the worksheet.", "Practice hatching, crosshatching, and stippling in reverse.", "Make a value scale from black to white by scratching more and more lines.", "Practice curved lines that follow a form.", "Always scratch away from your body, and keep your tools capped when you're done.", "Turn it in or just show me in class."], "focus": "Focus on control and safe tool use."},
    {"group": "TIER 1", "title": "[TIER 1] Value Reversal Study", "pts": "2 points", "attach": "a finished example", "desc": "Draw a simple form on black by scratching out its highlights first, then its midtones.", "steps": ["Pick a simple form: a sphere, an egg, or a cup.", "Lightly mark the outline with a white pencil.", "Scratch the brightest highlight first.", "Scratch lighter, looser lines for the midtones.", "Leave the shadow side and the cast shadow mostly black.", "Turn it in or just show me in class."], "focus": "Focus on thinking in reverse: light first.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Texture Sampler", "pts": "4 points", "attach": "a texture reference sheet", "desc": "Scratch a grid of textures, such as fur, feathers, scales, wood, and water, each in its own box.", "steps": ["Divide your board into 6–9 boxes.", "Scratch a different texture in each box: fur, feathers, scales, wood, water, rock, and more.", "Use line direction to show how each texture moves.", "Label each box.", "Circle your strongest texture.", "Turn it in or just show me in class."], "focus": "Focus on line direction and variety.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Animal Eye Study", "pts": "4 points", "attach": "close-up animal eye reference photos", "desc": "Render a close-up animal eye with its reflection and the fur, feathers, or scales around it.", "steps": ["Pick a close-up photo of an animal eye.", "Lightly map the eye and the texture around it with a white pencil.", "Scratch the bright reflection in the eye first.", "Build the iris with lines that radiate out from the pupil.", "Scratch the fur, feathers, or scales around the eye, following their direction.", "Turn it in or just show me in class."], "focus": "Focus on the eye's reflection and directional texture.", "sug": true},
    {"group": "TIER 3", "title": "[TIER 3] Scratchboard Animal", "pts": "8 points", "attach": "animal reference photos", "desc": "Render an animal from reference, using directional lines to show its fur, feathers, or scales. Everything from Unit 8 comes together here.", "steps": ["Pick a high-contrast animal photo.", "Transfer the outline lightly with a white pencil or transfer paper.", "Plan your lightest areas and scratch them first.", "Build the texture with lines that follow the direction of the fur, feathers, or scales.", "Leave the darkest areas black.", "Refine the eyes and details last."], "focus": "Focus on directional texture and a full range of value."},
    {"group": "WILD CARD", "title": "[WILD CARD] Colored Scratchboard", "pts": "4 points", "attach": "a finished example", "desc": "Add ink or watercolor over your scratched lines to bring color into one area of emphasis.", "steps": ["Finish a scratchboard drawing, or use one you already made.", "Pick one area to be the focal point.", "Paint a thin layer of ink or watercolor over the scratched lines in that area.", "Keep the rest black and white.", "Let it dry, then scratch back any highlights you lost.", "Turn it in or just show me in class."], "focus": "Focus on color that pulls the eye to one spot.", "sug": true},
  ],
  u9: [
    {"group": "TIER 1", "title": "[TIER 1] Animation Intro Worksheet", "pts": "2 points", "attach": "the animation intro worksheet", "desc": "Animation is drawing in time. Learn key frames, in-betweens, frame rate, and the principles that make movement believable.", "steps": ["Complete every section of the worksheet.", "Define key frame, in-between, and frame rate in your own words.", "Draw the key frames of a ball dropping, then add the in-betweens.", "Match three animation principles to examples (like squash and stretch, or anticipation).", "Watch one short cartoon clip and name a principle you see.", "Turn it in or just show me in class."], "focus": "Focus on understanding how frames create movement."},
    {"group": "TIER 1", "title": "[TIER 1] Flipbook", "pts": "2 points", "attach": "sticky notes or a blank flipbook", "desc": "Draw a flipbook of at least 24 frames showing one simple action, like a growing plant or a melting ice cream cone.", "steps": ["Pick one simple action.", "Draw the first and last frames.", "Draw the middle frame, then fill in the rest.", "Keep each frame in the same spot on the page so it doesn't jump.", "Flip it and fix any frames that pop.", "Turn it in or just show me in class."], "focus": "Focus on smooth, small changes between frames.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Bouncing Ball", "pts": "4 points", "attach": "a bouncing ball demo", "desc": "Animate a ball bouncing to a stop, using squash, stretch, and spacing to show weight.", "steps": ["Draw the path of the ball: each bounce lower than the last.", "Space the frames close together at the top of each arc and far apart near the ground.", "Squash the ball when it hits the ground and stretch it as it falls fast.", "Animate at least 3 bounces until it rolls to a stop.", "Play it back and adjust the timing.", "Turn it in or just show me in class."], "focus": "Focus on weight, timing, and spacing.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Looping GIF", "pts": "4 points", "attach": "looping GIF examples", "desc": "Create a seamless 8 to 12 frame loop, such as a flickering flame, a waving flag, or blinking eyes.", "steps": ["Pick an action that can repeat forever.", "Draw 8–12 frames.", "Make the last frame lead right back into the first frame.", "Export or photograph your frames and make a GIF.", "Watch it loop and fix any jumps.", "Turn it in or just show me in class."], "focus": "Focus on a smooth loop with no jump.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Zoetrope Strip", "pts": "4 points", "attach": "the zoetrope template", "desc": "Draw a looping strip for a zoetrope and watch your animation spin.", "steps": ["Get a zoetrope strip template.", "Plan a simple looping action (a runner, a bird flapping, a jumping frog).", "Draw one frame in each box, with small changes between them.", "Make the last frame loop back to the first.", "Put the strip in the zoetrope and spin it.", "Turn it in or just show me in class."], "focus": "Focus on a clean loop and consistent drawings.", "sug": true},
    {"group": "TIER 3", "title": "[TIER 3] 10-Second Short", "pts": "8 points", "attach": "a storyboard template", "desc": "Storyboard and animate a 10-second scene with a clear beginning, middle, and end. Everything from Unit 9 comes together here.", "steps": ["Write a one-sentence story with a beginning, middle, and end.", "Storyboard it in 6–9 panels.", "Plan your timing: 10 seconds at 12 frames per second is 120 frames.", "Animate the key frames first, then the in-betweens.", "Use at least 2 animation principles (squash and stretch, anticipation, follow-through).", "Export it and add sound if you can."], "focus": "Focus on clear storytelling and believable timing.", "sug": true},
    {"group": "WILD CARD", "title": "[WILD CARD] Rammy Mini Lesson", "pts": "4 points", "attach": "Rammy character sheet", "desc": "Animate Rammy, the Ramhaus mascot, teaching one art skill from this year in a 15-second short.", "steps": ["Pick one art skill from this year to teach.", "Write a short script: what Rammy says and does.", "Storyboard the lesson in 6 or more panels.", "Animate Rammy demonstrating the skill.", "Add text or voice so viewers can follow along.", "Turn it in or just show me in class."], "focus": "Focus on teaching one skill clearly in 15 seconds.", "sug": true},
  ],
  u10: [
    {"group": "TIER 1", "title": "[TIER 1] Masterpiece Intro Worksheet", "pts": "2 points", "attach": "the masterpiece intro worksheet", "desc": "This is your capstone: one piece, your choice of medium, your idea. Look back at every medium from the year and choose the one you'll use.", "steps": ["Complete every section of the worksheet.", "List every medium from this year and rate how well you control each one.", "Pick your medium and explain why in 2–3 sentences.", "Pick 3 of your past pieces that you're proud of and say what worked.", "Write down one idea you want your masterpiece to say.", "Turn it in or just show me in class."], "focus": "Focus on honest reflection and a clear choice."},
    {"group": "TIER 1", "title": "[TIER 1] Project Proposal", "pts": "2 points", "attach": "the proposal template", "desc": "Write a short plan with your idea, medium, references, and timeline, and get it approved.", "steps": ["Write your idea in 2–3 sentences: what will it show, and what will it say?", "Name your medium and your size.", "Collect 3 or more reference images.", "Make a timeline with a date for each step.", "Get my approval before you start.", "Turn it in or just show me in class."], "focus": "Focus on a clear, doable plan.", "sug": true},
    {"group": "TIER 1", "title": "[TIER 1] Thumbnail Sketches", "pts": "2 points", "attach": "a finished example", "desc": "Draw at least three thumbnail compositions and pick the strongest with a partner's feedback.", "steps": ["Draw 3 or more small thumbnails (about 2 x 3 inches) of your idea.", "Try a different layout in each one: close up, far away, a different angle.", "Show them to a partner and ask which is strongest and why.", "Circle your pick and write one sentence about why it works.", "Turn it in or just show me in class."], "focus": "Focus on trying truly different layouts.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Medium Test Panels", "pts": "4 points", "attach": "a finished example", "desc": "Test your planned colors, textures, and techniques on scrap before you touch the final.", "steps": ["Make 3–4 small test panels on the same paper or surface as your final.", "Test your color palette.", "Test any texture or technique you plan to use.", "Test one small detail from your final (an eye, a hand, a reflection).", "Write a note on each panel: keep it or change it.", "Turn it in or just show me in class."], "focus": "Focus on solving problems before the final.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Composition Study", "pts": "4 points", "attach": "a finished example", "desc": "Draw a full-size value sketch of your final layout to test the composition before you commit.", "steps": ["Draw your chosen layout at full size, in pencil or charcoal.", "Shade it in 3–5 values only. No details.", "Check your focal point: where does the eye go first?", "Fix anything that feels crowded or empty.", "Get feedback from a partner before you move on.", "Turn it in or just show me in class."], "focus": "Focus on strong values and a clear focal point.", "sug": true},
    {"group": "TIER 3", "title": "[TIER 3] Final Masterpiece", "pts": "8 points", "attach": "your approved proposal and composition study", "desc": "Create a finished, original work in your chosen medium that shows the best of what you learned this year. Everything from this course comes together here.", "steps": ["Follow your approved proposal and composition study.", "Work from big shapes to small details.", "Check in with me at least twice while you work.", "Use at least 3 techniques you learned this year.", "Give it a title and write a 3–5 sentence artist statement.", "Present it in the final critique."], "focus": "Focus on craftsmanship, originality, and a finished, show-ready piece.", "sug": true},
    {"group": "WILD CARD", "title": "[WILD CARD] Art Show Setup", "pts": "4 points", "attach": "the art show layout plan", "desc": "Help hang and label the end-of-year art show, and write the placard for your own piece.", "steps": ["Help plan where each group of work will hang.", "Hang work straight and at eye level.", "Make labels with each title, artist, and medium.", "Write a placard for your own piece: title, medium, and a 2–3 sentence statement.", "Help clean up and take the show down at the end.", "Turn it in or just show me in class."], "focus": "Focus on teamwork and a clean, professional show.", "sug": true},
  ],
  u11: [
    {"group": "TIER 1", "title": "[TIER 1] Pencil Intro Worksheet+", "pts": "2 points", "attach": "the pencil intro worksheet+", "desc": "You already know how to shade a sphere. Review pencil grades and value zones, then push into edge control, lost and found edges, and full-range values.", "steps": ["Complete every section of the worksheet.", "Make a 10-step value scale from paper white to your darkest dark.", "Draw one form with hard edges, soft edges, and lost edges, and label each one.", "Shade a sphere using all five value zones in under 10 minutes.", "Circle the one skill you most want to push this unit.", "Turn it in or just show me in class."], "focus": "Focus on a true full value range and intentional edges."},
    {"group": "TIER 1", "title": "[TIER 1] Advanced Gradients", "pts": "2 points", "attach": "a finished example", "desc": "Blend long, seamless gradients across curved and flat planes without visible steps.", "steps": ["Draw a long rectangle and shade it from white to your darkest dark with no visible steps.", "Draw a cylinder and a sphere and blend gradients that follow their curves.", "Draw a cube and give each face its own flat, even value.", "Use at least 3 pencil grades and no blending stump on one of the gradients.", "Squint to check for any bands or stripes, and fix them.", "Turn it in or just show me in class."], "focus": "Focus on seamless transitions and smooth pencil control."},
    {"group": "TIER 2", "title": "[TIER 2] Fruit Studies", "pts": "4 points", "attach": "fruit to draw from observation", "desc": "Draw fruit from observation, matching subtle value shifts and surface texture.", "steps": ["Pick 2–3 pieces of fruit with different textures (an orange, a banana, a strawberry).", "Set them up under one light source.", "Draw the shapes lightly, checking proportions as you go.", "Shade the form first, then add surface texture (dimples, seeds, speckles).", "Add cast shadows and reflected light where the fruit touches the table.", "Turn it in or just show me in class."], "focus": "Focus on subtle value shifts and believable texture."},
    {"group": "TIER 2", "title": "[TIER 2] Constructing + Editing Form", "pts": "4 points", "attach": "a construction demo", "desc": "Build complex objects from basic forms, then refine the drawing by editing edges and proportions.", "steps": ["Pick a complex object (a sneaker, a teapot, a camera, a lamp).", "Break it down into basic forms: boxes, cylinders, spheres, and cones.", "Draw those forms lightly, overlapping them to build the object.", "Edit: erase the extra lines, fix proportions, and refine the edges.", "Shade the final drawing with one light source.", "Turn it in or just show me in class."], "focus": "Focus on strong construction and careful editing."},
    {"group": "TIER 2", "title": "[TIER 2] Cast Shadow Studies", "pts": "4 points", "attach": "cast shadow reference photos", "desc": "Draw how cast shadows stretch, bend, and soften as they fall across different surfaces.", "steps": ["Set up a simple object with one strong light.", "Draw its shadow on a flat surface.", "Draw the same shadow falling over a step or a curved surface, and show how it bends.", "Show the shadow getting softer and lighter the farther it falls from the object.", "Draw 3 studies total, each with a different surface.", "Turn it in or just show me in class."], "focus": "Focus on shadow shape, direction, and edge softness."},
    {"group": "TIER 3", "title": "[TIER 3] Surrealist Forms Landscape", "pts": "8 points", "attach": "surrealist landscape examples (Dalí, Magritte)", "desc": "Invent a surreal landscape of impossible forms that still follow one consistent light source. Everything from Unit 11 comes together here.", "steps": ["Look at surrealist artists like Salvador Dalí and René Magritte and note what makes a scene feel like a dream.", "Sketch 3 ideas for an impossible landscape and pick the strongest.", "Construct your forms from basic shapes, even the impossible ones.", "Pick one light source and shade every form and cast shadow from it.", "Use seamless gradients in the sky or ground.", "Refine edges so the focal point is sharpest."], "focus": "Focus on creativity, consistent light, and full value range."},
    {"group": "WILD CARD", "title": "[WILD CARD] Tunnel Book", "pts": "4 points", "attach": "a finished example or a how-to video", "desc": "Build a tunnel book of five or more layers, each one shaded to push atmospheric depth.", "steps": ["Pick a scene with a clear foreground, middle ground, and background.", "Plan at least 5 layers on scratch paper.", "Draw each layer on cardstock and cut an opening in each one so you can see through to the layers behind it.", "Shade with atmospheric depth: dark and detailed in front, lighter and softer as the layers go back.", "Fold two accordion strips for the sides and glue each layer into its own fold.", "Turn it in or just show me in class."], "focus": "Focus on depth, clean cuts, and craftsmanship."},
    {"group": "WILD CARD", "title": "[WILD CARD] Food Truck", "pts": "4 points", "attach": "food truck reference photos", "desc": "Design a food truck in two-point perspective, with a full menu, branding, and a shaded 3D body.", "steps": ["Invent your business: a name, what you sell, and a logo.", "Draw a horizon line and two vanishing points, then build the truck as a box in two-point perspective.", "Shape it: windshield, wheels, serving window, and awning.", "Add your branding and a menu board with at least 8 items and prices, following the perspective.", "Pick one light source and shade the truck body, the wheels, and the cast shadow.", "Turn it in or just show me in class."], "focus": "Focus on accurate two-point perspective, branding, and shading."},
  ],
  u12: [
    {"group": "TIER 1", "title": "[TIER 1] Pen + Ink Intro Worksheet+", "pts": "2 points", "attach": "the pen + ink intro worksheet+", "desc": "Review ink tools and vocabulary, then add brush pens, dip pens, and ink dilution to your toolkit.", "steps": ["Complete every section of the worksheet.", "Test a fine liner, a brush pen, and a dip pen, and label each swatch.", "Dilute ink into 4 values (full strength to very light) and paint a swatch of each.", "Draw one line that goes from thin to thick with a brush pen.", "Write one sentence on when you'd use each tool.", "Turn it in or just show me in class."], "focus": "Focus on controlled marks and clear labels."},
    {"group": "TIER 1", "title": "[TIER 1] Pen Shading Techniques", "pts": "2 points", "attach": "a finished example", "desc": "Build value scales in hatching, crosshatching, stippling, and scribbling, with tighter control and a wider range.", "steps": ["Draw 4 rows of 7 boxes. Label the rows hatching, crosshatching, stippling, and scribbling.", "In each row, go from paper white to solid black in even steps.", "Keep the spacing even. Get darker by adding marks, not by pressing harder.", "Below the scales, shade one sphere with two techniques combined.", "Squint and fix any steps that look the same.", "Turn it in or just show me in class."], "focus": "Focus on even steps and a full range from white to black."},
    {"group": "TIER 1", "title": "[TIER 1] Line Quality + Line Weights", "pts": "2 points", "attach": "a line weight example", "desc": "Use line weight to show light direction, overlap, and distance in a single contour drawing.", "steps": ["Set up 3–5 overlapping objects with one light source.", "Draw them in contour line only. No shading.", "Use thick lines on the shadow side and thin lines on the lit side.", "Use thicker lines for objects in front and thinner lines for objects farther back.", "Break the line where the light hits hardest.", "Turn it in or just show me in class."], "focus": "Focus on line weight that shows light and depth."},
    {"group": "TIER 2", "title": "[TIER 2] Contour Line Forms/Objects", "pts": "4 points", "attach": "objects to draw from observation", "desc": "Draw complex objects with cross-contour lines that wrap around each form to describe its surface.", "steps": ["Pick 2–3 objects with curves (a shoe, a bottle, a piece of fruit, a helmet).", "Draw the outer contour lightly in pencil.", "Ink cross-contour lines that wrap around each form, like lines on a map.", "Space the lines closer together in the shadows.", "Erase the pencil and add line weight to the outer edges.", "Turn it in or just show me in class."], "focus": "Focus on lines that follow the form."},
    {"group": "TIER 2", "title": "[TIER 2] Ink Wash Blockout / Pen Texture", "pts": "4 points", "attach": "a finished example", "desc": "Block in values with diluted ink wash, then layer pen texture on top for detail.", "steps": ["Pick a subject with strong light and shadow.", "Sketch it lightly in pencil.", "Paint 3 values of ink wash: light, middle, and dark. Let each one dry.", "Once it's dry, add pen texture and detail on top.", "Keep some areas wash-only so the two techniques contrast.", "Turn it in or just show me in class."], "focus": "Focus on clean wash values and crisp pen detail."},
    {"group": "TIER 3", "title": "[TIER 3] Ink Wash (Sumi-e)", "pts": "8 points", "attach": "Sumi-e examples and a brush demo", "desc": "Paint a subject in the Sumi-e tradition, using as few brushstrokes as possible to capture its essence. Everything from Unit 12 comes together here.", "steps": ["Look at Sumi-e paintings and notice how few strokes each one uses.", "Practice the basic strokes (bamboo, leaves, branches) on scrap paper.", "Pick a subject from nature: bamboo, a bird, a fish, a branch, a mountain.", "Mix 3 values of ink and plan your painting.", "Paint it with as few strokes as you can. Don't go back over a stroke.", "Leave plenty of empty space. It's part of the composition."], "focus": "Focus on confident brushstrokes and restraint."},
    {"group": "WILD CARD", "title": "[WILD CARD] Inktober", "pts": "1 point per 2 Drawings", "attach": "How To Do Inktober! (YouTube) and this year's prompt list image", "desc": "Challenge yourself with daily ink drawings based on fun prompts. It's all about creativity, consistency, and having fun with black ink (or digital \"ink\")", "steps": ["Use the prompt list to inspire each drawing. OR come up with your own prompt!", "You may start with a pencil sketch, but it has to be finished in black ink.", "Turn them in stapled together or just show me in class."], "focus": "Focus on line quality, creativity, and effort."},
    {"group": "WILD CARD", "title": "[WILD CARD] Halloween Masks", "pts": "4 points", "attach": "example masks or a paper mache how-to video", "desc": "Design and build your own paper mache Halloween mask, then paint a design on it. Scary, funny, or just strange: it's your call.", "steps": ["Sketch 3 mask ideas in your sketchbook and pick the strongest one.", "Build the base form (a balloon, a mask form, or cardboard) and cover it with 3 layers of paper mache. Let each layer dry.", "Add 3D features like horns, a nose, or ears with cardboard or rolled paper, then mache over them.", "Paint a base coat, then paint your design. Use at least 2 colors and one pattern.", "Add outlines and details with marker or ink.", "Turn it in or just show me in class."], "focus": "Focus on craftsmanship, creativity, and effort."},
    {"group": "WILD CARD", "title": "[WILD CARD] Tunnel Book", "pts": "4 points", "attach": "a finished example or a how-to video", "desc": "Build a layered tunnel book where each cut paper layer steps back in space to create depth. Look through the front and the scene should feel like it keeps going.", "steps": ["Pick a scene with a clear foreground, middle ground, and background (forest, city street, underwater, a stage...).", "Plan at least 4 layers on scratch paper: a front frame, 2 or more middle layers, and a back wall.", "Draw each layer on cardstock and cut out an opening in each one so you can see through to the layers behind it.", "Add value in pencil or ink: darker and more detailed up front, lighter and simpler as the layers go back.", "Fold two accordion strips for the sides and glue each layer into its own fold.", "Turn it in or just show me in class."], "focus": "Focus on depth, clean cuts, and craftsmanship."},
    {"group": "WILD CARD", "title": "[WILD CARD] Food Truck", "pts": "4 points", "attach": "the fold-up food truck template", "desc": "Design your own food truck, then fold it into a 3D model. Invent the food, name the business, and make it look like somewhere people would line up.", "steps": ["Invent your business: a name, what you sell, and a logo.", "Sketch your design lightly on each flat panel of the template: windshield and wheels on the front and sides, a serving window and awning on one side.", "Add signage with your business name and a menu board with at least 5 items and prices.", "Finish it in pencil or ink with clean lines and at least 3 values of shading.", "Cut, fold, and glue it into its 3D shape.", "Turn it in or just show me in class."], "focus": "Focus on creativity, craftsmanship, and effort."},
    {"group": "WILD CARD", "title": "[WILD CARD] Festival of Arts Submission", "pts": "8 points", "attach": "the Festival of Arts entry rules and deadline", "desc": "Make one finished, original artwork to submit to the Festival of Arts. Any medium from this class works. This is your chance to have your art shown.", "steps": ["Brainstorm 3 ideas in your sketchbook. Pick one that says something about you or your world.", "Show me your plan before you start the final.", "Make your artwork in any medium we've learned. It has to be your own original idea, not copied from a photo or another artist.", "Give it a title and write a 2–3 sentence artist statement: what it is, what it means, and how you made it.", "Turn in the artwork and the statement together."], "focus": "Focus on craftsmanship, originality, and a finished, show-ready piece."},
  ],
  u13: [
    {"group": "TIER 1", "title": "[TIER 1] Acrylic Intro Worksheet", "pts": "2 points", "attach": "the acrylic intro worksheet", "desc": "Acrylic is fast, flexible, and dries quickly. Learn how to handle it, which brushes to use, how to prep a canvas, and how to take care of your palette.", "steps": ["Complete every section of the worksheet.", "Paint a swatch with a flat, a round, and a filbert brush, and label each one.", "Paint a smooth, flat square with no streaks.", "Try a glaze: a thin, see-through layer over a dry color.", "Clean your brushes right away. Acrylic ruins brushes once it dries.", "Turn it in or just show me in class."], "focus": "Focus on even paint handling and a clean station."},
    {"group": "TIER 1", "title": "[TIER 1] Color Theory / Value Scales Worksheet+", "pts": "2 points", "attach": "the color theory / value scales worksheet+", "desc": "Mix tints, shades, and tones, and build a matched value scale for each color on the wheel.", "steps": ["Paint a 12-color wheel from the primaries.", "For each color, mix a tint (+ white), a shade (+ black), and a tone (+ gray).", "Build a 5-step value scale for at least 3 colors.", "Match the value steps across colors, so step 3 of each color is equally dark.", "Label everything.", "Turn it in or just show me in class."], "focus": "Focus on accurate mixing and matched values."},
    {"group": "TIER 2", "title": "[TIER 2] That's a Wrap!", "pts": "4 points", "attach": "wrapped object reference photos", "desc": "Paint a wrapped object, capturing the folds, crinkles, and highlights of foil or plastic.", "steps": ["Wrap an object in foil or plastic, or pick a reference photo.", "Draw the big shapes and the main folds lightly.", "Block in the darkest darks and the middle values first.", "Paint the sharp highlights on the crinkles last.", "Add reflected colors from the room into the wrapper.", "Turn it in or just show me in class."], "focus": "Focus on crisp highlights and believable crinkles."},
    {"group": "TIER 2", "title": "[TIER 2] Sparkmatik Blobs", "pts": "4 points", "attach": "Sparkmatik examples", "desc": "Paint glossy blob forms with smooth acrylic blends, crisp highlights, and reflected color, in the style of Sparkmatik.", "steps": ["Look at Sparkmatik's work and notice the glossy highlights and colored shadows.", "Draw 3 or more blob forms that overlap.", "Blend each blob from its light side to its shadow side while the paint is wet, or with glazes.", "Mix shadows from the blob's color plus its complement. No black.", "Add sharp highlights and reflected color from the blobs next to it.", "Turn it in or just show me in class."], "focus": "Focus on smooth blends and a glossy finish."},
    {"group": "TIER 2", "title": "[TIER 2] 3D Mecca Chameleon", "pts": "4 points", "attach": "a finished example", "desc": "Paint a chameleon with full form, light, and texture instead of flat shapes.", "steps": ["Draw a chameleon large on your page, on a branch.", "Pick one light source.", "Paint each part of the body with a gradient from light to shadow so it looks round.", "Add scale texture and pattern that follow the curve of the body.", "Paint a background that makes the chameleon pop.", "Turn it in or just show me in class."], "focus": "Focus on form, light, and texture."},
    {"group": "TIER 3", "title": "[TIER 3] Candy Box", "pts": "8 points", "attach": "candy box reference photos", "desc": "Paint a candy box composition that shows off color, reflection, and packaging detail. Everything from Unit 13 comes together here.", "steps": ["Set up or photograph an open candy box, or a box with wrapped candy around it.", "Plan the composition with a thumbnail sketch.", "Draw it on your canvas or paper.", "Block in the big color areas and the darks.", "Paint wrappers, foil, and shiny candy with crisp highlights and reflected color.", "Add the packaging details: logos, patterns, and text."], "focus": "Focus on color, reflection, and detail."},
    {"group": "WILD CARD", "title": "[WILD CARD] Vector Painting", "pts": "4 points", "attach": "vector art examples", "desc": "Paint an image in flat, hard-edged color shapes inspired by vector art.", "steps": ["Pick a subject: a portrait, an animal, or an object.", "Simplify it into flat shapes of color, with no blending.", "Plan 4–5 values for each color area.", "Paint each shape flat with crisp edges. Use tape if it helps.", "Make sure the shapes still read as light and shadow.", "Turn it in or just show me in class."], "focus": "Focus on clean edges and simplified shapes."},
  ],
  u14: [
    {"group": "TIER 1", "title": "[TIER 1] Water Color Worksheet+", "pts": "2 points", "attach": "the watercolor worksheet+", "desc": "Review washes and layering, then add glazing, granulation, masking fluid, and lifting.", "steps": ["Complete every section of the worksheet.", "Paint a flat wash, a graded wash, and a wet-on-wet wash.", "Glaze: paint a second color over a dry wash and see how they mix.", "Try masking fluid: mask a shape, paint over it, then peel it off.", "Try granulation and lifting, and label every box.", "Turn it in or just show me in class."], "focus": "Focus on controlled techniques and clear labels."},
    {"group": "TIER 1", "title": "[TIER 1] Limited Palette Study", "pts": "2 points", "attach": "a finished example", "desc": "Paint a small scene using only three colors plus water, mixing every other color you need.", "steps": ["Pick 3 colors (for example, one red, one yellow, and one blue).", "Mix a small color chart from them before you start.", "Paint a small landscape or still life, about 5 x 7 inches.", "Mix every color in the painting from your 3 colors.", "Write down which 3 colors you used.", "Turn it in or just show me in class."], "focus": "Focus on mixing and color harmony.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Sweet Treats Painting", "pts": "4 points", "attach": "dessert reference photos", "desc": "Paint a dessert in layered watercolor, then add colored pencil details for texture and shine.", "steps": ["Pick a dessert reference: a donut, a cupcake, a slice of cake.", "Draw it lightly and save your highlights.", "Paint light washes first, then layer the middle values and shadows.", "Let it dry completely.", "Add colored pencil on top for sprinkles, crumbs, texture, and sharp highlights.", "Turn it in or just show me in class."], "focus": "Focus on layered washes and crisp pencil details."},
    {"group": "TIER 2", "title": "[TIER 2] Still Life Practice", "pts": "4 points", "attach": "a still life setup in class", "desc": "Paint a still life from observation, planning your lights before your first wash.", "steps": ["Set up or pick a still life of 3–5 objects with one light source.", "Draw it lightly and circle the areas you'll save as paper white.", "Paint the lightest washes first.", "Build the middle values and shadows in layers, letting each one dry.", "Finish with the darkest darks and small details.", "Turn it in or just show me in class."], "focus": "Focus on planning your lights and building in layers."},
    {"group": "TIER 3", "title": "[TIER 3] Urban Sketching Final", "pts": "8 points", "attach": "urban sketching examples", "desc": "Draw and paint a real location on site, capturing its atmosphere with loose line and layered washes. Everything from Unit 14 comes together here.", "steps": ["Pick a real place and draw it on site if you can.", "Sketch the big shapes quickly. Aim for the feeling of the place, not every detail.", "Ink loose lines with a waterproof pen.", "Paint light washes first, then layer shadows and color.", "Add people, signs, or light that make the place feel alive.", "Write the place, date, and time on the page, like urban sketchers do."], "focus": "Focus on atmosphere, loose line, and confident washes."},
  ],
  u15: [
    {"group": "TIER 1", "title": "[TIER 1] Colored Pencil Intro Worksheet+", "pts": "2 points", "attach": "the colored pencil intro worksheet+", "desc": "Review layering and burnishing, then add solvent blending, impressed lines, and toned paper.", "steps": ["Complete every section of the worksheet.", "Layer and burnish a 3-color swatch.", "Try solvent blending on one swatch and compare it to a dry blend.", "Press lines into the paper with a stylus first, then color over them to leave white lines (impressed lines).", "Draw a small sphere on toned paper with a white highlight.", "Turn it in or just show me in class."], "focus": "Focus on trying every technique and comparing results."},
    {"group": "TIER 1", "title": "[TIER 1] Skin Tone Mixing", "pts": "2 points", "attach": "photo references with a range of skin tones", "desc": "Mix a range of skin tones by layering, then match three tones from photo references.", "steps": ["Make a chart of at least 6 skin tones, from light to deep, by layering colors. No single 'skin' pencil.", "Write down the colors you layered for each one.", "Pick 3 photo references with different skin tones.", "Match a light, a middle, and a shadow tone for each photo.", "Compare your swatches to the photos and adjust.", "Turn it in or just show me in class."], "focus": "Focus on layering and matching tones accurately.", "sug": true},
    {"group": "TIER 2", "title": "[TIER 2] Colored Pencil Candy Drawing", "pts": "4 points", "attach": "candy reference photos", "desc": "Render wrapped or glossy candy, capturing transparency, reflections, and crinkled wrappers.", "steps": ["Pick candy with wrappers or a glossy surface.", "Draw it large and map out the highlights and reflections.", "Layer the base colors, leaving highlights paper white.", "Build the darks and the crinkles in the wrapper.", "Burnish the shiny areas and add sharp highlights last.", "Turn it in or just show me in class."], "focus": "Focus on transparency, reflection, and crisp wrappers."},

// Project detail panel (desktop): collapse and resize. On phones it's a full-screen sheet instead.
function initCurriculumSidebarControls(wrap) {
  var detail = document.getElementById('curr-detail');
  var handle = document.getElementById('curr-detail-resize');
  var collapse = document.getElementById('curr-detail-collapse');
  if (!wrap || !detail || !handle || !collapse) return;

  function layout() {
    if (window.innerWidth <= 900) {
      detail.classList.remove('collapsed'); detail.style.width = ''; collapse.style.display = 'none';
      return;
    }
    detail.style.width = clamp(S.ui.currDetailWidth || 400, 280, 620) + 'px';
    detail.classList.toggle('collapsed', !!S.ui.currDetailCollapsed);
    collapse.style.display = 'flex';
    collapse.textContent = S.ui.currDetailCollapsed ? '◀' : '>';
    collapse.title = S.ui.currDetailCollapsed ? 'Expand project detail sidebar' : 'Collapse project detail sidebar';
    collapse.style.left = S.ui.currDetailCollapsed ? '-28px' : '8px';
  }
  collapse.onclick = function() {
    if (window.innerWidth <= 900) return;
    S.ui.currDetailCollapsed = !S.ui.currDetailCollapsed;
    save(); layout();
  };
  handle.onmousedown = function(e) {
    if (window.innerWidth <= 900) return;
    e.preventDefault();
    wrap.classList.add('dragging-curr-sidebars'); handle.classList.add('dragging');
    function move(ev) {
      S.ui.currDetailCollapsed = false;
      S.ui.currDetailWidth = clamp(wrap.getBoundingClientRect().right - ev.clientX, 280, 620);
      layout();
    }
    function up() {
      document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
      wrap.classList.remove('dragging-curr-sidebars'); handle.classList.remove('dragging');
      save();
    }
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  };
  layout();
}

// Re-render the unit view without losing the reader's place (the page on phones, the unit column on desktop)
function currKeepScroll(fn) {
  var cvEl = document.getElementById('canvas'), m = document.getElementById('curr-main');
  var y = window.scrollY, cy = cvEl ? cvEl.scrollTop : 0, my = m ? m.scrollTop : 0;
  fn();
  window.scrollTo(0, y);
  if (cvEl) cvEl.scrollTop = cy;
  var m2 = document.getElementById('curr-main'); if (m2) m2.scrollTop = my;
}

function classroomPostLines(p) {
  return [['<b>Description:</b>','Description:'], [escHtml(p.desc), p.desc], ['',''], ['',''],
    ['<b>INSTRUCTIONS:</b>','INSTRUCTIONS:']]
    .concat(p.steps.map(function(s, i){ return [(i+1)+'. '+escHtml(s), (i+1)+'. '+s]; }))
    .concat([['',''], ['&nbsp;&nbsp;&nbsp;&nbsp;- '+escHtml(p.focus), '    - '+p.focus], ['',''], ['',''],
      ['This project is worth up to <b>['+escHtml(p.pts)+']</b>', 'This project is worth up to ['+p.pts+']']]);
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function copyRich(btn, html, text, selectEl) {
  var label = btn.textContent;
  function done() {
    btn.textContent = 'Copied'; btn.classList.add('done');
    setTimeout(function(){ btn.textContent = label; btn.classList.remove('done'); }, 1600);
  }
  function fallback() {
    // Select the rendered text so the browser copies it with its bold intact
    var r = document.createRange(); r.selectNodeContents(selectEl);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    var ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    if (ok) done(); else btn.textContent = 'Selected: copy it';
  }
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([text], {type:'text/plain'})
      })]).then(done, fallback);
      return;
    }
  } catch(e) {}
  fallback();
}

function renderClassroomPosts(main, posts) {
  if (!posts.length) {
    var none = el('div','curr-cr-empty');
    none.textContent = 'No Classroom posts for this unit yet. They get added here once the unit is written in the CLASSROOM POSTS doc.';
    main.appendChild(none);
    return;
  }
  var intro = el('div','curr-cr-intro');
  intro.textContent = 'Paste the title into Title and the description into Description. Bold carries over.';
  main.appendChild(intro);
  var groupColor = { 'TIER 1':CURR_TIER_COLORS['TIER 1'], 'TIER 2':CURR_TIER_COLORS['TIER 2'], 'TIER 3':CURR_TIER_COLORS['TIER 3'], 'WILD CARD':CURR_TIER_COLORS['WILD CARD'] };
  var last = null;
  posts.forEach(function(p) {
    var tc = groupColor[p.group] || '#888';
    if (p.group !== last) {
      var gh = el('span','curr-tier-label'); gh.style.background = tc; gh.style.margin = '10px 0 8px'; gh.style.display = 'inline-block';
      gh.textContent = p.group;
      main.appendChild(gh);
      last = p.group;
    }
    var card = el('div','curr-cr-post'); card.style.setProperty('--tc', tc);
    var head = el('div','curr-cr-row');
    var title = el('div','curr-cr-title'); title.textContent = p.title;
    var bt = el('button','curr-cr-copy'); bt.type = 'button'; bt.textContent = 'Copy title';
    bt.onclick = function(){ copyRich(bt, escHtml(p.title), p.title, title); };
    head.appendChild(title);
    if (p.sug) { var sg = el('span','curr-sug'); sg.textContent = 'suggested'; sg.title = 'A suggested project, not in your plan yet'; head.appendChild(sg); }
    head.appendChild(bt);
    card.appendChild(head);

    var lines = classroomPostLines(p);
    var html = lines.map(function(l){ return '<div>'+(l[0]||'<br>')+'</div>'; }).join('');
    var text = lines.map(function(l){ return l[1]; }).join('\n');
    var body = el('div','curr-cr-body'); body.innerHTML = html;
    card.appendChild(body);

    var foot = el('div','curr-cr-row');
    var att = el('div','curr-cr-attach'); att.textContent = (p.sug ? 'Suggested project · ' : '') + 'Attach: ' + p.attach;
    var bd = el('button','curr-cr-copy'); bd.type = 'button'; bd.textContent = 'Copy description';
    bd.onclick = function(){ copyRich(bd, html, text, body); };
    foot.appendChild(att); foot.appendChild(bd);
    card.appendChild(foot);
    main.appendChild(card);
  });
}

function renderCurriculum(cv) {
  cv.style.cssText='padding:0;overflow:hidden;display:flex;flex-direction:column;flex:1';

  var curriculum = S.curriculum || CURRICULUM;
  var editMode = !!S.currEditMode;

  function saveCurr(){ save(); }
  function getCourse(){ return curriculum.find(function(c){return c.id===currCourseId;}); }
  function getUnit(course){ return (course&&course.units||[]).find(function(u){return u.id===currUnitId;}); }
  function getProj(unit){ return (unit&&unit.projects||[]).find(function(p){return p.id===currProjId;}); }

  function makeProjectTemplate(tier, sourceProj){
    var template = sourceProj ? dc(sourceProj) : {

// --- RICH TEXT EDITOR ---------------------------------------------
function buildEditor(placeholder, htmlContent, onSave) {
  var wrap = el('div','editor-wrap');

  // Toolbar
  var tb = el('div','editor-toolbar');

  // Font size
  var sizeSelect = el('select','tb-select');
  sizeSelect.title = 'Font size';
  [['1','Small'],['3','Normal'],['4','Large'],['5','X-Large'],['6','Huge']].forEach(function(o) {
    var opt = document.createElement('option');
    opt.value = o[0]; opt.textContent = o[1];
    if (o[0]==='3') opt.selected = true;
    sizeSelect.appendChild(opt);
  });
  sizeSelect.onchange = function() {
    document.execCommand('fontSize', false, sizeSelect.value);
    body.focus();
  };
  tb.appendChild(sizeSelect);

  var sep0 = el('div','tb-sep'); tb.appendChild(sep0);

  // Format buttons
  function tbBtn(label, cmd, val, title) {
    var btn = el('button','tb-btn');
    btn.innerHTML = label; btn.title = title || cmd;
    btn.onmousedown = function(e) {
      e.preventDefault();
      document.execCommand(cmd, false, val || null);
      body.focus();
      updateToolbarState();
    };
    tb.appendChild(btn);
    return btn;
  }

  var bBtn = tbBtn('<b>B</b>',   'bold',          null, 'Bold');
  var iBtn = tbBtn('<i>I</i>',   'italic',        null, 'Italic');
  var uBtn = tbBtn('<u>U</u>',   'underline',     null, 'Underline');
  var sBtn = tbBtn('<s>S</s>',   'strikeThrough', null, 'Strikethrough');

  var sep1 = el('div','tb-sep'); tb.appendChild(sep1);

  tbBtn('H1', 'formatBlock', 'h2', 'Heading 1');
  tbBtn('H2', 'formatBlock', 'h3', 'Heading 2');
  tbBtn('¶',  'formatBlock', 'p',  'Paragraph');

  var sep2 = el('div','tb-sep'); tb.appendChild(sep2);

  // Bullet list -- works on selection too
  var ulBtn = el('button','tb-btn'); ulBtn.textContent='• List'; ulBtn.title='Convert selection to bullet list';
  ulBtn.onmousedown = function(e) {
    e.preventDefault();
    var sel = window.getSelection();
    var selText = sel ? sel.toString().trim() : '';
    if (selText && selText.indexOf('\n') !== -1) {
      var lines = selText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
      var html = '<ul>' + lines.map(function(l){return '<li>'+l+'</li>';}).join('') + '</ul>';
      document.execCommand('insertHTML', false, html);
    } else {
      document.execCommand('insertUnorderedList', false, null);
    }
    body.focus(); updateToolbarState();
  };
  tb.appendChild(ulBtn);
  tbBtn('1. List', 'insertOrderedList', null, 'Numbered list');

  var sep3 = el('div','tb-sep'); tb.appendChild(sep3);

  // Checkbox
  var cbBtn = el('button','tb-btn');
  cbBtn.textContent = '☑ Check'; cbBtn.title = 'Convert selection to checkboxes (or insert one)';
  cbBtn.onmousedown = function(e) {
    e.preventDefault();
    var sel = window.getSelection();
    var selText = sel ? sel.toString().trim() : '';
    if (selText) {
      // Convert each selected line into a checkbox
      var lines = selText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
      var html = lines.map(function(line) {
        var uid = 'cb' + Date.now() + Math.random().toString(36).slice(2,5);
        // No "for" attr on label -- clicking text places cursor, only checkbox itself toggles
        return '<div><input type="checkbox" id="'+uid+'"><label> '+line+'</label></div>';
      }).join('');
      document.execCommand('insertHTML', false, html);
    } else {
      var uid = 'cb' + Date.now();
      document.execCommand('insertHTML', false,
        '<div><input type="checkbox" id="'+uid+'"><label> &nbsp;</label></div>'
      );
    }
    body.focus();
  };
  tb.appendChild(cbBtn);

  // Table
  var tblBtn = el('button','tb-btn');
  tblBtn.textContent = '⊞ Table'; tblBtn.title = 'Insert table';
  tblBtn.onmousedown = function(e) {
    e.preventDefault();
    var rows = parseInt(prompt('Rows?', '3') || '3', 10);
    var cols = parseInt(prompt('Columns?', '3') || '3', 10);
    if (isNaN(rows)||rows<1) rows=3;
    if (isNaN(cols)||cols<1) cols=3;
    var html = '<table>';
    // Header row
    html += '<tr>';
    for (var c=0;c<cols;c++) html += '<th>Header</th>';
    html += '</tr>';
    for (var r=0;r<rows-1;r++) {
      html += '<tr>';
      for (var cc=0;cc<cols;cc++) html += '<td>&nbsp;</td>';
      html += '</tr>';
    }
    html += '</table><p><br></p>';
    document.execCommand('insertHTML', false, html);
    body.focus();
  };
  tb.appendChild(tblBtn);

  var sep4 = el('div','tb-sep'); tb.appendChild(sep4);

  tbBtn('❝ Quote', 'formatBlock', 'blockquote', 'Block quote');
  tbBtn('-- Line',  'insertHorizontalRule', null, 'Horizontal rule');

  var sep5 = el('div','tb-sep'); tb.appendChild(sep5);

  // Align
  tbBtn('⬛L', 'justifyLeft',   null, 'Align left');
  tbBtn('⬛C', 'justifyCenter', null, 'Center');

  var sep6 = el('div','tb-sep'); tb.appendChild(sep6);

  tbBtn('↩ Undo', 'undo', null, 'Undo');
  tbBtn('↪ Redo', 'redo', null, 'Redo');

  // Body
  var body = el('div','editor-body');
  body.contentEditable = 'true';
  body.setAttribute('data-placeholder', placeholder || 'Start writing...');
  if (htmlContent) body.innerHTML = htmlContent;

  // Save on input
  body.oninput = function() {
    if (onSave) onSave(body.innerHTML);
  };

  // Fix: clicking label text in a checkbox row should place cursor, not toggle checkbox.
  // We intercept clicks on labels that have a `for` attribute and only allow the toggle
  // if the click target was the label's own element (not text inside it).
  body.addEventListener('click', function(e) {
    var t = e.target;
    if (t && t.tagName === 'LABEL' && t.htmlFor) {
      // Remove the for link so the browser doesn't auto-toggle the checkbox.
      // The checkbox itself still toggles on direct click.
      t.removeAttribute('for');
    }
  }, true); // capture phase so we intercept before browser default

  // Update toolbar bold/italic state on selection change
  function updateToolbarState() {
    bBtn.classList.toggle('on', document.queryCommandState('bold'));
    iBtn.classList.toggle('on', document.queryCommandState('italic'));
    uBtn.classList.toggle('on', document.queryCommandState('underline'));
    sBtn.classList.toggle('on', document.queryCommandState('strikeThrough'));
  }
  body.addEventListener('keyup', updateToolbarState);
  body.addEventListener('mouseup', updateToolbarState);
  body.addEventListener('keydown', function(e) {
    // Find if cursor is inside a checkbox row
    function getCheckboxRow() {
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount) return null;
      var node = sel.getRangeAt(0).startContainer;
      while (node && node !== body) {
        if (node.nodeType === 1 && node.tagName === 'DIV') {
          var cb = node.querySelector('input[type=checkbox]');
          if (cb) return node;
        }
        node = node.parentNode;
      }
      return null;
    }

    if (e.key === 'Enter') {
      var row = getCheckboxRow();
      if (row) {
        e.preventDefault();
        // Get current indent
        var currentPad = parseInt(row.style.paddingLeft) || 0;
        var uid = 'cb' + Date.now();
        var newRow = document.createElement('div');
        newRow.style.paddingLeft = currentPad ? currentPad + 'px' : '';
        newRow.innerHTML = '<input type="checkbox" id="' + uid + '"><label for="' + uid + '"> \u00a0</label>';
        row.parentNode.insertBefore(newRow, row.nextSibling);
        // Place cursor in new row's label
        var label = newRow.querySelector('label');
        var range = document.createRange();
        var sel2 = window.getSelection();
        range.setStart(label, label.childNodes.length);
        range.collapse(true);
        sel2.removeAllRanges();
        sel2.addRange(range);
        return;
      }
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      var row = getCheckboxRow();
      if (row) {
        // Indent/outdent the checkbox row
        var cur = parseInt(row.style.paddingLeft) || 0;
        var next = e.shiftKey ? Math.max(0, cur - 24) : cur + 24;
        row.style.paddingLeft = next > 0 ? next + 'px' : '';
      } else {
        document.execCommand('insertHTML', false, e.shiftKey ? '' : '\u00a0\u00a0\u00a0\u00a0');
      }
    }
  });

  wrap.appendChild(tb);
  wrap.appendChild(body);
  return {wrap: wrap, body: body};
}

// Helper: convert plain text to basic HTML (preserve newlines)
function textToHtml(txt) {
  if (!txt) return '';
  // If it already looks like HTML, return as-is
  if (txt.indexOf('<') !== -1) return txt;

  var esc = function(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var lines = txt.split('\n');
  var out = [];

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    // Blank line -> spacer
    if (!trimmed) { out.push('<p><br></p>'); continue; }

    // Heavy divider (=== or ═══) -> bold rule
    if (/^[=═]{3,}$/.test(trimmed)) {
      out.push('<hr style="border:none;border-top:2px solid var(--gold);margin:14px 0">');
      continue;
    }
    // Light divider (--- or ─── or ...) -> subtle rule
    if (/^[-─]{3,}$/.test(trimmed)) {
      out.push('<hr style="border:none;border-top:1px solid var(--br);margin:10px 0">');
      continue;
    }

    // Measure leading indent (for nesting)
    var indent = line.length - line.replace(/^\s+/, '').length;
    var pad = indent > 0 ? 'padding-left:' + (indent * 7) + 'px;' : '';

    var letters = trimmed.replace(/[^A-Za-z]/g, '');
    var isCaps = letters.length >= 3 && letters === letters.toUpperCase();
    var endsColon = /[:：]\s*$/.test(trimmed);

    // LEVEL 1 -- big title: ALL CAPS, no trailing colon, not indented
    // (e.g. "UNIT 1: PENCIL", "PROJECT OVERVIEW", "1) WORK FLOW")
    if (isCaps && !endsColon && indent === 0) {
      out.push('<p style="font-size:1.2rem;font-weight:700;color:var(--text);margin:14px 0 5px;letter-spacing:.6px">' + esc(trimmed) + '</p>');
      continue;
    }

    // LEVEL 2 -- section sub-head: ALL CAPS ending in colon, low indent
    // (e.g. "CORE SKILLS:", "BRIEF:", "MATERIALS:", "TWO TRACKS:")
    if (isCaps && endsColon && indent <= 2) {
      out.push('<p style="' + pad + 'font-size:.95rem;font-weight:700;color:var(--gold);margin:10px 0 2px;letter-spacing:.3px">' + esc(trimmed) + '</p>');
      continue;
    }

    // LEVEL 3 -- minor label: Title-case line ending in colon
    // (e.g. "Instructions:", "Concept:", "Title:")
    if (endsColon && trimmed.length < 48 && indent <= 6) {
      out.push('<p style="' + pad + 'font-weight:700;color:var(--mid);margin:6px 0 1px">' + esc(trimmed) + '</p>');
      continue;
    }

    // Body line
    out.push('<p style="' + pad + 'margin:1px 0;line-height:1.55">' + esc(trimmed) + '</p>');
  }

  return out.join('');
}

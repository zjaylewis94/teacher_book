<html lang="en">

<style>
:root {
  --bg:#F5F0E8; --s1:#EDE8DC; --s2:#E4DDD0; --s3:#D8D0C0;
  --br:#C8BFA8; --br2:#B8AD98;
  --gold:#C8241A; --gd:#9A1A12; --gg:rgba(200,36,26,.07);
  --text:#1A1410; --mid:#3D3528; --dim:#7A6E5C; --danger:#C8241A; --ok:#1A5296;
  --accent-red:#C8241A; --accent-blue:#1A5296; --accent-yellow:#D4A012;
  --army:#1A5296; --teaching:#C8241A; --coaching:#1A5296;
  --art:#8B1A8B; --house:#C8241A; --personal:#7A6E5C; --finance:#1A5296; --lists:#D4A012;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* ── TOPBAR ── */
#topbar{height:48px;flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--br);
  display:flex;align-items:center;padding:0 16px;gap:14px;z-index:60}
#logo{font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:3px;
  color:var(--accent-red);text-transform:uppercase;cursor:pointer;white-space:nowrap}
#tb-date{font-size:.7rem;color:var(--dim);letter-spacing:.5px}
#tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}


#export-btn,#import-btn{background:none;border:1px solid var(--br);border-radius:5px;color:var(--dim);font-family:Rajdhani,sans-serif;font-size:.7rem;font-weight:600;letter-spacing:1px;padding:4px 10px;cursor:pointer;transition:all .15s}
#export-btn:hover,#import-btn:hover{border-color:var(--gold);color:var(--gold)}




#hbg{display:none;background:none;border:none;color:var(--mid);font-size:1.3rem;cursor:pointer;padding:2px 8px}

/* ── LAYOUT ── */
#layout{display:flex;flex:1;overflow:hidden}

/* ── LEFT SIDEBAR ── */
#sb{width:210px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--br);
  display:flex;flex-direction:column;overflow:hidden;transition:transform .25s;z-index:30}
#sb-inner{flex:1;overflow-y:auto;padding:10px 0 24px}
#sb-inner::-webkit-scrollbar{width:3px}
#sb-inner::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}
.sb-sec{font-family:'Rajdhani',sans-serif;font-size:.6rem;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding:14px 14px 5px}
.sb-row{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;
  border-left:3px solid transparent;border-radius:0 6px 6px 0;margin-right:8px;
  transition:background .15s,border-color .15s;user-select:none}
.sb-row:hover{background:var(--s2)}
.sb-row.on{background:var(--s2);border-left-color:var(--rc,var(--gold))}
.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--rc,var(--gold));flex-shrink:0}
.sb-lbl{font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;color:var(--dim);transition:color .15s}
.sb-row.on .sb-lbl,.sb-row:hover .sb-lbl{color:var(--text)}
.sb-ch-row{padding:5px 14px 5px 26px;position:relative}
.sb-ch-row .sb-ch-move{opacity:0;background:none;border:none;color:var(--dim);font-size:1rem;cursor:pointer;padding:2px 6px;margin-left:auto;line-height:1;transition:opacity .12s}
.sb-ch-row:hover .sb-ch-move{opacity:1}
.sb-ch-row.drag-over{background:var(--gg);border-left-color:var(--gold)!important}
.sb-ch-row.dragging-tab{opacity:.4}
.sb-parent-row{display:flex;align-items:center;gap:7px;padding:8px 14px 8px 14px;cursor:pointer;user-select:none;transition:background .12s;border-radius:0 6px 6px 0;margin-right:8px}
.sb-parent-row:hover{background:var(--s2)}
.sb-parent-row.drag-over{background:var(--gg);outline:1px dashed var(--gold)}
.sb-caret{font-size:.65rem;color:var(--dim);width:10px;flex-shrink:0}
.sb-parent-lbl{font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text);flex:1}
.sb-parent-count{font-family:'DM Mono',monospace,'Rajdhani',sans-serif;font-size:.62rem;color:var(--dim);background:var(--s3);border-radius:8px;padding:1px 6px}
.sb-add-ch{padding:6px 14px 10px 26px;font-family:'Rajdhani',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.6px;color:var(--dim);cursor:pointer;transition:color .12s}
.sb-add-ch:hover{color:var(--accent-red)}
.sb-ch-row .sb-lbl{font-size:.75rem;letter-spacing:.8px}
.sb-ch-row .sb-dot{width:6px;height:6px}

/* ── MAIN (center + right) ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── TAB BAR (top — projects/chapters) ── */
#tab-bar{flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--br);
  display:flex;align-items:stretch;overflow-x:auto;min-height:40px}
#tab-bar::-webkit-scrollbar{height:0}
.tab-pill{display:flex;align-items:center;gap:5px;padding:0 15px;cursor:pointer;
  white-space:nowrap;font-family:'Rajdhani',sans-serif;font-size:.74rem;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border:none;background:none;
  border-bottom:2px solid transparent;transition:all .15s;position:relative;top:1px;height:40px}
.tab-pill:hover{color:var(--text);background:var(--s2)}
.tab-pill.on{color:var(--text);border-bottom-color:var(--rc,var(--gold))}
.tab-dot{width:5px;height:5px;border-radius:50%;background:var(--rc,var(--gold))}
.tab-add{display:flex;align-items:center;padding:0 12px;cursor:pointer;color:var(--dim);
  font-size:1rem;transition:color .15s;border:none;background:none;height:40px}
.tab-add:hover{color:var(--gold)}

/* ── BODY ROW (canvas + right sidebar) ── */
#body-row{display:flex;flex:1;overflow:hidden}

/* ── CANVAS ── */
#canvas{flex:1;overflow-y:auto;padding:24px 28px;min-width:0;background:var(--bg)}
#canvas::-webkit-scrollbar{width:4px}
#canvas::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}


/* ── RIGHT SIDEBAR (pages/sections) ── */



#sb{position:relative;min-width:0}
.sidebar-resize{position:absolute;top:0;bottom:0;width:8px;z-index:40;background:transparent}
#sb-resize{right:-4px;cursor:col-resize}

.sidebar-resize:hover,.sidebar-resize.dragging{background:rgba(232,160,48,.14)}
.sidebar-collapse{position:absolute;top:8px;width:22px;height:22px;border-radius:6px;border:1px solid var(--br);background:var(--s2);color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:41;font-size:.72rem;transition:all .15s}
.sidebar-collapse:hover{color:var(--gold);border-color:var(--gd);background:var(--s3)}
#sb-collapse{right:8px}

#sb.collapsed{width:14px!important;border-right:none;overflow:visible}
#sb.collapsed #sb-inner,#sb.collapsed #sb-resize{opacity:0;pointer-events:none}
#sb.collapsed .sidebar-collapse{opacity:1;pointer-events:auto;right:-28px}



#layout.dragging-sidebars,#layout.dragging-sidebars *{cursor:col-resize!important;user-select:none!important}
@media(max-width:680px){#sb-resize,#sb-collapse{display:none!important}}

















/* ── PAGE TITLES ── */
.pg-h1{font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;letter-spacing:2px;margin-bottom:3px}
.pg-sub{font-size:.7rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:22px}


/* ── RICH TEXT EDITOR ── */
.editor-wrap{display:flex;flex-direction:column;gap:0;background:transparent}
.editor-toolbar{display:flex;align-items:center;gap:2px;padding:6px 4px;background:var(--s1);
  border-bottom:1px solid var(--br);flex-wrap:wrap;position:sticky;top:0;z-index:10;
  margin:0 -40px;padding-left:40px;padding-right:40px}
.tb-btn{background:none;border:1px solid transparent;border-radius:5px;color:var(--mid);
  font-size:.8rem;padding:4px 7px;cursor:pointer;transition:all .15s;white-space:nowrap;
  font-family:'DM Sans',sans-serif;line-height:1}
.tb-btn:hover{background:var(--s3);color:var(--text);border-color:var(--br)}
.tb-btn.on{background:var(--s3);color:var(--gold);border-color:var(--gd)}
.tb-sep{width:1px;height:18px;background:var(--br);margin:0 4px;flex-shrink:0}
.tb-select{background:var(--s2);border:1px solid var(--br);border-radius:5px;color:var(--mid);
  font-family:'DM Sans',sans-serif;font-size:.76rem;padding:3px 6px;outline:none;cursor:pointer}
.tb-select:focus{border-color:var(--gold)}
.editor-body{min-height:calc(100vh - 180px);padding:28px 32px;outline:none;color:#1A1410;background:#FFFFFF;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.07);
  font-family:'DM Sans',sans-serif;font-size:.95rem;line-height:1.9;
  caret-color:var(--gold)}
.editor-body:empty:before{content:attr(data-placeholder);color:var(--dim);pointer-events:none}
.editor-body table{border-collapse:collapse;width:100%;margin:10px 0}
.editor-body td,.editor-body th{border:1px solid var(--br);padding:7px 10px;min-width:80px;vertical-align:top}
.editor-body th{background:var(--s2);font-weight:600;font-size:.82rem}
.editor-body input[type=checkbox]{accent-color:var(--gold);width:14px;height:14px;cursor:pointer;margin-right:6px;vertical-align:middle}
.editor-body ul,.editor-body ol{padding-left:24px}
.editor-body blockquote{border-left:3px solid var(--gold);margin:4px 0;padding:4px 12px;color:var(--mid)}

/* ── CURRICULUM ── */
#curr-wrap{display:flex;height:100%;overflow:hidden;position:relative}



#curr-main{flex:1;overflow-y:auto;padding:24px 28px}
#curr-main::-webkit-scrollbar{width:4px}
#curr-main::-webkit-scrollbar-thumb{background:var(--br2)}










.curr-proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:20px}
.curr-proj-card{background:var(--s1);border:1px solid var(--br);border-radius:10px;border-left:3px solid var(--tc,var(--br));cursor:pointer;padding:13px 15px;transition:all .15s}
.curr-proj-card:hover{background:var(--s2)}
.curr-proj-card.on{background:var(--s2);border-color:var(--tc);outline:1px solid var(--tc)}
.curr-proj-name{font-family:'Rajdhani',sans-serif;font-size:.88rem;font-weight:600;letter-spacing:.5px;color:var(--text);margin-bottom:3px}
.curr-proj-meta{font-size:.68rem;color:var(--dim)}
.curr-view-tabs{display:flex;gap:4px;border-bottom:1px solid var(--br);margin:0 0 14px}
.curr-view-tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 12px;color:var(--dim);font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.curr-view-tab:hover{color:var(--text)}
.curr-view-tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.curr-cr-intro,.curr-cr-empty{font-size:.78rem;color:var(--dim);margin-bottom:10px}
.curr-cr-empty{font-style:italic}
.curr-cr-post{background:var(--s1);border:1px solid var(--br);border-left:3px solid var(--tc,var(--br));border-radius:10px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.curr-cr-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.curr-cr-title{flex:1;min-width:0;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.5px;color:var(--text)}
.curr-cr-body{background:var(--bg);border-radius:6px;padding:8px 12px;font-size:.8rem;line-height:1.5;color:var(--text);overflow-wrap:anywhere}
.curr-cr-body div{min-height:1.2em}
.curr-cr-attach{flex:1;min-width:0;font-size:.72rem;color:var(--dim);font-style:italic}
.curr-cr-copy{background:var(--gg);color:var(--gold);border:1px solid var(--gd);border-radius:6px;padding:5px 10px;font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap}
.curr-cr-copy.done{color:var(--ok);border-color:var(--ok);background:none}
#curr-detail{width:400px;flex-shrink:0;border-left:1px solid var(--br);overflow-y:auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow-x:visible}
#curr-detail::-webkit-scrollbar{width:3px}
#curr-detail::-webkit-scrollbar-thumb{background:var(--br2)}
.curr-detail-hdr{background:var(--s2);padding:16px;border-bottom:1px solid var(--br);flex-shrink:0}
.curr-sidebar-resize{position:absolute;top:0;bottom:0;width:8px;z-index:12;background:transparent}

#curr-detail-resize{left:-4px;cursor:col-resize}
.curr-sidebar-resize:hover,.curr-sidebar-resize.dragging{background:rgba(232,160,48,.14)}
.curr-sidebar-collapse{position:absolute;top:8px;width:22px;height:22px;border-radius:6px;border:1px solid var(--br);background:var(--s2);color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:13;font-size:.72rem;transition:all .15s}
.curr-sidebar-collapse:hover{color:var(--gold);border-color:var(--gd);background:var(--s3)}

#curr-detail-collapse{left:8px}



#curr-detail.collapsed{width:26px!important;min-width:26px;overflow:visible}
#curr-detail.collapsed > :not(#curr-detail-collapse):not(#curr-detail-resize){opacity:0;pointer-events:none}
#curr-detail.collapsed #curr-detail-collapse{left:-28px}
#curr-wrap.dragging-curr-sidebars,#curr-wrap.dragging-curr-sidebars *{cursor:col-resize!important;user-select:none!important}
.curr-detail-tier{display:inline-block;border-radius:6px;padding:4px 10px;font-family:'Rajdhani',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:1px;color:#fff;margin-bottom:8px}
.curr-detail-name{font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:1px;color:var(--text);margin-bottom:6px}
.curr-detail-desc{font-size:.79rem;color:var(--mid);line-height:1.6}
.curr-pts-badge{float:right;background:var(--s1);border:1px solid var(--br);border-radius:8px;padding:6px 12px;text-align:center;margin-left:12px}


.curr-sug{display:inline-block;margin-left:7px;font-size:.62rem;font-style:italic;font-weight:500;letter-spacing:.3px;color:var(--dim);vertical-align:middle;text-transform:none}
.curr-detail-body{padding:16px;flex:1;overflow-y:auto}
.curr-detail-body::-webkit-scrollbar{width:3px}
.curr-sec-label{font-family:'Rajdhani',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--br);padding-bottom:5px;margin-bottom:10px;margin-top:18px}
.curr-sec-label:first-child{margin-top:0}
.curr-mat-chip{display:inline-block;background:var(--s2);border:1px solid var(--br);border-radius:20px;padding:3px 10px;font-size:.71rem;color:var(--mid);margin:0 4px 4px 0}
.curr-step{display:flex;gap:10px;margin-bottom:9px;align-items:flex-start}
.curr-step-num{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#fff}
.curr-step-txt{font-size:.79rem;color:var(--mid);line-height:1.5;padding-top:2px;flex:1}
.curr-tip{background:var(--s2);border-left:3px solid var(--gold);border-radius:4px;padding:10px 12px;margin-top:4px}
.curr-tip-lbl{font-size:.62rem;font-weight:700;color:var(--gold);margin-bottom:4px}
.curr-tip-txt{font-size:.77rem;color:var(--mid);line-height:1.5;font-style:italic}
.curr-rubric-tbl{width:100%;border-collapse:collapse;font-size:.7rem;margin-bottom:10px}
.curr-rubric-tbl th{padding:5px 7px;text-align:center;color:#fff;font-weight:700;font-size:.68rem}
.curr-rubric-tbl td{padding:5px 7px;border-bottom:1px solid var(--br);vertical-align:top;color:var(--dim);line-height:1.4}
.curr-rubric-tbl tr:nth-child(even) td{background:var(--s1)}
.curr-rubric-cat{font-weight:600;color:var(--text);font-size:.73rem}
.curr-rubric-sub{font-size:.64rem;color:var(--dim);font-weight:400;margin-top:1px}

          {id:'p-syl-philosophy', icon:'🧭', label:'Philosophy', content:`RAMHAUS CURRICULUM -- CLASS PHILOSOPHY

Art = Communication
Every project, every exercise, every critique circles back to this. If it doesn't say something, it isn't finished.

THE 3 N's (via McKay Williamson / Artspeak Simplified)
-----------------------------------------------------
NOVELTY -- The spark of originality. How fresh is the work? How much does it stand apart?
  → In class: the hook. Makes people stop and look.
  → Low novelty = wallpaper. High novelty = you notice it every time you walk past.

NUANCE -- The craftsmanship. Could my kid make that?
  → Not just technical difficulty -- mastery of insight counts too.
  → Mondrian looks simple. His path to abstraction was shaped by Einstein and atomic theory.
  → In class: restraint. Knowing what NOT to say is the hardest skill.

NARRATIVE -- The story. The most important N.
  → Art at its most powerful when it connects emotionally.
  → Guernica doesn't describe war -- it makes you feel it.
  → Avant-garde > kitsch because kitsch tells you how to feel. Narrative trusts the viewer.

SCORING ART (critique framework):
  Score each N from 1-10. A piece doesn't need to max all three.
  Strong narrative can carry low novelty. But nothing below an 8 in narrative.

-----------------------------------------------------
THE 3 N's WITHIN EACH UNIT (4 / 6 / 10 day arc):
  T1 -- NARRATIVE (4 days): what do you want to say? medium intro, vocab, artist context
  T2 -- NOVELTY   (6 days): how do you make them care? technique + skill practice
  T3 -- NUANCE   (10 days): how little do you need to say it? the project, restraint, editing

TWO TRACKS: 1-2's (beginner, outer-ring) and 3-4's (advanced, inner-ring).
Same medium, same units -- the 3-4's just get a higher ceiling on the T3 project.

WHY THIS WORKS:
  · Every unit is a complete arc -- sub can run any unit independently
  · Kids internalize the rhythm by unit 3: we talk, we practice, we make
  · Sub always inherits students mid-T3 -- easiest phase to supervise
  · Nuance is taught every month, not saved for the end of the year

-----------------------------------------------------
4 CORE PRINCIPLES:
  1. Work general to specific
  2. Art = Communication
  3. The 3 N's -- Narrative, Novelty, Nuance
  4. Elements of Art + Principles of Design (built into the Ramhaus Wheel)
`},
          {id:'p-syl-wheel', icon:'☯', label:'Ramhaus Wheel', content:`THE RAMHAUS WHEEL -- HOW IT WORKS

Each unit spirals through all 4 rings simultaneously.
The wheel is not sequential -- it's a lens applied to every unit.

RING STRUCTURE (outside → in):
------------------------------
OUTER RING -- Ways of Working (Big Ideas)
  · Observation & Seeing
  · Proportion & Scale
  · Light & Shadow
  · Color Theory
  · Art History & Context
  · Visual Vocabulary
  → Tier 1: 2-3 short worksheets or discussion exercises

MEDIUMS RING -- Materials & Techniques
  · Pencil · Charcoal · Ink · Pastels
  · Color Pencils · Markers · Tempera · Watercolor · Scratchboard
  → Tier 1/2: 1-2 practice exercises

ELEMENTS & PRINCIPLES RING -- Core Concepts
  · Line · Shape & Form · Color & Value · Texture
  · Space & Perspective · Composition · Emphasis & Contrast · Movement & Pattern
  → Tier 2: structured exercises

CORE -- Free Expression
  · Medium of choice
  · Full personal creative application
  → Tier 3: 1 major project per unit

------------------------------
UNIT STRUCTURE (per month) -- 3 N's ARC:
  Each unit touches at least one panel from each ring.

  Week 1 → NARRATIVE
    Outer ring: Art History & Context / Visual Vocabulary
    T1 worksheets -- vocab, discussion, short critique

  Week 2 → NOVELTY
    Mediums ring + Elements ring: technique practice, concept exercises
    T1/T2 -- medium exploration, structured skill-building

  Weeks 3-4 → NUANCE
    Core (Free Expression): the T3 project
    Student chooses medium, applies concept with restraint and intent

app, or the schedules posted around the room. My conference period is 5th,

    work is getting done and they're not abusing it, I'm happy.
  · Snacking is okay if it doesn't get disruptive.

-----------------------------------------------------
HOW THE CLASS WORKS (for longer coverage):

Each unit is built around ONE medium and moves through three tiers on a
4 / 6 / 10 day rhythm:

  T1 -- SKILL BUILDERS / Narrative (4 days)

advanced classes just get a higher ceiling on the T3. Each unit = ~1 month.

CLASSROOM CULTURE:

  · Students should be able to defend every creative choice.
  · Effort and professional conduct matter as much as skill.

IF YOU'RE STUCK:

  · Every project has a brief, materials list, and step-by-step instructions
  · When in doubt: give them the T3 project and let them work
  · Contact: zlewis@riversideunified.org

          {id:'p-syl-official', icon:'📄', label:'Official Syllabus', content:`RHS DRAW & PAINT -- OFFICIAL SYLLABUS
Mr. Lewis · zlewis@riversideunified.org
(Logged from the handout version. Keep this as the student-facing copy.)

-----------------------------------------------------
CLASS DESCRIPTION

Welcome to Draw & Paint! I'm excited to share art with you at Ramona HS.
I always equate teaching art with learning a guitar. A common thing an
aspiring guitarist does is learn his or her favorite song. While that's a
great way to build interest, it leaves the guitarist only knowing how to
play that one song. To be able to create any song the heart feels, the
guitarist must understand the chords, notes, and melodies first. This class
will take students through Art Design's version of chords, notes, and
melodies by learning the elements of art and principles of design. Once
students have built their design skills they will use them to explore a
personal connection to art.

-----------------------------------------------------
CLASS MATERIALS

Students are expected to come daily with at least a pencil and Chromebook.
No extra class materials will be necessary other than that. The materials we
use are of student-grade quality. Students who would like to bring their own
materials are more than welcome.

  ** I always need cardboard, newspapers, magazines, and pasta jars.
     Any donations are greatly appreciated!

-----------------------------------------------------
GRADE SYSTEM

Due to art's subjective nature, I grade as objectively as possible based on
a rubric. I practice a growth mindset and grading for equity, so I can give
students a grade that accurately reflects their skill level and comprehension
of the material.

GENERAL RUBRIC (4 / 3 / 2 / 1):
  Creativity        -- Super unique / Original ideas / Borrowed ideas / Copied
  Required Content  -- All + some / All of them / Most of them / Nope
  Neatness          -- Perfect / Mostly neat / Almost neat / Messy
  Effort            -- Above & beyond / Good effort / More needed / Minimal

-----------------------------------------------------
TIER SYSTEM

Every unit is built around one medium and moves through three tiers. Each
tier is both a stage of skill-building AND a stage of communication (the
3 N's). You complete them in order -- each one sets up the next.

  Tier 1 -- SKILL BUILDERS / Narrative (4 days)
    Learn the medium: techniques, vocabulary, and the "why" behind the work.
    Short exercises that build the foundation. Figure out what you want to say.

  Tier 2 -- PRACTICE / Novelty (6 days)
    Apply and refine those skills. Practice projects where you experiment and
    make the work visually interesting. This is where you find your hook.

  Tier 3 -- FINAL PROJECT / Nuance (10 days)
    One committed piece that demonstrates full understanding. Restraint,
    craft, and a personal or conceptual idea. Say the most with the most skill.

  Tier | Focus                 | Time     | Pts   | Tier Total
  1    | Skill Builders        | 4 days   | 2 pts | ~6 pts
  2    | Practice Projects     | 6 days   | 4 pts | ~8 pts
  3    | Final Project         | 10 days  | 8 pts | 8 pts

LETTER GRADES (total unit points):
  A  15-20  Mastery              (100-75%)
  B  12-15  Strong understanding (74.9-62%)
  C  10-12  Basic understanding  (61.9-50%)
  D  7-10   Limited/incomplete   (49.9-33%)
  F  6-     Insufficient progress (32.9-0%)

4-POINT SCALE: 4=A+  3=A-  2=C  1=D  0=F
  (B's are earned by a combination of 3's and 2's.)
  Gradebook percentage scale is adjusted to match the 4-point scale.

-----------------------------------------------------
LATE WORK

No late penalties. Students can turn in work anytime up to the end of the
semester -- everyone demonstrates skill at their own pace. The class usually
moves at about one unit per month. Not satisfied with a grade? You're always
welcome to redo work for improvement.

-----------------------------------------------------
CLASSROOM EXPECTATIONS

My classroom promotes creativity and individuality. I expect students to feel
comfortable being themselves AND to make others feel welcome. That begins with
being respectful, open-minded, and clean.

RULES:
  · Follow all school-wide rules, including academic honesty
  · Respect each other -- practice the Golden Rule
  · No offensive or vulgar language
  · Clean tables before leaving
  · Clean equipment and return it where it belongs
  · NO CELL PHONES (unless used for educational purposes)
  · No bags on desks

CONSEQUENCES:  [** VERIFY -- new school policy this year **]
  1. Verbal warning
  2. Home / parent / guardian contact
  3. Referral to the office  [** NEW? confirm this is now step 3 **]
  (Old ladder was: detention -> conference -> referral last.
   Double-check the recent policy email before finalizing.)

-----------------------------------------------------
"Art is communication. Design is a solution." -- Lewis

=====================================================
NOTE (for me, not students):
   Tier system now blended: Skill/Narrative -> Practice/Novelty -> Final/Nuance.
   Choice-based system fully dropped -- one project per tier now.
   Grade scale, rubric, late-work policy, and rules all unchanged.
   Only open item: confirm the new consequences order (referral = step 3?).
`},
          {id:'p-syl-frameworks', icon:'🧩', label:'Frameworks (ref)', content:`TEACHING FRAMEWORKS -- REFERENCE ONLY
(Logged for later. NOT yet integrated -- don't want framework soup.
 Current load-bearing models stay: Art=Communication, the 3 N's, Ramhaus.)

=====================================================
1) STAGES OF MAKING  (Jackie Gerstein -- User Generated Education)
   A growth ladder, bottom to top:

   COPY      -- make something almost exactly as someone else has done
   ADVANCE   -- gain skills by doing similar projects
   EMBELLISH -- add something; add a little of one's self to it
   MODIFY    -- take what others have done; morph it into something new
   CREATE    -- create something new, different than before

   WHY IT FITS US:
   This is basically our whole class argument drawn as a ladder. Copying
   isn't worthless -- it's the BOTTOM RUNG. Day one landscape = Copy.
   The year moves them up the ladder. Masterpiece unit = Create.

   POSSIBLE MAP (not committed):
     Intro / early units .... Copy -> Advance
     Mid medium units ....... Embellish -> Modify
     Masterpiece ............ Create

=====================================================
2) THE CREATIVE PROCESS  (Research -> Ideation -> Develop -> Revise, repeat)
   A per-project workflow (the wheel diagram):

   RESEARCH  -- Google, library, experience: gather references, context
   IDEATION  -- Explore + Plan: understand audience, sketch, storyboard
   DEVELOP   -- Produce + Refine: create content, solve problems, iterate
   REVISE    -- Critique: listen, adjust, discover decisions -> REPEAT
   (center: realise your idea / find the vision / final revisions)

   WHY IT FITS US:
   This is a real WORKFLOW for making one piece. Our Masterpiece planning
   phase already gropes toward this (brainstorm -> thumbnails -> studies ->
   execute -> critique). Could formalize it as the process students run on
   every big T3 project.

   POSSIBLE USE (not committed):
     Print as a wall poster + hand out for the Masterpiece unit planning.
     Maybe introduce the vocabulary during the first few T3 projects.

=====================================================
3) WORK FLOW -- "MAKE. LEARN. ITERATE. CREATE ON PURPOSE."
   IDEA -> RESEARCH -> DESIGN -> BUILD -> SHARE

   A general workflow that applies to ANY medium or maker. This version is
   just an EXAMPLE -- it's how I personally work, with my own tools filled in.
   The point: the same five-step arc works whether you're painting, sculpting,
   animating, or building anything. Swap the tools, keep the flow.

   1. IDEA / INTAKE -- raw input feeds everything
        books, PDFs, videos
   2. RESEARCH -- notes, summaries, key takeaways, references
        (my tools: Claude for logging/narrative, studies, notebooks)
   3. DESIGN -- reference/vision boards, mood, color, composition
        ideation + sketching (sketchbook, pencil/pen, watercolor, thumbnails)
        (my tools: Gemini, Figma)
   4. BUILD -- production
        (my tools: Photoshop, Blender, Unreal, 3D print, cast+mold, clay)
   5. SHARE -- portfolio, prints, classroom, social
        outputs: 2D, 3D, printed pieces, final art

   FEEDBACK LOOP: every output becomes new input. Keep the cycle alive.
   THE MINDSET: curiosity · discipline · iteration · craft · purpose

   TIES TO INTRO UNIT:
     Good example for the onboarding slideshow -- shows students the general
     shape of how any artist works and gets better. Maps onto our tiers too:
     Research/Design = T1-T2, Build = T3, Share = critique.

=====================================================
HOW THE 3 FRAMEWORKS RELATE:
   · STAGES OF MAKING .... the year arc (Copy -> Create; where am I?)
   · CREATIVE PROCESS .... the per-project method (Research -> Revise loop)
   · WORK FLOW ........... a general maker workflow (Idea -> Share),
                          shown as an example of how I personally work

=====================================================
DECISION LATER:
   Use one, both, or neither. If integrated, probably:
   - Stages of Making = the YEAR arc (where am I as an artist)
   - Creative Process = the PER-PROJECT method (how do I make this)
   Keep it light -- kids only need 1-2 frameworks to actually stick.
`},

          {id:'p-intro-overview', icon:'📋', label:'Overview', content:`INTRO UNIT -- FIRST 2 WEEKS

Goal: Set the tone FIRST, culture SECOND. This is an art class -- day one
should feel fun and creative, not like a syllabus lecture. (Veteran teacher
wisdom: don't open with rules and icebreakers. Open with making art.)

    The hook. I demo a simple landscape step-by-step; they follow along,

          {id:'p-intro-landscape', icon:'🏔️', label:'Day 1-3 Landscape', content:`GUIDED LANDSCAPE -- DAYS 1-3 (THE HOOK)
Colored Pencil · 8.5x11 paper · ~40 min/day

-----------------------------------------------------
THE BIG IDEA (why this lesson opens the year):

  I walk them step-by-step through a simple, appealing landscape.
  Everyone follows the same steps -- and everyone's still comes out different.

  THE PUNCHLINE (say this out loud when we finish):
  "Cool -- I just taught you to draw THIS one landscape, this one way.
   But what if I asked you to draw it from a different angle? At night?
   In winter? Move the trees around? Put it somewhere else entirely?"

  That's the whole class in a sentence: I'm not here to teach you to copy
  ONE result. I'm here to give you the TOOLS so you can make anything.
  Results vs. tools. Dependence vs. independence.

-----------------------------------------------------
MATERIALS (zero-setup on purpose):
  · 8.5x11 white paper
  · Colored pencils
  · Regular pencil for light guide lines
  (No water, no paint, no cleanup -- day one is not the day for paint etiquette.)

-----------------------------------------------------
DEMO FLOW (I draw, they follow):
  1. Horizon line -- placement changes everything
  2. Simple background (mountains / hills)
  3. Midground (tree line, a path, water)
  4. Foreground (a big tree, rocks, framing element)
  5. Color pass -- sky gradient, light source, shadows
  6. "GO WILD" window -- last 10 min: change it, add to it, make it yours

-----------------------------------------------------
THE "GO WILD" VARIATIONS (offer these to spark independence):
  · Different season (summer → fall/winter)
  · Day vs. night (change the light + color palette)
  · Different angle or viewpoint
  · Move / add / remove trees
  · Different place entirely (desert, coast, alien planet)

-----------------------------------------------------
PACING:
  Day 1: intro + demo through midground, they follow
  Day 2: foreground + color pass
  Day 3: finish + GO WILD + the punchline discussion

-----------------------------------------------------
BACKUP / ALT LESSON -- "Disney Draw" (Stitch):
  The original version of this lesson. I can draw Stitch in one pose from
  the back of my hand. Same punchline: "I taught you ONE Stitch in ONE pose --
  now draw him differently and you're stuck."
  Retired from default because: (1) HS kids less into Disney animation now,
  (2) AI image-gen makes "copy this character" less meaningful.
  Kept here as a reliable fallback if the landscape ever falls flat.

-----------------------------------------------------
WHY NOT PAINT ON DAY 1:
  Watercolor/paint on day one with a brand-new room = nightmare. No paint
  etiquette established, water everywhere, 40 min gone to setup/cleanup.
  Colored pencil delivers the same step-by-step-then-vary lesson with zero
  overhead. Upgrade to paint in a future year once the room is trained.`},

// --- STATE --------------------------------------------------------
var S = {};
var curTab = 'teaching';
var curSec = 'chapter';  // chapter | notes | curriculum
var curChapter = null;    // chapter id when in a box
var curPage = null;

function initState() {
  var raw = null, saved = null;
  try { raw = localStorage.getItem('teacher_book_v2'); } catch(e) {}
  if (raw) {
    try { saved = JSON.parse(raw); }
    catch(e) {
      console.error('Saved book could not be read; starting from the seed', e);
      try { localStorage.setItem('teacher_book_v2_unreadable', raw); } catch(e2) {}
    }
  }
  // A fresh book keeps _ts 0, so any real copy on GitHub counts as newer and wins
  if (!saved) { S = dc(SEED); S._ts = 0; }
  else S = saved;
  hydrateState();
  // Store an upgraded book on this device without stamping it as a new edit, so newer edits
  // made on another device still win when GitHub Sync compares timestamps
  if (saved && _contentMigrated) {
    _contentMigrated = false;
    try { localStorage.setItem('teacher_book_v2', JSON.stringify(S)); } catch(e) {}
  }
}

function hydrateState() {
  // Migrate first, on its own, so a bad default below can never skip it
  try { migrateContent(); } catch(e) { console.error('content migration failed', e); }
  try {
    if (!S.boxes) S.boxes = {};
    BOXES.forEach(function(k) {
      if (!S.boxes[k]) S.boxes[k] = dc(SEED.boxes[k]);
      if (!S.boxes[k].chapters) S.boxes[k].chapters = dc(SEED.boxes[k].chapters || []);
      if (typeof S.boxes[k].notes !== 'string') S.boxes[k].notes = '';
    });
    if (!S.ui) S.ui = {};
    if (typeof S.ui.sbWidth !== 'number') S.ui.sbWidth = 196;
    if (typeof S.ui.sbCollapsed !== 'boolean') S.ui.sbCollapsed = false;
    if (typeof S.ui.currLeftWidth !== 'number') S.ui.currLeftWidth = 230;
    if (typeof S.ui.currDetailWidth !== 'number') S.ui.currDetailWidth = 400;
    if (typeof S.ui.currLeftCollapsed !== 'boolean') S.ui.currLeftCollapsed = false;
    if (typeof S.ui.currDetailCollapsed !== 'boolean') S.ui.currDetailCollapsed = false;
    if (!S.curriculum) S.curriculum = dc(CURRICULUM);
    if (typeof S.currEditMode !== 'boolean') S.currEditMode = false;
  } catch(e) { console.error('hydrateState failed', e); }
}

// --- CONTENT MIGRATION -------------------------------------------
// A saved book keeps its own copy of the curriculum, so seed changes only reach a device through here.
// v2 (Sep 28, 2026): the curriculum follows the UNIT GUIDES doc. Old material moves to Old Drafts; nothing is deleted.
var _contentMigrated = false;
var OLD_UNIT_CHAPTERS = ['ch-u1','ch-u2','ch-u3','ch-u4','ch-u5','ch-u7','ch-u8','ch-u9','ch-u10','ch-u12','ch-master'];

function migrateContent() {
  var v = S.contentVersion || 0;
  if (v >= SEED.contentVersion) return;
  if (v < 2) migrateToV2();
  if (v < 3) migrateToV3();
  if (v < 4) migrateToV4();
  S.contentVersion = SEED.contentVersion;
  _contentMigrated = true;
}

// v4 (Sep 28, 2026, Zach's call): delete Old Drafts and last year's courses; Ramhaus (the wheel) heads Art Curriculum.
// The deleted text stays in the repo's git history (commit a44fbfd).
function migrateToV4() {
  var box = S.boxes && S.boxes.teaching;
  if (box && box.chapters) {
    box.chapters = box.chapters.filter(function(c){ return OLD_UNIT_CHAPTERS.indexOf(c.id) === -1 && !/^ch-old-/.test(c.id); });
    box.chapters.forEach(function(c){ if (c.parent === 'archive') c.parent = 'admin'; });   // anything Zach filed there himself
    var ram = box.chapters.filter(function(c){ return c.id === 'ch-t1'; })[0];
    if (ram && ram.parent === 'admin') {
      ram.parent = 'curriculum';
      box.chapters.splice(box.chapters.indexOf(ram), 1);
      box.chapters.unshift(ram);   // first in its group
    }
    box.chapters.forEach(function(c){
      (c.pages || []).forEach(function(p){
        if (typeof p.content !== 'string') return;
        p.content = p.content
          .replace('Every project with its description is in the Curriculum tab.', 'Every project with its description is under Art Curriculum in the sidebar.')
          .replace(' The old medium-by-medium plan is under Old Drafts.', '')
          .replace('(Curriculum tabs in this app)', "(Art Curriculum in this app's sidebar)");
      });
    });
  }
  if (Array.isArray(S.curriculum)) S.curriculum = S.curriculum.filter(function(c){ return !c.archived; });
}

// v2 (Sep 28, 2026): the curriculum follows the UNIT GUIDES doc
function migrateToV2() {
  var seedChs = SEED.boxes.teaching.chapters;
  function seedCh(id){ return seedChs.filter(function(c){ return c.id===id; })[0]; }
  var box = S.boxes && S.boxes.teaching;
  if (box) {
    if (!box.chapters) box.chapters = [];
    var chs = box.chapters;
    var find = function(id){ return chs.filter(function(c){ return c.id===id; })[0]; };

    // 1. The old medium-by-medium unit drafts move to Old Drafts, content untouched
    OLD_UNIT_CHAPTERS.forEach(function(id){
      var c = find(id), s = seedCh(id);
      if (!c) return;
      c.parent = 'archive';
      if (s && c.label === s.label.replace('Old \u00b7 ','')) c.label = s.label;
    });

    // 2. Syllabus: keep the old overview + year pages under Old Drafts, then load the new ones
    var syl = find('ch-syllabus'), sSyl = seedCh('ch-syllabus');
    if (syl && sSyl && !find('ch-old-syllabus')) {
      var oldSyl = {id:'ch-old-syllabus', label:'Old \u00b7 Syllabus Pages', parent:'archive', pages:[]};
      if (!syl.pages) syl.pages = [];
      ['p-syl-overview','p-syl-year'].forEach(function(pid){
        var np = sSyl.pages.filter(function(p){ return p.id===pid; })[0];
        var p = syl.pages.filter(function(x){ return x.id===pid; })[0];
        if (!np) return;
        if (p) {
          oldSyl.pages.push({id:'p-old-'+pid.slice(2), icon:p.icon, label:p.label+' (old)', content:p.content});
          p.content = np.content;
        } else {
          syl.pages.push(dc(np));
        }
      });
      chs.push(oldSyl);
    }
    // Tier 2 projects are worth 4 points now
    ((syl && syl.pages) || []).forEach(function(p){
      if (typeof p.content !== 'string') return;
      p.content = p.content
        .replace('Tier 1 = 2 pts \u00b7 Tier 2 = 3 pts \u00b7 Tier 3 = 8 pts', 'Tier 1 = 2 pts \u00b7 Tier 2 = 4 pts \u00b7 Tier 3 = 8 pts')
        .replace('| Practice Projects     | 6 days   | 3 pts | ~6 pts', '| Practice Projects     | 6 days   | 4 pts | ~8 pts');
    });

    // 3. Ramhaus's polished units were built on the old plan: park them under Old Drafts (v3 moves them on)
    var ram = find('ch-t1');
    if (ram && ram.units && ram.units.length) {
      ram.units.forEach(function(u){
        if (find('ch-old-'+u.id)) return;
        chs.push({id:'ch-old-'+u.id, label:'Old \u00b7 Ramhaus '+u.label, parent:'archive', pages:[], overview:u.overview, projects:u.projects||[]});
      });
      ram.units = [];
    }
  }

  // 4. Curriculum tab: this year's four courses, with last year's kept below them as an archive
  var cur = Array.isArray(S.curriculum) ? S.curriculum : [];
  var fresh = dc(CURRICULUM).filter(function(c){ return !c.archived; });
  var kept = cur.filter(function(c){ return c.archived; });
  cur.forEach(function(c){
    if (c.archived || /^draw\d$/.test(c.id)) return;
    kept.push(archiveCourse(c));
  });
  if (!cur.length) kept = dc(CURRICULUM).filter(function(c){ return c.archived; });
  S.curriculum = fresh.concat(kept);
}

// v3 (Sep 28, 2026): chapters that hold structured projects (the old Ramhaus Unit 1) move into the
// Curriculum tab's Old Drafts course, so one viewer shows every project. Empty Ramhaus unit lists go.
function migrateToV3() {
  var box = S.boxes && S.boxes.teaching;
  if (!box || !box.chapters) return;
  var moving = box.chapters.filter(function(c){ return c.projects && c.projects.length; });
  if (moving.length) {
    if (!Array.isArray(S.curriculum)) S.curriculum = dc(CURRICULUM);
    var course = S.curriculum.filter(function(c){ return c.id === 'old-drafts'; })[0];
    if (!course) {
      course = {id:'old-drafts', label:'Old Drafts', color:'#95A5A6', archived:true, units:[]};
      S.curriculum.push(course);
    }
    moving.forEach(function(ch){
      var uid = 'old-' + ch.id.replace(/^ch-old-/, '');
      if (course.units.some(function(u){ return u.id === uid; })) return;
      course.units.push(oldDraftUnit(uid, ch.label, ch.overview, ch.projects));
    });
    box.chapters = box.chapters.filter(function(c){ return moving.indexOf(c) === -1; });
  }
  box.chapters.forEach(function(c){ if (c.units && !c.units.length) delete c.units; });
}

// "Old · Ramhaus Unit 1: Pencil" -> unit 1, "Pencil (Ramhaus draft)"
function oldDraftUnit(uid, label, overview, projects) {
  var m = /Unit (\d+): (.*)$/.exec(label || '');
  return {
    id: uid, num: m ? parseInt(m[1], 10) : 1,
    title: m ? m[2] + ' (Ramhaus draft)' : String(label || '').replace(/^Old \u00b7 /, ''),
    overview: overview || '',
    projects: (projects || []).map(function(p){ var q = dc(p); q.id = uid + '-' + p.id; return q; })
  };
}

function archiveCourse(c) {
  var a = {id:'ly-'+c.id, label:'Last Year · '+c.label, color:'#95A5A6', archived:true, units:dc(c.units||[])};
  a.units.forEach(function(u){
    u.id = 'ly-'+u.id;
    (u.projects||[]).forEach(function(p){ p.id = 'ly-'+p.id; });
  });
  return a;
}

function dc(o) { return JSON.parse(JSON.stringify(o)); }

function renderApp() {
  // Auto-select first chapter if none selected
  if (S.boxes && S.boxes[curTab]) {
    var _chs = (S.boxes[curTab] && S.boxes[curTab].chapters) || [];
    if (_chs.length && curSec === 'chapter' && !curChapter) {
      curSec = 'chapter';
      curChapter = _chs[0].id;
      curPage = (_chs[0].pages && _chs[0].pages.length) ? _chs[0].pages[0].id : null;
    }
  }
  buildSB();
  buildTabBar();
    renderCanvas();
  applySidebarLayout();
}

function save() {
  try {
    S._ts = Date.now();
    var json = JSON.stringify(S);
    // Save to localStorage immediately (fast, offline fallback)
    try { localStorage.setItem('teacher_book_v2', json); } catch(e) {}
    // Save to GitHub async (true cross-device sync)
    if (window._fbSave) {
      try { var p = window._fbSave(json); if (p && p.catch) p.catch(function(){}); } catch(e){}
    }
  } catch(e) {}
}

function stampForFileName() {
  var d = new Date();
  function pad(n){ return String(n).padStart(2,'0'); }
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + '-' + pad(d.getMinutes());
}

function flashStatus(msg, color) {
  var el2 = document.getElementById('sync-status');
  if (!el2) return;
  el2.textContent = msg;
  el2.style.color = color || 'var(--mid)';
  clearTimeout(flashStatus._t);
  flashStatus._t = setTimeout(function(){
    showSyncStatus();
  }, 2600);
}

function exportData() {
  try {
    S._ts = Date.now();
    var payload = JSON.stringify(S, null, 2);
    var blob = new Blob([payload], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'teacher-book-save-' + stampForFileName() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    flashStatus('⇩ Exported JSON', 'var(--gold)');
  } catch(e) {
    alert('Export failed. Your browser blocked the save file or ran into an error.');
  }
}

function triggerImport() {
  var inp = document.getElementById('import-file');
  if (!inp) return;
  inp.value = '';
  inp.click();
}

function handleImportFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var incoming = JSON.parse(evt.target.result);
      if (!incoming || typeof incoming !== 'object' || !incoming.boxes) {
        throw new Error('Invalid Mr. Lewis file');
      }
      if (!confirm('Import this save file? This will replace the current local data on this device.')) return;
      S = incoming;
      hydrateState();
      save();
      renderApp();
      flashStatus('⇧ Imported JSON', 'var(--ok)');
    } catch(err) {
      alert('That file could not be imported. Make sure it is a valid Mr. Lewis JSON save.');
    }
  };
  reader.onerror = function() {
    alert('Import failed because the file could not be read.');
  };
  reader.readAsText(file);
}
function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
function tx(s) { return document.createTextNode(s); }
function bx(id) { return S.boxes[id]; }
function bm(id) { for (var i=0;i<BOX_META.length;i++) { if (BOX_META[i].id===id) return BOX_META[i]; } return {id:id,label:id,icon:'',color:'var(--gold)'}; }

var CHAPTER_GROUPS = [
  {id:'admin', label:'Admin', icon:'🗂️'},
  {id:'curriculum', label:'Art Curriculum', icon:'📘'},
  {id:'classroom', label:'Classroom', icon:'🎨'},

function buildSB() {
  var inner = document.getElementById('sb-inner');
  inner.innerHTML = '';

  // CHAPTERS grouped by PARENT (only for boxes that have chapters)
  if (!S.boxes || !S.boxes[curTab]) return;
  var box = bx(curTab);
  var chs = box.chapters || [];
  if (!chs.length) return;
  var meta = bm(curTab);

  if (!window._sbExpanded) window._sbExpanded = {admin:true, curriculum:true, classroom:true, avid:true};

  var cs = el('div','sb-sec'); cs.appendChild(tx('Chapters')); inner.appendChild(cs);

  CHAPTER_GROUPS.forEach(function(parent) {
    var parentChs = chs.filter(function(c){ return (c.parent||'curriculum') === parent.id; });
    var expanded = window._sbExpanded[parent.id];

    var pRow = el('div','sb-parent-row');
    pRow.dataset.parentId = parent.id;
    var caret = el('span','sb-caret'); caret.textContent = expanded ? '▾' : '▸';
    var picon = el('span',''); picon.textContent = parent.icon;
    var plbl = el('span','sb-parent-lbl'); plbl.appendChild(tx(parent.label));
    var pcount = el('span','sb-parent-count');
    pcount.textContent = parentChs.length + (parent.id === 'curriculum' ? (S.curriculum || []).length : 0);
    pRow.appendChild(caret); pRow.appendChild(picon); pRow.appendChild(plbl); pRow.appendChild(pcount);
    pRow.onclick = function() {
      window._sbExpanded[parent.id] = !window._sbExpanded[parent.id];
      buildSB();
    };
    // Drop target: dragging a chapter onto a parent row reassigns it
    pRow.ondragover = function(e) { e.preventDefault(); pRow.classList.add('drag-over'); };
    pRow.ondragleave = function() { pRow.classList.remove('drag-over'); };
    pRow.ondrop = function(e) {
      e.preventDefault(); pRow.classList.remove('drag-over');
      var chId = e.dataTransfer.getData('chid');
      if (!chId) return;
      var ch = chs.find(function(c){ return c.id === chId; });
      if (ch) { ch.parent = parent.id; save(); buildSB(); buildTabBar(); }
    };
    inner.appendChild(pRow);

    if (!expanded) return;

    parentChs.forEach(function(ch) {
      var isOn = (curSec === 'chapter' && curChapter === ch.id);
      var row = el('div','sb-row sb-ch-row' + (isOn ? ' on' : ''));
      row.style.setProperty('--rc', meta.color);
      row.draggable = true;
      row.dataset.chId = ch.id;
      var dot = el('div','sb-dot');
      var lbl = el('div','sb-lbl'); lbl.appendChild(tx(ch.label));
      var moveBtn = el('button','sb-ch-move'); moveBtn.textContent='⋮'; moveBtn.title='Move / rename / delete';
      row.appendChild(dot); row.appendChild(lbl); row.appendChild(moveBtn);

      row.onclick = function(e) {
        if (e.target === moveBtn) return;
        openChapter(ch);
        if (window.innerWidth <= 680) closeSB();
      };

      row.ondragstart = function(e) {
        e.dataTransfer.setData('chid', ch.id);
        setTimeout(function(){ row.classList.add('dragging-tab'); }, 0);
      };
      row.ondragend = function() {
        row.classList.remove('dragging-tab');
        document.querySelectorAll('.sb-ch-row').forEach(function(r){ r.classList.remove('drag-over'); });
      };
      row.ondragover = function(e) { e.preventDefault(); row.classList.add('drag-over'); };
      row.ondragleave = function() { row.classList.remove('drag-over'); };
      row.ondrop = function(e) {
        e.preventDefault(); row.classList.remove('drag-over');
        var fromId = e.dataTransfer.getData('chid');
        if (!fromId || fromId === ch.id) return;
        var fromIdx = chs.findIndex(function(c){return c.id===fromId;});
        var toIdx = chs.findIndex(function(c){return c.id===ch.id;});
        if (fromIdx < 0 || toIdx < 0) return;
        var fromCh = chs[fromIdx];
        fromCh.parent = ch.parent; // reassign to same parent as drop target
        chs.splice(fromIdx, 1);
        var newToIdx = chs.findIndex(function(c){return c.id===ch.id;});
        chs.splice(newToIdx, 0, fromCh);
        save(); buildSB(); buildTabBar();
      };

      moveBtn.onclick = function(e) {
        e.stopPropagation();
        showChapterMenu(moveBtn, ch, box);
      };

      inner.appendChild(row);
    });

    // Art Curriculum also holds the Draw + Paint courses and their units
    if (parent.id === 'curriculum') {
      (S.curriculum || []).forEach(function(course) {
        var key = 'course:' + course.id;
        // every unit shows as its own row; tapping a course header folds it
        if (window._sbExpanded[key] === undefined) window._sbExpanded[key] = true;
        var open = window._sbExpanded[key];
        var cRow = el('div','sb-course-row');
        var cCaret = el('span','sb-caret'); cCaret.textContent = open ? '▾' : '▸';
        var cDot = el('span','sb-course-dot'); cDot.style.background = course.color;
        var cLbl = el('span','sb-course-lbl'); cLbl.appendChild(tx(course.label));
        var cCount = el('span','sb-parent-count'); cCount.textContent = (course.units || []).length;
        cRow.appendChild(cCaret); cRow.appendChild(cDot); cRow.appendChild(cLbl); cRow.appendChild(cCount);
        cRow.onclick = function(){ window._sbExpanded[key] = !open; buildSB(); };
        inner.appendChild(cRow);

// Small popover menu for a chapter row: rename, move to parent, delete
// Small popover menu. entries: [label, onClick] pairs, or '-' for a divider.
function showMenu(anchorEl, entries) {
  var old = document.getElementById('ch-menu-popover');
  if (old) old.remove();
  var menu = el('div',''); menu.id = 'ch-menu-popover';
  menu.style.cssText = 'position:fixed;z-index:200;background:var(--s2);border:1px solid var(--br2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:170px;overflow:hidden;font-family:Rajdhani,sans-serif;';
  var rect = anchorEl.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = clamp(rect.left - 130, 8, window.innerWidth - 190) + 'px';
  entries.forEach(function(en) {
    if (en === '-') {
      var d = el('div',''); d.style.cssText = 'height:1px;background:var(--br);margin:2px 0';
      menu.appendChild(d); return;
    }
    var it = el('div',''); it.appendChild(tx(en[0]));
    it.style.cssText = 'padding:9px 14px;font-size:.76rem;font-weight:600;letter-spacing:.5px;color:var(--mid);cursor:pointer;transition:background .12s;';
    it.onmouseover = function(){ it.style.background = 'var(--s3)'; };
    it.onmouseout  = function(){ it.style.background = ''; };
    it.onclick = function(e){ e.stopPropagation(); menu.remove(); en[1](); };
    menu.appendChild(it);
  });
  document.body.appendChild(menu);
  // Near the bottom of the screen, open upward so every item stays reachable
  var h = menu.offsetHeight;
  if (rect.bottom + 4 + h > window.innerHeight - 8) menu.style.top = Math.max(8, rect.top - 4 - h) + 'px';
  menu.style.maxHeight = (window.innerHeight - 16) + 'px';
  menu.style.overflowY = 'auto';
  setTimeout(function() {
    document.addEventListener('click', function closeMenu(e) {
      if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closeMenu); }
    });
  }, 0);
}

// Chapter row menu: rename, move to another group, delete
function showChapterMenu(anchorEl, ch, box) {
  var entries = [['\u270e Rename', function() {
    var name = prompt('Rename chapter:', ch.label);
    if (name && name.trim()) { ch.label = name.trim(); save(); buildSB(); buildTabBar(); }
  }], '-'];
  CHAPTER_GROUPS.forEach(function(g) {
    if ((ch.parent || 'curriculum') === g.id) return;
    entries.push(['\u2192 Move to ' + g.label, function(){ ch.parent = g.id; save(); buildSB(); buildTabBar(); }]);
  });
  entries.push('-');
  entries.push(['\ud83d\uddd1 Delete chapter', function() {
    if (!confirm('Delete "' + ch.label + '" and all its pages?')) return;
    var idx = box.chapters.indexOf(ch);
    if (idx >= 0) box.chapters.splice(idx, 1);
    if (curChapter === ch.id) { if (box.chapters.length) { openChapter(box.chapters[0]); return; } openSection('notes'); return; }
    save(); buildSB(); buildTabBar(); renderCanvas();
  }]);
  showMenu(anchorEl, entries);
}

// Page menu (the \u22ee after the page tabs): rename, move, delete
function showPageMenu(anchorEl, ch, page) {
  var i = ch.pages.indexOf(page);
  var entries = [['\u270e Rename page', function() {
    var name = prompt('Rename page:', page.label);
    if (name && name.trim()) { page.label = name.trim(); save(); buildTabBar(); renderCanvas(); }
  }]];
  if (i > 0) entries.push(['\u2190 Move left', function(){ ch.pages.splice(i, 1); ch.pages.splice(i - 1, 0, page); save(); buildTabBar(); }]);
  if (i < ch.pages.length - 1) entries.push(['\u2192 Move right', function(){ ch.pages.splice(i, 1); ch.pages.splice(i + 1, 0, page); save(); buildTabBar(); }]);
  entries.push('-');
  entries.push(['\ud83d\uddd1 Delete page', function() {
    if (!confirm('Delete the page "' + page.label + '"?')) return;
    ch.pages.splice(ch.pages.indexOf(page), 1);
    curPage = ch.pages.length ? ch.pages[Math.max(0, i - 1)].id : null;
    save(); buildTabBar(); renderCanvas();
  }]);
  showMenu(anchorEl, entries);
}

// --- TAB BAR (chapters/projects) ---------------------------------
function buildTabBar() {
  var bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  var meta = bm(curTab);
  bar.style.display = 'flex';
  bar.style.setProperty('--rc', meta.color);

  function pill(label, on, onclick) {
    var btn = el('button', 'tab-pill' + (on ? ' on' : ''));
    btn.style.setProperty('--rc', meta.color);
    var dot = el('div', 'tab-dot'); dot.style.background = meta.color;
    btn.appendChild(dot); btn.appendChild(tx(label));
    btn.onclick = onclick;
    bar.appendChild(btn);
    return btn;
  }
  function crumb(label) {
    var c = el('div', 'tab-crumb'); c.title = 'Back to Notes';
    c.appendChild(tx(label));
    c.onclick = function(){ openSection('notes'); };
    bar.appendChild(c);
  }

  pill('Notes', curSec === 'notes', function(){ openSection('notes'); });

  var ch = (curSec === 'chapter' && curChapter) ? findChapter(curChapter) : null;
  if (!ch) return;
  crumb('\u2190 ' + ch.label);

  // Ramhaus has two views instead of pages: the wheel and its planning notes
  if (ch.id === 'ch-t1') {
    if (window._ramhausView !== 'notes') window._ramhausView = 'wheel';
    pill('\u262f Wheel', window._ramhausView === 'wheel', function(){ window._ramhausView = 'wheel'; buildTabBar(); renderCanvas(); });
    pill('\ud83d\udcdd Notes', window._ramhausView === 'notes', function(){ window._ramhausView = 'notes'; buildTabBar(); renderCanvas(); });
    return;
  }

  if (!ch.pages) ch.pages = [];
  ch.pages.forEach(function(page) {
    pill(page.label, curPage === page.id, function(){ curPage = page.id; buildTabBar(); renderCanvas(); });
  });
  var addPg = el('button', 'tab-add'); addPg.title = 'Add page'; addPg.appendChild(tx('+'));
  addPg.onclick = addPage;
  bar.appendChild(addPg);
  var page = ch.pages.filter(function(p){ return p.id === curPage; })[0];
  if (page) {
    var more = el('button', 'tab-add'); more.title = 'Rename, move or delete this page'; more.appendChild(tx('\u22ee'));
    more.onclick = function(e){ e.stopPropagation(); showPageMenu(more, ch, page); };
    bar.appendChild(more);
  }
}

function addPage() {
  var ch = curChapter ? findChapter(curChapter) : null;
  if (!ch) return;
  var name = prompt('Page name?');
  if (!name || !name.trim()) return;
  var page = {id:'pg'+Date.now(), icon:'\ud83d\udcc4', label:name.trim(), content:''};
  if (!ch.pages) ch.pages = [];
  ch.pages.push(page);
  curPage = page.id;
  save(); buildTabBar(); renderCanvas();
}

function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }

function applySidebarLayout() {
  var sb = document.getElementById('sb');
  var sbc = document.getElementById('sb-collapse');
  if (!sb || !S.ui) return;
  if (window.innerWidth <= 680) {
    sb.classList.remove('collapsed');
    sb.style.width = '';
    if (sbc) sbc.textContent = '\u25c0';
    return;
  }
  sb.style.width = clamp(S.ui.sbWidth || 196, 150, 420) + 'px';
  sb.classList.toggle('collapsed', !!S.ui.sbCollapsed);
  if (sbc) {
    sbc.textContent = S.ui.sbCollapsed ? '>' : '\u25c0';
    sbc.title = S.ui.sbCollapsed ? 'Expand left sidebar' : 'Collapse left sidebar';
    sbc.style.display = 'flex';
    sbc.style.right = S.ui.sbCollapsed ? '-28px' : '8px';
  }
}

function initSidebarControls() {
  var layout = document.getElementById('layout');
  var sbHandle = document.getElementById('sb-resize');
  var sbCollapse = document.getElementById('sb-collapse');
  if (!layout || !sbHandle || !sbCollapse) return;

  sbCollapse.onclick = function() {
    if (window.innerWidth <= 680) return;
    S.ui.sbCollapsed = !S.ui.sbCollapsed;
    save();
    applySidebarLayout();
  };
  sbHandle.onmousedown = function(e) {
    if (window.innerWidth <= 900) return;
    e.preventDefault();
    layout.classList.add('dragging-sidebars');
    sbHandle.classList.add('dragging');
    function move(ev) {
      S.ui.sbCollapsed = false;
      S.ui.sbWidth = clamp(ev.clientX - layout.getBoundingClientRect().left, 150, 420);
      applySidebarLayout();
    }
    function up() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      layout.classList.remove('dragging-sidebars');
      sbHandle.classList.remove('dragging');
      save();
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
  window.addEventListener('resize', applySidebarLayout);
  applySidebarLayout();
}

function renderCanvas() {
  var cv = document.getElementById('canvas');
  cv.innerHTML = '';
  cv.className = '';
  cv.style.cssText = 'padding:32px 40px;overflow-y:auto';
  var box = bx(curTab);
  if (!box) return;
  var meta = bm(curTab);
  if (curSec === 'notes')      { renderNotes(cv, meta, box); return; }
  if (curSec === 'curriculum') { renderCurriculum(cv, meta); return; }
  if (curSec === 'chapter')    { renderChapterPage(cv, meta, box); return; }
}

      { id:'u4',num:4,title:'Water Color',overview:'Watercolor works backward from everything you\'ve painted so far: you save your lights instead of adding them. You\'ll learn flat, graded, and wet-on-wet washes, how to layer transparent color, and when to stop. Then you\'ll take it outside to paint real places quickly and loosely. By the end, you should be able to plan a painting from light to dark and capture a scene with fresh, confident washes.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u4p1',tier:'TIER 1',name:'Water Color Worksheet',pts:2,desc:'Practice flat, graded, wet-on-wet, and wet-on-dry washes, plus lifting and salt texture.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u4p2',tier:'TIER 1',name:'Value Wash Scale',pts:2,desc:'Build a value scale from one color by layering transparent washes from light to dark.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u4p3',tier:'TIER 2',name:'Object Study Painting',pts:4,desc:'Paint a single object from observation, building its form in layers from light washes to dark details.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u4p4',tier:'TIER 2',name:'Contour Watercolor Portrait',pts:4,desc:'Draw a continuous-line ink portrait, then drop loose watercolor washes over and around the lines.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u4p5',tier:'TIER 3',name:'Urban Sketching Final',pts:8,desc:'Draw and paint a real location on site or from your own photo, using ink line and watercolor washes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u4p6',tier:'WILD CARD',name:'Holiday Project (TBD)',pts:null,desc:'A seasonal project to close the semester; details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
    ]

  {
    id:'draw2',label:'Draw + Paint 2',color:'#D35400',
    units:[
      { id:'u5',num:5,title:'Colored Pencil',overview:'Colored pencil rewards patience: color builds up slowly in thin layers until it looks painted. You\'ll learn layering, blending, and burnishing, then use them to render shiny, reflective surfaces. The unit closes with a portrait in full color. By the end, you should be able to mix color right on the paper and render skin, shine, and texture with control.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u5p1',tier:'TIER 1',name:'Colored Pencil Intro Worksheet',pts:2,desc:'Learn pressure control, layering, blending, and burnishing, and when to use each.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u5p2',tier:'TIER 1',name:'Color Layering Gradients',pts:2,desc:'Blend two and three colors into smooth gradients by layering, without a blender.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u5p3',tier:'TIER 2',name:'Koons Dog',pts:4,desc:'Render Jeff Koons\' Balloon Dog, using layered color to show its mirror-like reflections and highlights.',materials:['Balloon Dog reference','Pencil or colored pencil','Drawing paper'],steps:['Research Jeff Koons and his Balloon Dog sculpture.','Sketch the basic balloon tube shapes.','Identify where light hits the shiny surface -- sharp highlights.','Apply full value range within each tube form.','Add a sharp bright highlight using eraser or white pencil.','Remember: reflection wraps around each balloon.'],tip:'Shiny = sharpest highlights AND darkest darks right next to each other.',rubric:[{name:'Reflective Highlights',desc:'Sharp, bright highlight present'},{name:'Value Range',desc:'Full range including very dark'},{name:'Form',desc:'Balloon tubes read as 3D'},{name:'Craftsmanship',desc:'Clean, polished work'}]},
        {id:'u5p4',tier:'TIER 2',name:'Layered Fruit Study',pts:4,desc:'Draw a piece of fruit from observation, building at least five layers of color for form and texture.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u5p5',tier:'TIER 3',name:'Half Face Celeb (Color Edition)',pts:8,desc:'Complete the missing half of a celebrity photo, matching its skin tones, values, and shadows in colored pencil.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u5p6',tier:'WILD CARD',name:'Guided Landscape Revisited',pts:null,desc:'Redraw your first-week landscape now that you know layering, and compare the two side by side.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u5p7',tier:'WILD CARD',name:'Sneaker Design',pts:null,desc:'Design a custom sneaker and render it in colored pencil with shine, stitching, and texture.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u6',num:6,title:'Charcoal',overview:'Charcoal is messy, fast, and dramatic, and that\'s the point. You\'ll push value further than pencil allows, work on toned paper, and pull light out of dark with an eraser. Then you\'ll turn to the human figure, starting with gesture and building to a full drawing. By the end, you should be able to draw with bold, expressive value and capture a figure\'s pose and proportions.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u6p1',tier:'TIER 1',name:'Charcoal Intro Worksheet',pts:2,desc:'Learn vine, compressed, and white charcoal, blending tools, and subtractive erasing.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p2',tier:'TIER 1',name:'Toned Paper Shading',pts:2,desc:'Shade forms on toned paper, adding darks with charcoal and highlights with white.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u6p3',tier:'TIER 2',name:'Charcoal Water Droplet',pts:4,desc:'Render realistic water droplets by blending soft shadows and lifting out sharp highlights.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p4',tier:'TIER 2',name:'Still Life Practice',pts:4,desc:'Draw a lit still life from observation, focusing on dramatic contrast and cast shadows.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p5',tier:'TIER 2',name:'Gesture Drawings',pts:4,desc:'Capture a model\'s pose in 30-second to 2-minute gestures, focusing on movement over detail.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u6p6',tier:'TIER 3',name:'Figure Drawing',pts:8,desc:'Draw a full figure from a live model or reference, with accurate proportions and dramatic value.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p7',tier:'WILD CARD',name:'Expressive Self-Portrait',pts:null,desc:'Draw a large, loose self-portrait that exaggerates contrast to show a mood.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u6p8',tier:'WILD CARD',name:'Night Scene',pts:null,desc:'Draw a street or room at night lit by a single lamp or window, working light out of a dark ground.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u7',num:7,title:'Pastel',overview:'Pastel sits between drawing and painting: you draw with pure pigment and blend it like paint. You\'ll explore both soft pastel and oil pastel, from smooth blends to scratch-through sgraffito and wax resist. Then you\'ll use bold, saturated color to build a still life or landscape that glows. By the end, you should be able to layer and blend pastel color to create vivid, expressive images.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u7p1',tier:'TIER 1',name:'Pastel Intro Worksheet',pts:2,desc:'Learn soft pastel and oil pastel handling, layering, and the vocabulary for both.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u7p2',tier:'TIER 1',name:'Soft Pastel Blending',pts:2,desc:'Practice smooth gradients and color mixing, blending with fingers, stumps, and paper towels.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p3',tier:'TIER 1',name:'Oil Pastel Techniques',pts:2,desc:'Try sgraffito, wax resist, and heavy layering on a technique sampler.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p4',tier:'TIER 2',name:'Color Blend Sunset',pts:4,desc:'Blend a sunset sky in soft pastel, moving through at least four colors without muddy transitions.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p5',tier:'TIER 2',name:'Sgraffito Pattern Study',pts:4,desc:'Layer oil pastel colors, then scratch a pattern through the top layer to reveal the color underneath.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p6',tier:'TIER 2',name:'Complementary Shadow Study',pts:4,desc:'Draw a simple object with shadows mixed from its complement instead of black.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p7',tier:'TIER 3',name:'Bold Still Life',pts:8,desc:'Draw a still life with saturated color and strong light, filling the whole page with no bare paper.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p8',tier:'WILD CARD',name:'Wayne Thiebaud Desserts',pts:null,desc:'Draw a row of cakes or pies with thick color and colored shadows in the style of Wayne Thiebaud.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u8',num:8,title:'Scratchboard',overview:'Scratchboard flips drawing upside down: you start with black and scratch your way to the light. Every mark removes ink, so you\'ll plan your highlights first and build texture one line at a time. You\'ll practice fur, feathers, and scales before taking on an animal portrait. By the end, you should be able to reverse your value thinking and render detailed texture with subtractive lines.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u8p1',tier:'TIER 1',name:'Scratchboard Intro Worksheet',pts:2,desc:'Learn the tools, safe scratching, and the basic marks: hatching, stippling, and crosshatching in reverse.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u8p2',tier:'TIER 1',name:'Value Reversal Study',pts:2,desc:'Draw a simple form on black by scratching out its highlights first, then its midtones.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u8p3',tier:'TIER 2',name:'Texture Sampler',pts:4,desc:'Scratch a grid of textures such as fur, feathers, scales, wood, and water, each in its own box.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u8p4',tier:'TIER 2',name:'Animal Eye Study',pts:4,desc:'Render a close-up animal eye with its reflection and the fur, feathers, or scales around it.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u8p5',tier:'TIER 3',name:'Scratchboard Animal',pts:8,desc:'Render an animal from reference, using directional lines to show its fur, feathers, or scales.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u8p6',tier:'WILD CARD',name:'Colored Scratchboard',pts:null,desc:'Add ink or watercolor over your scratched lines to bring color into one area of emphasis.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u9',num:9,title:'Animation',overview:'Animation is drawing in time: each frame is a drawing, and the life comes from the changes between them. You\'ll start with flipbooks and simple loops, then learn timing, squash and stretch, and anticipation. You\'ll plan a short sequence with a storyboard and bring it to life. By the end, you should be able to make a drawing move with believable timing and personality.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u9p1',tier:'TIER 1',name:'Animation Intro Worksheet',pts:2,desc:'Learn key frames, in-betweens, frame rate, and the principles that make movement believable.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u9p2',tier:'TIER 1',name:'Flipbook',pts:2,desc:'Draw a flipbook of at least 24 frames showing one simple action, like a growing plant or a melting ice cream cone.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p3',tier:'TIER 2',name:'Bouncing Ball',pts:4,desc:'Animate a ball bouncing to a stop, using squash, stretch, and spacing to show weight.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p4',tier:'TIER 2',name:'Looping GIF',pts:4,desc:'Create a seamless 8 to 12 frame loop, such as a flickering flame, a waving flag, or blinking eyes.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p5',tier:'TIER 2',name:'Zoetrope Strip',pts:4,desc:'Draw a looping strip for a zoetrope and watch your animation spin.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p6',tier:'TIER 3',name:'10-Second Short',pts:8,desc:'Storyboard and animate a 10-second scene with a clear beginning, middle, and end.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p7',tier:'WILD CARD',name:'Rammy Mini Lesson',pts:null,desc:'Animate Rammy, the Ramhaus mascot, teaching one art skill from this year in a 15-second short.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u10',num:10,title:'Masterpiece',overview:'This is your capstone: one piece, your choice of medium, your idea. You\'ll look back at everything you tried this year, pick the medium you control best, and plan a finished work from proposal to critique. You\'ll also prepare your work for display. By the end, you should be able to take an original idea from sketch to a finished, presented artwork on your own.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u10p1',tier:'TIER 1',name:'Masterpiece Intro Worksheet',pts:2,desc:'Review every medium from the year and choose the one you\'ll use, with reasons.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u10p2',tier:'TIER 1',name:'Project Proposal',pts:2,desc:'Write a short plan with your idea, medium, references, and timeline, and get it approved.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p3',tier:'TIER 1',name:'Thumbnail Sketches',pts:2,desc:'Draw at least three thumbnail compositions and pick the strongest with a partner\'s feedback.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p4',tier:'TIER 2',name:'Medium Test Panels',pts:4,desc:'Test your planned colors, textures, and techniques on scrap before you touch the final.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p5',tier:'TIER 2',name:'Composition Study',pts:4,desc:'Draw a full-size value sketch of your final layout to test the composition before you commit.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p6',tier:'TIER 3',name:'Final Masterpiece',pts:8,desc:'Create a finished, original work in your chosen medium that shows the best of what you learned this year.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p7',tier:'WILD CARD',name:'Art Show Setup',pts:null,desc:'Help hang and label the end-of-year art show, and write the placard for your own piece.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
    ]

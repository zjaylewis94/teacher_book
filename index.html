  {
    id:'draw3',label:'Draw + Paint 3',color:'#2471A3',
    units:[
      { id:'u11',num:11,title:'Advanced Pencil',overview:'You already know how to shade a sphere; now you\'ll make light and form do what you want. You\'ll push gradients further, construct complex objects from simple forms, and study how cast shadows bend over surfaces. The unit ends with a surreal landscape where impossible forms still obey real light. By the end, you should be able to invent forms from imagination and light them convincingly.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u11p1',tier:'TIER 1',name:'Pencil Intro Worksheet+',pts:2,desc:'Review pencil grades and value zones, then push into edge control, lost and found edges, and full-range values.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p2',tier:'TIER 1',name:'Advanced Gradients',pts:2,desc:'Blend long, seamless gradients across curved and flat planes without visible steps.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p3',tier:'TIER 2',name:'Fruit Studies',pts:4,desc:'Draw fruit from observation, matching subtle value shifts and surface texture.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p4',tier:'TIER 2',name:'Constructing + Editing Form',pts:4,desc:'Build complex objects from basic forms, then refine the drawing by editing edges and proportions.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p5',tier:'TIER 2',name:'Cast Shadow Studies',pts:4,desc:'Draw how cast shadows stretch, bend, and soften as they fall across different surfaces.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p6',tier:'TIER 3',name:'Surrealist Forms Landscape',pts:8,desc:'Invent a surreal landscape of impossible forms that still follow one consistent light source.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p7',tier:'WILD CARD',name:'Tunnel Book',pts:null,desc:'Build a tunnel book of five or more layers, each shaded to push atmospheric depth.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p8',tier:'WILD CARD',name:'Food Truck',pts:null,desc:'Design a food truck in two-point perspective with a full menu, branding, and a shaded 3D body.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u12',num:12,title:'Advanced Pen + Ink',overview:'In the intro course you learned ink\'s rules; now you\'ll learn to bend them. You\'ll combine precise pen texture with loose ink wash and study how a single brushstroke can hold a whole form. The unit builds to Sumi-e, the Japanese ink painting tradition where restraint does the work. By the end, you should be able to move between controlled line and expressive wash in the same piece.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u12p1',tier:'TIER 1',name:'Pen + Ink Intro Worksheet+',pts:2,desc:'Review ink tools and vocabulary, then add brush pens, dip pens, and ink dilution to your toolkit.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p2',tier:'TIER 1',name:'Pen Shading Techniques',pts:2,desc:'Build value scales in hatching, crosshatching, stippling, and scribbling, with tighter control and a wider range.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p3',tier:'TIER 1',name:'Line Quality + Line Weights',pts:2,desc:'Use line weight to show light direction, overlap, and distance in a single contour drawing.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p4',tier:'TIER 2',name:'Contour Line Forms/Objects',pts:4,desc:'Draw complex objects with cross-contour lines that wrap around each form to describe its surface.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p5',tier:'TIER 2',name:'Ink Wash Blockout / Pen Texture',pts:4,desc:'Block in values with diluted ink wash, then layer pen texture on top for detail.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p6',tier:'TIER 3',name:'Ink Wash (Sumi-e)',pts:8,desc:'Paint a subject in the Sumi-e tradition, using as few brushstrokes as possible to capture its essence.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p7',tier:'WILD CARD',name:'Inktober Sketchbook',pts:null,desc:'Complete the daily Inktober prompts through October, trying a new ink technique each week.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p8',tier:'WILD CARD',name:'Halloween Masks',pts:null,desc:'Design and build a Halloween mask decorated with layered ink pattern and wash.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u13',num:13,title:'Acrylic',overview:'Acrylic is fast, flexible, and unforgiving of muddy color, which makes it the right paint for this level. You\'ll mix precise value scales, paint crinkled and reflective surfaces, and learn to glaze, layer, and build texture. You\'ll finish with a large painting that pulls all of it together. By the end, you should be able to mix and layer acrylic to paint convincing light, reflection, and surface.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u13p1',tier:'TIER 1',name:'Acrylic Intro Worksheet',pts:2,desc:'Learn acrylic handling, brushes, canvas prep, drying time, and palette care.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p2',tier:'TIER 1',name:'Color Theory / Value Scales Worksheet+',pts:2,desc:'Mix tints, shades, tones, and a matched value scale for each color on the wheel.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p3',tier:'TIER 2',name:'That\'s a Wrap!',pts:4,desc:'Paint a wrapped object, capturing the folds, crinkles, and highlights of foil or plastic.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p4',tier:'TIER 2',name:'Sparkmatik Blobs',pts:4,desc:'Paint glossy blob forms with smooth acrylic blends, crisp highlights, and reflected color, in the style of Sparkmatik.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p5',tier:'TIER 2',name:'3D Mecca Chameleon',pts:4,desc:'Paint a chameleon with full form, light, and texture instead of flat shapes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p6',tier:'TIER 3',name:'Candy Box',pts:8,desc:'Paint a candy box composition that shows off color, reflection, and packaging detail.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p7',tier:'WILD CARD',name:'Digital Painting (TBD)',pts:null,desc:'Take this unit\'s painting skills into a digital painting app; project details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p8',tier:'WILD CARD',name:'Vector Painting',pts:null,desc:'Paint an image in flat, hard-edged color shapes inspired by vector art.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u14',num:14,title:'Advanced Water Color',overview:'Now that you can control a wash, you\'ll combine watercolor with other media and work from life. You\'ll layer transparent color under colored pencil detail, paint still lifes from observation, and practice sketching fast on location. The unit ends with an urban sketching piece that captures the feeling of a real place, not just its outline. By the end, you should be able to paint from life with speed and mix watercolor with other media on purpose.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u14p1',tier:'TIER 1',name:'Water Color Worksheet+',pts:2,desc:'Review washes and layering, then add glazing, granulation, masking fluid, and lifting.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p2',tier:'TIER 1',name:'Limited Palette Study',pts:2,desc:'Paint a small scene using only three colors plus water, mixing every other color you need.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u14p3',tier:'TIER 2',name:'Sweet Treats Painting',pts:4,desc:'Paint a dessert in layered watercolor, then add colored pencil details for texture and shine.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p4',tier:'TIER 2',name:'Still Life Practice',pts:4,desc:'Paint a still life from observation, planning your lights before your first wash.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p5',tier:'TIER 3',name:'Urban Sketching Final',pts:8,desc:'Draw and paint a real location on site, capturing its atmosphere with loose line and layered washes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p6',tier:'WILD CARD',name:'Holiday Project (TBD)',pts:null,desc:'A seasonal project to close the semester; details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
    ]

  {
    id:'draw4',label:'Draw + Paint 4',color:'#7D3C98',
    units:[
      { id:'u15',num:15,title:'Advanced Colored Pencil',overview:'You know how to layer color; now you\'ll use it to fool the eye. You\'ll render reflective, transparent, and textured surfaces with enough layers that the paper disappears. The unit ends with a full-face portrait in color. By the end, you should be able to render realistic skin, reflection, and texture in colored pencil.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u15p1',tier:'TIER 1',name:'Colored Pencil Intro Worksheet+',pts:2,desc:'Review layering and burnishing, then add solvent blending, impressed lines, and toned paper.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p2',tier:'TIER 1',name:'Skin Tone Mixing',pts:2,desc:'Mix a range of skin tones by layering, then match three tones from photo references.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u15p3',tier:'TIER 2',name:'Colored Pencil Candy Drawing',pts:4,desc:'Render wrapped or glossy candy, capturing transparency, reflections, and crinkled wrappers.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p4',tier:'TIER 2',name:'Glass + Metal Study',pts:4,desc:'Render a glass or metal object, capturing its reflections and the distorted view through it.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u15p5',tier:'TIER 3',name:'Full Face Celeb (Color Edition)',pts:8,desc:'Draw a full celebrity portrait from a photo, with accurate proportions, skin tones, and lighting.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p6',tier:'WILD CARD',name:'Album Cover',pts:null,desc:'Design and render a cover for a real or imagined album, combining lettering with a realistic object.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u16',num:16,title:'Advanced Charcoal',overview:'Charcoal at this level is about drama and control at the same time. You\'ll build still lifes with strong light, draw a stylized portrait, and spend serious time with the figure. You\'ll work larger and faster than you\'re used to. By the end, you should be able to draw an expressive, anatomically sound figure with a full range of value.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u16p1',tier:'TIER 1',name:'Charcoal Intro Worksheet+',pts:2,desc:'Review charcoal types and erasing, then push into toned paper, white charcoal, and drawing out of a dark ground.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p2',tier:'TIER 1',name:'8 Head Figure Proportions',pts:2,desc:'Map the human figure in 8-head proportions and draw it standing, seated, and in motion.',materials:[],steps:[],tip:'',rubric:[],suggested:true},

      { id:'u19',num:19,title:'Advanced Animation',overview:'You know how to make a drawing move; now you\'ll make it act. You\'ll animate walk cycles, lip sync, and characters with weight and emotion, and you\'ll plan a short with a storyboard and animatic. The unit ends with a finished short film. By the end, you should be able to plan, animate, and edit a short piece that tells a story.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[

  u1: [
    {"group": "TIER 1", "title": "[TIER 1] Pencil Intro Worksheet", "pts": "2 points", "attach": "the worksheet from UNIT 01 PENCIL / PENCIL INTRO WORKSHEET", "desc": "Meet your pencils. Learn what the numbers and letters on a pencil mean, practice the basic marks, and pick up the vocabulary you'll use all year: value, gradient, hatching, and contour.", "steps": ["Complete every section of the worksheet in pencil.", "Test each pencil grade you have (H, HB, 2B, 4B, 6B) and label each swatch.", "Practice each mark: hatching, crosshatching, stippling, blending, and contour line.", "Define each vocab word in your own words.", "Turn it in or just show me in class."], "focus": "Focus on neat, controlled marks and complete answers."},
    {"group": "TIER 1", "title": "[TIER 1] Value Practice", "pts": "2 points", "attach": "a finished example (Drive folder: SHADING PRACTICE)", "desc": "Value is how light or dark something is, and every medium in this class runs on it. Build a 9-step value scale and a smooth gradient so you know your full range, from bright white to your darkest dark.", "steps": ["Draw a long rectangle and divide it into 9 equal boxes.", "Leave box 1 paper white. Make box 9 the darkest dark you can get. Fill boxes 2–8 so each one is a step darker than the last.", "Draw a second rectangle underneath. Shade it as one smooth gradient from white to darkest dark, with no steps or lines showing.", "Squint at your work. If two boxes look the same, fix them.", "Turn it in or just show me in class."], "focus": "Focus on even steps, smooth blending, and a true dark at the end."},
    {"group": "TIER 1", "title": "[TIER 1] Shading with Forms", "pts": "2 points", "attach": "a five-value-zones diagram or demo video", "desc": "Almost everything you'll ever draw is built from four forms: sphere, cube, cylinder, and cone. Shade all four under one light source so they look solid.", "steps": ["Draw a sphere, cube, cylinder, and cone.", "Pick one light source and mark it with an arrow or small sun in the corner of your page. Every form is lit from that same spot.", "Shade each form with all five value zones: highlight, midtone, core shadow, reflected light, and cast shadow.", "Give each form a cast shadow on the ground, falling away from the light.", "Turn it in or just show me in class."], "focus": "Focus on one consistent light direction and smooth transitions."},
    {"group": "TIER 2", "title": "[TIER 2] Mad Scientist Light Logic", "pts": "4 points", "attach": "an example or reference photo", "desc": "Every shadow has a reason. Play mad scientist: set up a group of forms under one dramatic light, then prove you know where every highlight and shadow comes from.", "steps": ["Draw a group of at least 3 forms that overlap (spheres, cubes, cylinders, cones, or lab gear built from them).", "Place one dramatic light source and mark it on your page.", "Shade every form with all five value zones. Draw each cast shadow falling away from the light, including shadows that land on other forms.", "Label your evidence. Use arrows and short notes to point out a highlight, a core shadow, reflected light, a cast shadow, and one shadow landing on another object. Explain why each one is where it is.", "Turn it in or just show me in class."], "focus": "Focus on logic: if the light moved, every shadow would have to move with it."},
    {"group": "TIER 2", "title": "[TIER 2] Extruding 101", "pts": "4 points", "attach": "a step-by-step demo", "desc": "Push flat shapes and letters into solid 3D blocks using a vanishing point. It's how signs, logos, and block letters get their depth.", "steps": ["Draw a horizon line and put one vanishing point on it.", "Draw at least 5 flat shapes plus your name or initials in block letters. Place some above, some below, and some on the horizon line.", "From every corner of each shape, draw a light line back to the vanishing point.", "Decide how deep each block goes, then close off the back edges parallel to the front.", "Erase the extra guidelines and shade the sides with one light source so the blocks look solid.", "Turn it in or just show me in class."], "focus": "Focus on straight guidelines (use a ruler!) and consistent shading."},
    {"group": "TIER 3", "title": "[TIER 3] 1 Point Perspective Room", "pts": "8 points", "attach": "1_Point_Perspective_Room.png (in UNIT 01 PENCIL)", "desc": "Design your own room in one-point perspective, then furnish it with solid, shaded objects that all share one light source. Everything from Unit 1 comes together here.", "steps": ["Draw the back wall. It's usually a rectangle.", "Draw the horizon line. This is eye level.", "Put your vanishing point anywhere on the horizon line.", "Connect lines from the vanishing point through the corners of the back wall and extend them to the edges of the page.", "Erase the lines inside the back wall.", "Draw at least 5 objects (bed, dresser, closet, windows, rug, shelves...). Every receding line goes to the same vanishing point.", "Pick one light source, like a window or lamp, and shade every object and its cast shadow from it.", "Erase extra lines, add detail, and make the room feel like it belongs to someone."], "focus": "Focus on accurate perspective, consistent shading, and effort."},
    {"group": "WILD CARD", "title": "[WILD CARD] Tunnel Book", "pts": "4 points", "attach": "a finished example or a how-to video", "desc": "Build a layered tunnel book where each cut paper layer steps back in space to create depth. Look through the front and the scene should feel like it keeps going.", "steps": ["Pick a scene with a clear foreground, middle ground, and background (forest, city street, underwater, a stage...).", "Plan at least 4 layers on scratch paper: a front frame, 2 or more middle layers, and a back wall.", "Draw each layer on cardstock and cut out an opening in each one so you can see through to the layers behind it.", "Add value in pencil or ink: darker and more detailed up front, lighter and simpler as the layers go back.", "Fold two accordion strips for the sides and glue each layer into its own fold.", "Turn it in or just show me in class."], "focus": "Focus on depth, clean cuts, and craftsmanship."},
    {"group": "WILD CARD", "title": "[WILD CARD] Food Truck", "pts": "4 points", "attach": "the fold-up food truck template", "desc": "Design your own food truck, then fold it into a 3D model. Invent the food, name the business, and make it look like somewhere people would line up.", "steps": ["Invent your business: a name, what you sell, and a logo.", "Sketch your design lightly on each flat panel of the template: windshield and wheels on the front and sides, a serving window and awning on one side.", "Add signage with your business name and a menu board with at least 5 items and prices.", "Finish it in pencil or ink with clean lines and at least 3 values of shading.", "Cut, fold, and glue it into its 3D shape.", "Turn it in or just show me in class."], "focus": "Focus on creativity, craftsmanship, and effort."},
  ],
  u2: [
    {"group": "TIER 1", "title": "[TIER 1] Pen + Ink Intro Worksheet", "pts": "2 points", "attach": "the pen + ink intro worksheet", "desc": "Ink doesn't erase, so every mark is a decision. Learn the tools, the vocabulary, and the ground rules for working in a medium you can't take back.", "steps": ["Complete every section of the worksheet in ink. No pencil on this one.", "Test each pen you have (fine liner, marker, brush pen, ballpoint) and label each swatch with its name.", "Practice the four ink marks: hatching, crosshatching, stippling, and scribbling.", "Define each vocab word in your own words: line weight, contour, hatching, crosshatching, stippling, and texture.", "Turn it in or just show me in class."], "focus": "Focus on steady, confident lines and complete answers."},
    {"group": "TIER 1", "title": "[TIER 1] Pen Shading Techniques", "pts": "2 points", "attach": "a finished example", "desc": "In ink, you can't smudge a shadow. You build value by stacking lines and dots. Practice four ways to shade with a pen and make a value scale with each one.", "steps": ["Draw 4 rows of 5 boxes. Label the rows hatching, crosshatching, stippling, and scribbling.", "In each row, leave box 1 white and make box 5 as dark as that technique can go.", "Fill boxes 2–4 so each one steps darker. Get darker by adding more lines or dots, not by pressing harder.", "Below the scales, shade one sphere with your favorite technique.", "Turn it in or just show me in class."], "focus": "Focus on even spacing, clean steps, and patience (stippling takes time!)."},
    {"group": "TIER 1", "title": "[TIER 1] Line Quality + Line Weights", "pts": "2 points", "attach": "a line weight example", "desc": "A thick line pushes forward and a thin line falls back. Learn to control line weight so your drawings show depth without any shading.", "steps": ["Fill a row with lines from your thinnest pen to your thickest. Label each one.", "Draw one line that swells from thin to thick to thin without lifting your pen.", "Draw 3 simple objects that overlap (a mug, a book, an apple...).", "Go over the outside edges and the edges closest to you with a thick line. Use thin lines for inside details and edges farther away.", "Add thicker lines on the shadow side of each object, opposite your light source.", "Turn it in or just show me in class."], "focus": "Focus on confident strokes: one smooth line beats five sketchy ones."},
    {"group": "TIER 2", "title": "[TIER 2] Contour Line Hands", "pts": "4 points", "attach": "blind, continuous, and cross-contour examples", "desc": "Your hand is the one model you always have with you. Draw it three ways (blind, continuous, and cross-contour) to train your eye to follow edges and surfaces.", "steps": ["Blind contour: look only at your hand, not the paper, and draw it slowly in one line. Do 2 of these.", "Continuous contour: now you can look at the paper, but don't lift your pen. Draw your hand in a new pose.", "Cross-contour: draw your hand in a third pose, then add lines that wrap across the fingers and palm to show their curve, like bands around a tube.", "Make your final drawing larger than your real hand and use at least 2 line weights.", "Turn it in or just show me in class."], "focus": "Focus on slow, careful looking. Weird-looking blind contours are part of the process."},
    {"group": "TIER 2", "title": "[TIER 2] Zen Doodle w/ Emphasis", "pts": "4 points", "attach": "a finished example", "desc": "Fill a design with repeating ink patterns, then make one area the clear focal point through contrast. Every pattern on the page should support the star.", "steps": ["Lightly draw a large shape in pencil (an animal, your initial, an object...) and divide it into 8 or more sections.", "Fill each section with a different repeating pattern in ink.", "Pick one area to be the focal point. Make it stand out with contrast: the darkest darks, the boldest lines, or the most detail, next to calm, simple patterns.", "Use at least 3 line weights and at least one solid black area.", "Erase all pencil lines.", "Turn it in or just show me in class."], "focus": "Focus on pattern variety, clean line work, and one clear focal point."},
    {"group": "TIER 3", "title": "[TIER 3] Weighted Contour Line Still Life Drawing", "pts": "8 points", "attach": "a still life reference photo, or set one up in class", "desc": "Draw a still life from observation using only line: thick and thin contours that show overlap, depth, and form. Everything from Unit 2 comes together here.", "steps": ["Set up or pick a still life of at least 5 overlapping objects with different sizes and textures.", "Sketch the layout lightly in pencil. Fill the page, and let some objects run off the edge.", "Ink every contour. Use thick lines for outside edges, the front objects, and the shadow side. Use thin lines for inside details and objects farther back.", "Add cross-contour lines or texture to at least 2 objects to show their surface.", "Add one area of value with a technique from Pen Shading Techniques.", "Erase all pencil lines and check that every edge shows a clear line weight choice."], "focus": "Focus on line weight, overlap, and careful observation."},
    {"group": "WILD CARD", "title": "[WILD CARD] Inktober", "pts": "1 point per 2 Drawings", "attach": "How To Do Inktober! (YouTube) and this year's prompt list image", "desc": "Challenge yourself with daily ink drawings based on fun prompts. It's all about creativity, consistency, and having fun with black ink (or digital \"ink\")", "steps": ["Use the prompt list to inspire each drawing. OR come up with your own prompt!", "You may start with a pencil sketch, but it has to be finished in black ink.", "Turn them in stapled together or just show me in class."], "focus": "Focus on line quality, creativity, and effort."},
    {"group": "WILD CARD", "title": "[WILD CARD] Halloween Masks", "pts": "4 points", "attach": "example masks or a paper mache how-to video", "desc": "Design and build your own paper mache Halloween mask, then paint a design on it. Scary, funny, or just strange: it's your call.", "steps": ["Sketch 3 mask ideas in your sketchbook and pick the strongest one.", "Build the base form (a balloon, a mask form, or cardboard) and cover it with 3 layers of paper mache. Let each layer dry.", "Add 3D features like horns, a nose, or ears with cardboard or rolled paper, then mache over them.", "Paint a base coat, then paint your design. Use at least 2 colors and one pattern.", "Add outlines and details with marker or ink.", "Turn it in or just show me in class."], "focus": "Focus on craftsmanship, creativity, and effort."},

    {"group": "WILD CARD", "title": "[WILD CARD] Food Truck", "pts": "4 points", "attach": "the fold-up food truck template", "desc": "Design your own food truck, then fold it into a 3D model. Invent the food, name the business, and make it look like somewhere people would line up.", "steps": ["Invent your business: a name, what you sell, and a logo.", "Sketch your design lightly on each flat panel of the template: windshield and wheels on the front and sides, a serving window and awning on one side.", "Add signage with your business name and a menu board with at least 5 items and prices.", "Finish it in pencil or ink with clean lines and at least 3 values of shading.", "Cut, fold, and glue it into its 3D shape.", "Turn it in or just show me in class."], "focus": "Focus on creativity, craftsmanship, and effort."},
    {"group": "WILD CARD", "title": "[WILD CARD] Festival of Arts Submission", "pts": "8 points", "attach": "the Festival of Arts entry rules and deadline", "desc": "Make one finished, original artwork to submit to the Festival of Arts. Any medium from this class works. This is your chance to have your art shown.", "steps": ["Brainstorm 3 ideas in your sketchbook. Pick one that says something about you or your world.", "Show me your plan before you start the final.", "Make your artwork in any medium we've learned. It has to be your own original idea, not copied from a photo or another artist.", "Give it a title and write a 2–3 sentence artist statement: what it is, what it means, and how you made it.", "Turn in the artwork and the statement together."], "focus": "Focus on craftsmanship, originality, and a finished, show-ready piece."},

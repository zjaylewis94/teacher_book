  // Last year's courses, kept for their written-up steps and rubrics (archived:true).
  {
    id:'ly-dp2',label:'Last Year · Draw & Paint 2',color:'#95A5A6',archived:true,
    units:[
      { id:'ly-u4',num:4,title:'Value + Color',overview:'Value and color control mood, depth, and focus. Learn how light works first, then how color behaves.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'}, projects:[
        {id:'ly-p1',tier:'TIER 1',name:'Pen and Shade Practice',pts:2,desc:'Explore 6 value techniques -- hatching, crosshatching, scrumble, stipple, tonal, and smudge.',materials:['Pen & Shade Worksheet ×2','Black pen or pencil'],steps:['Grab both Pen & Shade practice worksheets.','In each row, study the example technique shown.','Complete the technique in the practice box.','Apply that technique to the object beside it.','Assume light source is upper left for each object.','Fill in all 6 techniques for full credit.'],tip:'Techniques: Hatching · Cross-Hatching · Scrumble · Stipple · Tonal · Smudge',rubric:[{name:'Technique Accuracy',desc:'Each technique matches its example',d:{'0':'Not attempted','1':'1-2 attempted','2':'3-4 accurate','3':'5 of 6 accurate','4':'All 6 accurate'}},{name:'Value Range',desc:'Light, midtone & shadow visible',d:{'0':'Not attempted','1':'Mostly one value','2':'Limited variation','3':'Clear range, minor gaps','4':'Full range in each technique'}},{name:'Light Source',desc:'Shading direction consistent',d:{'0':'Not attempted','1':'Unclear','2':'Some inconsistency','3':'Mostly consistent','4':'Clear & consistent'}},{name:'Completion',desc:'All 6 techniques filled in',d:{'0':'Not submitted','1':'1-2 done','2':'3-4 done','3':'5 done','4':'All 6 done'}}]},
        {id:'ly-p2',tier:'TIER 1',name:'Depth Illusion Boxes',pts:2,desc:'Create the illusion of depth by applying value to simple box forms.',materials:['Pencil','Worksheet or blank paper','Ruler'],steps:['Draw or use the provided box forms.','Choose a consistent light source (upper left).','Identify light face, mid face, and shadow face.','Shade each face a different value: light, mid, dark.','Add a cast shadow beside each box.','Use at least 3 distinct value steps.'],tip:'Sharper value contrast = more convincing depth.',rubric:[{name:'Value Steps',desc:'3+ distinct values visible',d:{'0':'Not attempted','1':'Mostly one value','2':'Some difference','3':'3 values on most','4':'Clear light/mid/dark on every box'}},{name:'Light Source',desc:'Consistent direction',d:{'0':'Not attempted','1':'Inconsistent','2':'Some errors','3':'Mostly consistent','4':'Perfectly consistent'}},{name:'Cast Shadow',desc:'Shadows present & believable',d:{'0':'Not attempted','1':'Shadows unclear','2':'Some shadows','3':'Most boxes have shadows','4':'All boxes, correct direction'}},{name:'Craftsmanship',desc:'Clean, controlled shading',d:{'0':'Not attempted','1':'Messy','2':'Some roughness','3':'Mostly clean','4':'Clean edges, smooth gradients'}}]},
        {id:'ly-p3',tier:'TIER 1',name:'Color Wheel Studies',pts:2,desc:'Build a complete color wheel demonstrating primary, secondary, and intermediate colors.',materials:['Color wheel template','Paint (acrylic or watercolor)','Brushes','Water cup'],steps:['Place 3 primaries evenly: Red, Yellow, Blue.','Mix and paint 3 secondaries: Orange, Green, Violet.','Mix and paint 6 intermediate (tertiary) colors.','Keep each section clean and fully filled.','Label primary, secondary, and tertiary in your key.','Show complementary color pairs in a second section.'],tip:'Mix from lightest to darkest -- don\'t add dark paint to a light puddle.',rubric:[{name:'Color Accuracy',desc:'Colors in correct positions',d:{'0':'Not attempted','1':'6 or fewer','2':'7-9 correct','3':'10-11 correct','4':'All 12 correct and in order'}},{name:'Mixing Quality',desc:'Clean, accurate mixes',d:{'0':'Not attempted','1':'Very muddy','2':'Some muddy','3':'Most correct','4':'All mixes accurate & vibrant'}},{name:'Craftsmanship',desc:'Neat, fully painted sections',d:{'0':'Not attempted','1':'Incomplete','2':'Several patchy','3':'Mostly filled','4':'All sections neatly filled'}},{name:'Completion',desc:'All 12 sections + labels',d:{'0':'Not submitted','1':'7 or fewer','2':'8-11 done','3':'12 sections, no labels','4':'12 sections + key'}}]},
        {id:'ly-p4',tier:'QUIZ',name:'Value + Color Quiz',pts:2,desc:'Demonstrate knowledge of value, shading, and color theory.',materials:['Pencil','Quiz handout'],steps:['Complete all questions on the quiz handout.','Show your work on visual questions.','Turn in when finished.'],tip:'Review your Color Wheel and Pen & Shade Practice first.',rubric:[]},
        {id:'ly-p5',tier:'TIER 2',name:'Geo Forms Shading Exercise',pts:3,desc:'Shade basic geometric forms showing accurate light source, value transitions, and 3D form.',materials:['Pencil (range of hardness)','Geo forms worksheet','Blending stump (optional)'],steps:['Use provided sphere, cube, cone, and cylinder.','Choose a consistent light source (upper left).','Apply all 5 zones: highlight, midtone, core shadow, reflected light, cast shadow.','Blend transitions smoothly -- avoid harsh lines.','Each form should clearly read as 3-dimensional.'],tip:'Reflected light = small lighter area on the darkest edge. Light bouncing off the surface below.',rubric:[{name:'5 Value Zones',desc:'All zones on each form'},{name:'Light Source',desc:'Consistent across all forms'},{name:'3D Illusion',desc:'Forms appear volumetric'},{name:'Blending',desc:'Smooth transitions'}]},
        {id:'ly-p6',tier:'TIER 2',name:'Tree Shading',pts:3,desc:'Apply value techniques to an organic subject -- texture, form, and depth.',materials:['Pencil or pen','Tree reference image','Paper'],steps:['Use or observe a tree reference.','Sketch basic structure -- trunk, branches, foliage clusters.','Block in darkest values first.','Add midtones, then lighten highlight areas.','Suggest texture without drawing every leaf.','Add a ground shadow beneath the tree.'],tip:'Think of the tree crown as overlapping spheres. Shade each cluster like a 3D form.',rubric:[{name:'Value Range',desc:'Light to dark range is clear'},{name:'Texture',desc:'Marks suggest organic texture'},{name:'3D Form',desc:'Tree reads as volumetric'},{name:'Craftsmanship',desc:'Marks are controlled'}]},
        {id:'ly-p7',tier:'TIER 2',name:'Vektor Painting Lesson',pts:3,desc:'Simplify a subject into bold, flat color areas inspired by digital illustration.',materials:['Reference photo','Paint (acrylic)','Paper or canvas board'],steps:['Choose a simple subject: face, animal, or object.','Lightly sketch the main shapes.','Identify 3-4 flat value zones.','Mix a paint color for each zone -- do not blend between zones.','Paint each zone as a clean flat shape with hard edges.','Step back: does it read clearly from a distance?'],tip:'No gradients, no blending -- just clean, bold shapes. Commit to the flat shapes!',rubric:[{name:'Flat Value Zones',desc:'3+ distinct zones visible'},{name:'Hard Edges',desc:'No blending between zones'},{name:'Color Accuracy',desc:'Colors represent correct value areas'},{name:'Readability',desc:'Image reads clearly from a distance'}]},
        {id:'ly-p8',tier:'TIER 3',name:'Half Face Celebrity Shading',pts:8,desc:'Shade half a portrait using realistic value while maintaining accurate facial proportions.',materials:['Celebrity reference photo (printed)','Pencil','Drawing paper','Blending stump'],steps:['Choose and print a clear celebrity portrait (front-facing).','Grid both your reference and drawing paper.','Transfer basic proportions using the grid method.','Leave one half of the face blank.','Build value from dark to light using layered pencil strokes.','Blend smoothly around nose, eye, and cheek.','Add subtle background contrast.'],tip:'Eyes sit at the MIDPOINT of the head -- not near the top. Most common mistake!',rubric:[{name:'Proportions',desc:'Features correctly placed',d:{'0':'Not attempted','1':'Significantly off','2':'Some areas off','3':'Minor errors','4':'Accurate throughout'}},{name:'Value Range',desc:'Full light to dark range',d:{'0':'Not attempted','1':'Mostly one value','2':'Limited range','3':'Good range, minor gaps','4':'Strong full range'}},{name:'Blending',desc:'Smooth transitions on facial planes',d:{'0':'Not attempted','1':'Harsh lines','2':'Uneven areas','3':'Mostly smooth','4':'Very smooth'}},{name:'Craftsmanship',desc:'Clean and controlled',d:{'0':'Not attempted','1':'Careless','2':'Some roughness','3':'Good care','4':'Professional finish'}},{name:'Completion',desc:'Fully realized half-face',d:{'0':'Not submitted','1':'Barely started','2':'Partially done','3':'Complete, minor gaps','4':'Complete & polished'}}]},
        {id:'ly-p9',tier:'TIER 3',name:'Koonz Dog',pts:8,desc:'Study reflective surfaces by shading simplified balloon-like forms inspired by Jeff Koons.',materials:['Balloon Dog reference','Pencil or colored pencil','Drawing paper'],steps:['Research Jeff Koons and his Balloon Dog sculpture.','Sketch the basic balloon tube shapes.','Identify where light hits the shiny surface -- sharp highlights.','Apply full value range within each tube form.','Add a sharp bright highlight using eraser or white pencil.','Remember: reflection wraps around each balloon.'],tip:'Shiny = sharpest highlights AND darkest darks right next to each other.',rubric:[{name:'Reflective Highlights',desc:'Sharp, bright highlight present'},{name:'Value Range',desc:'Full range including very dark'},{name:'Form',desc:'Balloon tubes read as 3D'},{name:'Craftsmanship',desc:'Clean, polished work'}]},
        {id:'ly-p10',tier:'TIER 3',name:'Master Study -- Henry Matisse',pts:8,desc:'Analyze and recreate Matisse\'s use of color, shape, and composition.',materials:['Matisse reference (printed)','Paint (acrylic or gouache)','Canvas board or paper','Brushes'],steps:['Research Henry Matisse -- bold color, flat forms, pattern.','Choose one Matisse work to study.','Lightly sketch main compositional shapes.','Identify the bold color palette.','Paint flat color areas -- do NOT shade realistically.','Focus on relationships between colors.','Add pattern or decorative elements where appropriate.'],tip:'"Color does not add a pleasant quality to design -- it reinforces it." -- Matisse',rubric:[{name:'Color Expression',desc:'Bold, intentional choices'},{name:'Flat Forms',desc:'Shapes flattened, not shaded'},{name:'Composition',desc:'Layout mirrors Matisse\'s approach'},{name:'Craftsmanship',desc:'Clean, fully finished'},{name:'Effort',desc:'Genuine engagement with source'}]},
      ]},
      { id:'ly-u5',num:5,title:'Space + Texture',overview:'Flat paper has no depth -- artists create that illusion through deliberate choices. This unit builds those skills through perspective drawing, texture techniques, and collage.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'}, projects:[
        {id:'ly-u5p1',tier:'TIER 1',name:'Illusion of Space Worksheet',pts:2,desc:'Practice the 6 techniques artists use to create the illusion of depth on a flat surface.',materials:['Illusion of Space worksheet','Pencil','Colored pencils or markers (optional)'],steps:['Receive the Illusion of Space worksheet.','Read each technique: overlap, size, placement, detail, value, and color.','Complete each example box using the technique shown.','Label each technique clearly.','Add color or value where it helps show depth.'],tip:'Overlap is the fastest way to show depth -- when one object covers another, it instantly reads as closer.',rubric:[{name:'Technique Accuracy',desc:'Each box demonstrates the correct technique',d:{'0':'Not attempted','1':'1-2 correct','2':'3-4 correct','3':'5 of 6 correct','4':'All 6 techniques clearly shown'}},{name:'Labels',desc:'Each technique is labeled',d:{'0':'Not attempted','1':'Barely labeled','2':'Some labeled','3':'Most labeled','4':'All labeled correctly'}},{name:'Completion',desc:'All boxes filled in',d:{'0':'Not submitted','1':'1-2 complete','2':'3-4 complete','3':'5 complete','4':'All 6 complete'}},{name:'Effort',desc:'Care shown in each box',d:{'0':'Not submitted','1':'Minimal effort','2':'Some rushed','3':'Most show effort','4':'All boxes thoughtful and clean'}}]},
        {id:'ly-u5p2',tier:'TIER 1',name:'1 Point Perspective Blocks',pts:2,desc:'Use one-point perspective to draw a set of 3D blocks receding to a single vanishing point.',materials:['Pencil','Ruler','Blank paper or worksheet'],steps:['Draw a horizon line across your paper.','Mark one vanishing point (VP) on the horizon line.','Draw the front face of a box -- a simple square or rectangle.','Draw lines from each corner of the front face to the VP.','Close off the back edges to complete the box.','Draw at least 3 boxes at different positions: left, right, and centered.','Erase construction lines and add light shading to show form.'],tip:'Every receding line must go to the SAME vanishing point -- even tiny angles will break the illusion.',rubric:[{name:'Vanishing Point Use',desc:'All lines converge correctly',d:{'0':'Not attempted','1':'Lines don\'t converge','2':'Some lines miss the VP','3':'Mostly correct, minor errors','4':'Perfect convergence on all boxes'}},{name:'Box Construction',desc:'Boxes are properly formed',d:{'0':'Not attempted','1':'Boxes incomplete','2':'1-2 boxes correct','3':'2-3 boxes correct','4':'All 3 boxes clean and correct'}},{name:'Line Quality',desc:'Lines are clean and ruled',d:{'0':'Not attempted','1':'Very rough','2':'Some shaky lines','3':'Mostly clean','4':'All lines sharp and straight'}},{name:'Shading',desc:'Value added to show 3D form',d:{'0':'Not attempted','1':'Minimal shading','2':'Some shading','3':'Most boxes shaded','4':'Clear shading on all boxes'}}]},
        {id:'ly-u5p4',tier:'QUIZ',name:'Space + Texture Quiz',pts:2,desc:'Assess understanding of the illusion of space, perspective, and texture vocabulary.',materials:['Pencil','Quiz handout'],steps:['Complete all questions on the quiz handout.','Answer visual identification questions by labeling diagrams.','Turn in when finished.'],tip:'Review your Illusion of Space worksheet and Textures Practice before taking this.',rubric:[]},
        {id:'ly-u5p5',tier:'TIER 2',name:'1 Point Perspective Name',pts:3,desc:'Draw your name in 1-point perspective block letters receding to a vanishing point.',materials:['Pencil','Ruler','Marker or pen for outlines','Colored pencils or paint (optional)'],steps:['Lightly draw a horizon line and mark one vanishing point.','Write your name in large block letters across the page.','Draw lines from each corner of every letter to the vanishing point.','Close off the depth edges to complete each 3D letter.','Erase construction lines.','Outline letters in pen or marker.','Add color or shading -- lighter on the face, darker on the sides.'],tip:'Keep your block letters simple and wide -- overly thin letters are hard to put in perspective.',rubric:[{name:'Perspective Accuracy',desc:'Lines converge to one VP',d:{'0':'Not attempted','1':'Lines don\'t converge','2':'Some errors','3':'Mostly correct','4':'All lines converge correctly'}},{name:'Letter Construction',desc:'All letters are legible 3D forms',d:{'0':'Not attempted','1':'Letters hard to read','2':'Some letters work','3':'Most letters correct','4':'All letters clean and 3D'}},{name:'Shading / Color',desc:'Value or color adds dimension',d:{'0':'Not attempted','1':'Minimal','2':'Some shading','3':'Mostly shaded','4':'Clear shading on face + sides'}},{name:'Craftsmanship',desc:'Clean lines, neat outlines',d:{'0':'Not attempted','1':'Messy','2':'Some roughness','3':'Mostly clean','4':'Very clean and polished'}}]},
        {id:'ly-u5p9',tier:'TIER 3',name:'2 Point Perspective House',pts:8,desc:'Design and draw a house or building using two-point perspective with accurate construction and detail.',materials:['Pencil','Ruler','Pen or fine liner for outlines','Colored pencils or paint (optional)'],steps:['Draw a horizon line and place two vanishing points near the edges of your paper.','Draw the front corner vertical line -- make it tall for a convincing building.','Construct the basic box form of the house using both VPs.','Add a roof: draw a center vertical above the box, connect it to the top corners.','Add windows and a door -- all receding lines must go to the VPs.','Add details: trim, shutters, chimney, path, landscaping.','Erase all construction lines.','Add color or shading -- 3 values for the 3 visible faces.'],tip:'Doors and windows are just smaller boxes -- use the same VP lines. Everything in 2PP obeys the same two points.',rubric:[{name:'Perspective Accuracy',desc:'All lines converge to correct VPs',d:{'0':'Not attempted','1':'Perspective mostly incorrect','2':'Some errors in construction','3':'Mostly accurate, minor errors','4':'Perfect convergence throughout'}},{name:'Construction',desc:'House is properly built from box form',d:{'0':'Not attempted','1':'Incomplete structure','2':'Basic shape present','3':'Solid structure with minor issues','4':'Clean, complete structure'}},{name:'Detail',desc:'Windows, door, and at least 2 other details',d:{'0':'Not attempted','1':'No added details','2':'1-2 details','3':'3 details, mostly correct','4':'4+ details in correct perspective'}},{name:'Shading / Color',desc:'3 faces show different values',d:{'0':'Not attempted','1':'Flat, no value','2':'Some shading','3':'2 values visible','4':'Clear 3-value shading on all faces'}},{name:'Craftsmanship',desc:'Clean final lines, no construction marks',d:{'0':'Not attempted','1':'Construction lines not erased','2':'Some stray lines','3':'Mostly clean','4':'Very polished and clean'}}]},
        {id:'ly-u5p12',tier:'TIER 3',name:'Master Study -- Banksy',pts:8,desc:'Recreate or reinterpret a work by Banksy, focusing on how he uses space, silhouette, and implied texture to communicate a message.',materials:['Banksy reference image (printed)','Pencil sketch paper','Black spray paint effect','Canvas board or heavy paper'],steps:['Research Banksy -- look at 10+ works. Note his use of stencil, negative space, and humor.','Choose one Banksy piece to study (or create your own in his style).','Sketch the composition -- Banksy works are often simple: one or two figures plus a background.','Create a stencil effect: either cut an actual stencil or simulate spray paint edges.','Focus on SILHOUETTE -- Banksy\'s figures are often pure black shapes.','Add context: a background, wall texture, or environmental element.','Your piece must communicate a clear idea or message.'],tip:'Banksy\'s power is in simplicity. One strong silhouette + one unexpected detail = the whole statement.',rubric:[{name:'Stencil / Silhouette Quality',desc:'Banksy-style silhouette is clear and clean'},{name:'Use of Space',desc:'Negative space used intentionally'},{name:'Message / Concept',desc:'Piece communicates a clear idea'},{name:'Texture / Environment',desc:'Background or surface adds context'},{name:'Craftsmanship',desc:'Clean execution'}]},
      ]},
      { id:'ly-u6',num:6,title:'Balance',overview:'Balance is one of the foundational principles of design -- the visual weight of a composition and how it makes a viewer feel stable, tense, or dynamic. This unit explores symmetrical, asymmetrical, and radial balance through hands-on projects ranging from design exercises to expressive fine art.',deadlines:{t1:'4/8/26',t2:'4/17/26',t3:'4/30/26'}, projects:[
        {id:'ly-u6p1',tier:'TIER 1',name:'Composition Practice',pts:2,desc:'Arrange simple shapes on a page to explore how size, placement, and weight affect visual balance. Try symmetrical, asymmetrical, and radial arrangements.',materials:['Pencil','Paper','Markers or colored pencils'],steps:['Arrange simple shapes on a page.','Try a symmetrical arrangement -- mirror one side.','Try an asymmetrical arrangement -- balance with visual weight, not matching.','Try a radial arrangement -- elements radiating from a center point.','Label each composition with the type of balance it demonstrates.'],tip:'Visual weight isn\'t just about size -- a small dark shape can balance a large light one.',rubric:[{name:'Balance Variety',desc:'Multiple types demonstrated and labeled',d:{'0':'Not attempted','1':'Labels missing or incorrect','2':'1-2 types attempted','3':'2-3 types correct','4':'All 3 types clearly shown and labeled'}},{name:'Visual Weight Awareness',desc:'Intentional use of size, placement, or value',d:{'0':'Not attempted','1':'Shapes placed randomly','2':'Some awareness','3':'Mostly intentional','4':'Clear deliberate control of visual weight'}},{name:'Completion',desc:'All arrangements filled in',d:{'0':'Not submitted','1':'Barely started','2':'Some complete','3':'Most complete','4':'All complete and thoughtful'}}]},
        {id:'ly-u6p2',tier:'TIER 1',name:'Bauhaus Balance Composition',pts:2,desc:'Create a geometric composition inspired by Bauhaus design principles -- primary colors, basic shapes, and deliberate use of visual weight and balance.',materials:['Pencil','Ruler','Markers or paint','Drawing paper'],steps:['Research Bauhaus design -- look at works by Moholy-Nagy, Albers, Klee.','Limit yourself to circles, squares, triangles, and rectangles only.','Limit your palette to primary colors (red, yellow, blue) plus black and white.','Arrange shapes to demonstrate a clear principle of balance.','Fill the composition edge to edge -- no blank center or corner drift.','Title your piece with the type of balance it uses.'],tip:'Bauhaus = function meets beauty. Every shape should earn its place.',rubric:[{name:'Shape Vocabulary',desc:'Only basic geometric forms used',d:{'0':'Not attempted','1':'Shapes not limited','2':'Some non-geometric shapes','3':'Mostly correct, one exception','4':'Strictly limited to basic forms'}},{name:'Color Discipline',desc:'Primary palette only',d:{'0':'Not attempted','1':'Not limited','2':'Some off-palette colors','3':'Mostly correct','4':'Strictly primary + black/white'}},{name:'Balance',desc:'Composition demonstrates intentional balance',d:{'0':'Not attempted','1':'Feels random','2':'Some balance','3':'Mostly balanced','4':'Strong, clear balance principle'}},{name:'Craftsmanship',desc:'Clean edges, neat color fills',d:{'0':'Not attempted','1':'Rough','2':'Some roughness','3':'Mostly clean','4':'Very clean and precise'}}]},
        {id:'ly-u6pq',tier:'QUIZ',name:'Balance Quiz',pts:2,desc:'Assess understanding of symmetrical, asymmetrical, radial, and crystallographic balance -- vocabulary, identification, and application.',materials:['Pencil','Quiz handout'],steps:['Complete all written questions on the quiz handout.','Identify balance types in provided composition diagrams.','Answer short-response questions about visual weight and design decisions.'],tip:'Review your Composition Practice and Bauhaus piece before the quiz.',rubric:[]},
        {id:'ly-u6p4',tier:'TIER 2',name:'Minimalist Album Cover',pts:3,desc:'Design an album cover using only 2-3 colors and minimal shapes. Focus on achieving strong visual balance without relying on detail.',materials:['Heavy paper or cardstock','Ruler','Pencil','Markers or paint','Fine liner for text'],steps:['Invent a band name and album title -- these are your only text elements.','Choose a single dominant image or shape.','Sketch 3 thumbnail compositions before committing.','Choose a palette of 2-3 colors maximum.','Construct your final design with clean, precise shapes and lettering.','Balance your text and image.'],tip:'The best minimalist design removes everything that isn\'t necessary.',rubric:[{name:'Minimalism',desc:'Design uses restraint',d:{'0':'Not attempted','1':'Overcrowded','2':'Some clutter','3':'Mostly minimal','4':'Truly minimal -- every element earns its place'}},{name:'Balance',desc:'Text and image balanced compositionally',d:{'0':'Not attempted','1':'Clearly unbalanced','2':'Some imbalance','3':'Mostly balanced','4':'Strong, intentional balance'}},{name:'Concept',desc:'Communicates a mood or identity',d:{'0':'Not attempted','1':'No concept','2':'Vague','3':'Concept readable','4':'Strong clear concept'}},{name:'Craftsmanship',desc:'Clean, precise finish',d:{'0':'Not attempted','1':'Rough','2':'Some roughness','3':'Mostly clean','4':'Very polished'}}]},
        {id:'ly-u6p5',tier:'TIER 2',name:'Radial Name Design',pts:3,desc:'Write your name in decorative lettering inside one triangle of an 8-fold radial grid, then trace it into all eight sections to create a mandala-style radial symmetry composition.',materials:['Pencil','Compass or circle template','Ruler','Markers or colored pencils','Drawing paper'],steps:['Draw a large circle and divide it into 8 equal wedges (like a pie).','Design your name in decorative block lettering to fit one wedge.','Trace that wedge into all 8 sections using tracing paper or light box.','Each section should be identical -- perfect radial symmetry.','Add color using markers or colored pencils.'],tip:'Radial symmetry reads as unified and powerful -- think mandalas, snowflakes, wheels.',rubric:[{name:'Radial Accuracy',desc:'All 8 sections match',d:{'0':'Not attempted','1':'Clearly uneven','2':'Some sections off','3':'Mostly accurate, minor variations','4':'All sections identical and aligned'}},{name:'Letter Design',desc:'Decorative lettering fits the wedge',d:{'0':'Not attempted','1':'Doesn\'t fit the wedge','2':'Basic, some fitting issues','3':'Good design, mostly fits','4':'Creative and well-fitted'}},{name:'Color',desc:'Color applied cleanly',d:{'0':'Not attempted','1':'Messy','2':'Some roughness','3':'Mostly clean','4':'Very clean and intentional'}}]},
        {id:'ly-u6p6',tier:'TIER 2',name:'Abstract Oil Pastel Design',pts:3,desc:'Create an expressive abstract composition using oil pastels that demonstrates a clear principle of balance -- let color weight, shape, and placement do the work.',materials:['Oil pastels','Heavy paper or cardstock','Reference images (optional)'],steps:['Choose a principle of balance: symmetrical, asymmetrical, or radial.','Block in large color areas first -- don\'t start with detail.','Think about visual weight: dark colors and large shapes carry more weight.','Layer oil pastels -- blend where you want transitions, leave hard edges where you want contrast.','Step back and evaluate: does the composition feel resolved?'],tip:'In abstract work, the viewer can\'t rely on subject matter -- composition and color weight have to carry everything.',rubric:[{name:'Balance Principle',desc:'Clear balance type demonstrated',d:{'0':'Not attempted','1':'Unclear','2':'Some balance','3':'Readable','4':'Strong and unmistakable'}},{name:'Color Weight',desc:'Color used intentionally to balance',d:{'0':'Not attempted','1':'Appears random','2':'Some awareness','3':'Mostly intentional','4':'Sophisticated use of color as weight'}},{name:'Oil Pastel Technique',desc:'Medium used with some control',d:{'0':'Not attempted','1':'Struggling with medium','2':'Some control','3':'Good technique, minor issues','4':'Confident blending and layering'}}]},
        {id:'ly-u6p7',tier:'TIER 3',name:'Asymmetrical Balance Collage / Painting',pts:8,desc:'Create a large-format mixed media piece -- collage and/or paint -- that achieves clear asymmetrical balance. Different visual weights on each side of the composition must feel resolved, not accidental.',materials:['Magazines or printed images for collage','Acrylic or gouache paint','Large paper or canvas board','Glue','Brushes'],steps:['Sketch 3 thumbnail compositions exploring asymmetrical balance.','Choose your strongest thumbnail and scale it up.','Block in large background color areas with paint.','Layer collage elements -- consider texture, value, and scale as visual weight tools.','Add painted details or marks on top of collage.','Final piece should feel balanced but NOT symmetrical -- different on each side, resolved overall.'],tip:'Asymmetrical balance is the hardest to pull off. The two sides should feel like equal weight even though they look completely different.',rubric:[{name:'Asymmetrical Balance',desc:'Both sides feel equal weight, look different',d:{'0':'Not attempted','1':'Feels imbalanced or accidental','2':'Some sense of balance','3':'Mostly balanced, minor issues','4':'Strong, clearly intentional asymmetrical balance'}},{name:'Mixed Media Integration',desc:'Collage and paint work together',d:{'0':'Not attempted','1':'Elements feel separate','2':'Some integration','3':'Mostly cohesive','4':'Seamlessly integrated'}},{name:'Visual Weight Control',desc:'Deliberate use of size, color, and texture',d:{'0':'Not attempted','1':'Appears random','2':'Some control','3':'Good control','4':'Sophisticated control'}},{name:'Scale & Finish',desc:'Large format, fully realized',d:{'0':'Not submitted','1':'Barely started','2':'Partially realized','3':'Mostly complete','4':'Large, complete, and polished'}}]},
        {id:'ly-u6p9',tier:'TIER 3',name:'Master Study -- Josef Albers',pts:8,desc:'Study and recreate a work from Albers\' Homage to the Square series, then design your own variation. Focus on how color relationships, proportion, and placement create optical balance and visual tension.',materials:['Albers reference image (printed)','Ruler','Tape or masking tape','Paint (acrylic or gouache)','Canvas board or heavy paper'],steps:['Research Josef Albers and his Homage to the Square series.','Choose one painting from the series to recreate exactly.','Use a ruler and tape to mask off the nested square composition precisely.','Mix your colors carefully -- match the Albers piece as closely as you can.','Paint each square as a perfectly flat, even area of color.','Remove tape carefully once dry.','Design your own Homage to the Square variation -- new color relationships, your choice.','Write 2-3 sentences: how do the colors interact differently in your version?'],tip:'Albers proved that the same color looks completely different depending on what surrounds it.',rubric:[{name:'Study Accuracy',desc:'Nested squares match the original',d:{'0':'Not attempted','1':'Loosely based','2':'Approximate','3':'Good match, minor variations','4':'Precise, clean match to Albers original'}},{name:'Color Mixing',desc:'Colors closely match the chosen work',d:{'0':'Not attempted','1':'Not matched','2':'Approximate','3':'Close with some variation','4':'Accurate, carefully mixed'}},{name:'Flat Paint Application',desc:'Perfectly smooth, no brushstrokes',d:{'0':'Not attempted','1':'Heavy texture','2':'Some texture','3':'Mostly flat','4':'Perfectly flat throughout'}},{name:'Original Variation',desc:'Student-designed color variation present',d:{'0':'Not attempted','1':'Only the study, no variation','2':'Partial variation','3':'Variation present, no reflection','4':'Original variation complete with reflection'}}]},
      ]},
    ]
  },
  {
    id:'ly-dp4',label:'Last Year · Draw & Paint 4',color:'#95A5A6',archived:true,
    units:[
      { id:'ly-u19',num:19,title:'Heads + Self Portraits',overview:'The human face is one of the most observed and least accurately drawn subjects in art. This unit replaces assumptions with structure, using the Loomis method to build proportion and feature placement from the ground up.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'}, projects:[
        {id:'ly-u19p2',tier:'TIER 1',name:'Facial Feature Worksheet',pts:2,desc:'Study and practice drawing individual facial features -- eyes, nose, mouth, and ears -- in isolation before combining them.',materials:['Facial Feature worksheet','Pencil','Eraser'],steps:['Section 1 -- Eyes: Draw a front-view eye, then a 3/4 view eye. Focus on the tear duct, iris shape, and eyelid thickness.','Section 2 -- Nose: Draw a front-view nose and a 3/4 view nose. Think of the nose as 3 spheres and a base.','Section 3 -- Mouth: Draw lips in rest position, then a slight smile. Focus on the cupid\'s bow and the shadow under the lower lip.','Section 4 -- Ear: Draw a front-view ear. Note the inner ridges -- helix, antihelix, and lobe.','Add light shading to each feature to show basic form.'],tip:'Study features separately before putting them together. Most proportion errors come from guessing instead of observing.',rubric:[{name:'Eye Accuracy',desc:'Front and 3/4 view eyes drawn correctly',d:{'0':'Not attempted','1':'Eyes inaccurate','2':'One view correct','3':'Both views present, minor errors','4':'Both views accurate with shading'}},{name:'Nose Accuracy',desc:'Front and 3/4 view nose drawn correctly',d:{'0':'Not attempted','1':'Nose inaccurate','2':'One view correct','3':'Both views present, minor errors','4':'Both views accurate with shading'}},{name:'Mouth Accuracy',desc:'Lips drawn in two positions',d:{'0':'Not attempted','1':'Mouth inaccurate','2':'One position correct','3':'Both present, minor errors','4':'Both positions accurate with shading'}},{name:'Ear Accuracy',desc:'Ear with inner structure drawn',d:{'0':'Not attempted','1':'Ear unrecognizable','2':'Basic shape, no inner detail','3':'Good shape, some inner detail','4':'Accurate with inner ridges and shading'}}]},
        {id:'ly-u19p3',tier:'TIER 1',name:'Loomis Head Drawing',pts:2,desc:'Use the Loomis method to construct a proportionally accurate head from a sphere, a plane cut, and a centerline.',materials:['Pencil','Blank paper','Loomis reference handout'],steps:['Draw a circle -- this is the cranial mass.','Slice off a flat plane on one side to create the cheekbone/jaw area.','Add a vertical centerline and horizontal brow line to establish the face direction.','Place the brow line, nose line (halfway between brow and chin), and mouth line (1/3 above chin).','Add eyes on the brow line -- one eye-width apart.','Add the nose, mouth, and ears using your measured lines.','Draw at least 2 heads: one front view, one 3/4 view.'],tip:'The eyes are at the MIDPOINT of the head -- not near the top. Measure before you place them.',rubric:[{name:'Loomis Construction',desc:'Sphere + plane method used correctly',d:{'0':'Not attempted','1':'Method not used','2':'Method attempted but inconsistent','3':'One head correct, one partial','4':'Both heads show clear Loomis construction'}},{name:'Proportions',desc:'Features placed at correct landmarks',d:{'0':'Not attempted','1':'Proportions significantly off','2':'Some features off','3':'Most features correct','4':'All features correctly proportioned'}},{name:'Two Views',desc:'Front and 3/4 view both present',d:{'0':'Not attempted','1':'Only one partial view','2':'One view complete','3':'Both present, one stronger','4':'Both views complete and accurate'}},{name:'Craftsmanship',desc:'Clean construction lines and finished drawing',d:{'0':'Not attempted','1':'Very rough','2':'Some roughness','3':'Mostly clean','4':'Clean and polished'}}]},
        {id:'ly-u19p4',tier:'QUIZ',name:'Loomis + Head Quiz',pts:2,desc:'Assess understanding of the Loomis method, facial proportions, and feature placement.',materials:['Pencil','Quiz handout'],steps:['Complete all written questions on the quiz.','Label the diagram sections with correct facial proportion landmarks.','Draw a small Loomis head from memory in the blank section.'],tip:'If you can draw a Loomis head from scratch without looking, you\'ll ace this.',rubric:[]},
        {id:'ly-u19p8',tier:'TIER 3',name:'The Selfie Project',pts:8,desc:'Create a fully realized self-portrait that communicates something true about your identity -- not just what you look like, but who you are.',materials:['Selfie reference photo (printed or on device)','Pencil, pen, or paint','Canvas board or heavy paper','Any additional media of your choice'],steps:['Take or choose a selfie that feels like YOU -- consider angle, expression, and setting.','Sketch the portrait using the Loomis method for accurate proportions.','Decide on your medium: pencil, paint, mixed media, collage, etc.','Incorporate at least one personal element beyond the face: background, objects, patterns, text.','Refine your value structure -- light source should be consistent.','Final piece should feel personal, not just technical.'],tip:'The best self-portraits tell you something about the person you couldn\'t learn from a photo.',rubric:[{name:'Likeness & Proportion',desc:'Recognizable self-portrait with accurate proportions',d:{'0':'Not attempted','1':'Barely recognizable','2':'Somewhat recognizable','3':'Recognizable, minor proportion errors','4':'Strong likeness, accurate proportions throughout'}},{name:'Personal Identity',desc:'Piece communicates something beyond appearance',d:{'0':'Not attempted','1':'No personal concept','2':'Minimal personal content','3':'Some personal element present','4':'Strong personal concept clearly expressed'}},{name:'Technical Skill',desc:'Medium used with control and intention',d:{'0':'Not attempted','1':'Struggling with medium','2':'Some control','3':'Good control, minor issues','4':'Skilled use of chosen medium'}},{name:'Value / Color',desc:'Light source consistent, full range',d:{'0':'Not attempted','1':'Mostly flat','2':'Some value present','3':'Good structure, minor gaps','4':'Strong value or color structure'}},{name:'Effort & Completion',desc:'Fully finished and polished',d:{'0':'Not submitted','1':'Barely started','2':'Partially complete','3':'Complete, some areas underdeveloped','4':'Complete and clearly invested in'}}]},
        {id:'ly-u19p10',tier:'TIER 3',name:'Master Study -- Jean-Michel Basquiat',pts:8,desc:'Study and recreate a work by Basquiat, focusing on his use of raw mark-making, text, symbols, and expressive portraiture.',materials:['Basquiat reference image (printed)','Acrylic paint or mixed media','Canvas board or heavy paper','Markers, oil pastel, or crayon for text and marks'],steps:['Research Jean-Michel Basquiat -- look at 10+ works. Note his use of text, crowns, crossed-out words, and raw line.','Choose one Basquiat portrait work to study.','Sketch the basic composition -- don\'t overthink it. Basquiat worked fast and raw.','Block in the main colors. Basquiat used bold, clashing color.','Add text, symbols, and mark layers on top of the paint.','Cross out words, add arrows, repeat shapes -- this is part of his visual language.','Don\'t over-refine. Rough edges and visible struggle are part of the style.'],tip:'Basquiat\'s work is about identity, history, and power. Your study should feel alive, not polished.',rubric:[{name:'Style Accuracy',desc:'Work reflects Basquiat\'s visual language'},{name:'Text & Symbol Use',desc:'Words and marks integrated into composition'},{name:'Color',desc:'Bold, expressive palette'},{name:'Raw Energy',desc:'Work feels alive and unpolished'},{name:'Effort & Research',desc:'Clearly studied the source work'}]},
      ]},
      { id:'ly-u20',num:20,title:'Body + Character Design',overview:'Figure drawing is the foundation of character design. This unit builds proportion and figure skills through the 8-head model, then applies them to original character work, costume design, and full production pieces. You\'ll start with structure and proportion, then push into invention -- designing original characters with consistent anatomy, personality, and style.',deadlines:{t1:'4/8/26',t2:'4/17/26',t3:'4/30/26'}, projects:[
        {id:'ly-u20p1',tier:'TIER 1',name:'8 Head Model Practice',pts:2,desc:'Use the 8-head proportion system to construct a full standing figure. Divide the figure into 8 equal head-height units and place landmarks at their correct positions. Complete at least 3 practice figures with visible guidelines.',materials:['8 Head Model worksheet','Pencil','Ruler'],steps:['Draw a vertical line and divide it into 8 equal units -- each unit = one head height.','Mark landmarks: Head (1), Chest (2), Navel (3), Crotch (4), Mid-thigh (5), Knee (6), Mid-shin (7), Feet (8).','Sketch the basic body form over your measurement guide.','Complete at least 3 practice figures -- keep the guidelines visible.','Check: arms reach mid-thigh, shoulders are 2 heads wide.'],tip:'The 8-head model is a guide, not a cage. Real bodies vary -- but knowing the standard lets you break it intentionally.',rubric:[{name:'Proportion Accuracy',desc:'8 head units used and visible'},{name:'Landmark Placement',desc:'Shoulders, hips, knees, feet at correct positions'},{name:'Three Figures',desc:'At least 3 practice figures complete'},{name:'Guidelines Visible',desc:'Construction lines kept, not erased'}]},
        {id:'ly-u20p2',tier:'TIER 1',name:'Body Parts Worksheet',pts:2,desc:'Isolated practice of the parts that trip people up most -- hands, feet, and torsos. Draw each section multiple times from reference, focusing on structure and form.',materials:['Body Parts worksheet or blank paper','Pencil','Reference images'],steps:['Section 1 -- Hands: Draw an open hand front view, then a fist. Focus on the knuckle structure and finger proportions.','Section 2 -- Feet: Draw a foot from the side, then from the front. Think of the foot as a wedge shape.','Section 3 -- Torso: Draw a front torso and a 3/4 torso. Block in the ribcage and pelvis as separate masses.','Add light shading to each to show form, not just outline.','Complete at least 2 drawings per section.'],tip:'Think of each body part as a 3D form, not a flat outline. Hands are boxes. Feet are wedges. The torso is two interlocking cylinders.',rubric:[{name:'Hands',desc:'Front and fist view attempted',d:{'0':'Not attempted','1':'Barely attempted','2':'One view complete','3':'Both present, minor errors','4':'Both accurate with structure evident'}},{name:'Feet',desc:'Side and front view attempted',d:{'0':'Not attempted','1':'Barely attempted','2':'One view complete','3':'Both present, minor errors','4':'Both accurate with wedge form evident'}},{name:'Torso',desc:'Front and 3/4 view attempted',d:{'0':'Not attempted','1':'Barely attempted','2':'One view complete','3':'Both present, minor errors','4':'Both show ribcage/pelvis as separate masses'}},{name:'Form vs Outline',desc:'Shading suggests 3D form',d:{'0':'Not attempted','1':'All flat outlines','2':'Some shading','3':'Most sections shaded','4':'All sections show clear 3D thinking'}}]},
        {id:'ly-u20p3',tier:'TIER 1',name:'Silhouette Lineup',pts:2,desc:'Design 5-6 character silhouettes that are instantly readable and visually distinct from one another using only solid black shapes -- no internal lines, no detail.',materials:['Pencil','Black marker','Paper'],steps:['Design 5-6 character concepts -- think about their role, size, and personality.','For each character, fill in a complete solid black silhouette -- no outlines, no detail inside.','Each silhouette must read clearly as a unique character at arm\'s length.','If you can\'t tell them apart as silhouettes, the design isn\'t working yet -- push it further.','Write the character\'s role or name beside each silhouette.'],tip:'Shape language is everything: round = friendly, angular = dangerous, wide = strong, thin = fast. Let the shape do the storytelling.',rubric:[{name:'Readability',desc:'Each silhouette reads clearly as a character',d:{'0':'Not attempted','1':'Hard to distinguish','2':'Some readable','3':'Most readable','4':'All 5-6 instantly readable'}},{name:'Variety',desc:'All silhouettes visually distinct',d:{'0':'Not attempted','1':'Very similar to each other','2':'Some similarities','3':'Mostly distinct','4':'Immediately distinguishable from each other'}},{name:'Completion',desc:'5-6 silhouettes present',d:{'0':'Not attempted','1':'1-2 silhouettes','2':'3 silhouettes','3':'4 silhouettes','4':'5-6 solid silhouettes'}}]},
        {id:'ly-u20pq',tier:'QUIZ',name:'Body Comp Quiz',pts:2,desc:'Assess understanding of the 8-head proportion model, figure landmark placement, and character design vocabulary. Includes identification, short answer, and a timed proportion sketch.',materials:['Pencil','Quiz handout'],steps:['Label the 8 landmark positions on a provided figure diagram.','Answer short written questions about proportion and figure structure.','Answer vocabulary identification questions on character design terms.','Draw a quick 8-head proportion guide from memory in the blank section.'],tip:'If you can place all 8 landmarks without looking and sketch a full figure in under 5 minutes, you\'ll ace this.',rubric:[]},
        {id:'ly-u20p4',tier:'TIER 2',name:'Original Character Design',pts:3,desc:'Design an original character from scratch. Start with a silhouette, then develop proportion, costume, and personality details. Your final sheet should include a front-facing figure built on the 8-head model, at least one detailed close-up, and a short written description.',materials:['Pencil','Pen or fine liner','Colored pencils or markers','Drawing paper'],steps:['Start with a silhouette -- design the shape before the details.','Build the full front-facing figure using the 8-head proportion guide.','Add costume and accessories that tell us who this character is.','Draw at least one detailed close-up: face, hands, or a signature item.','Write 2-3 sentences describing who this character is: name, role, personality.','Ink and color your final character.'],tip:'The best character designs are readable as a silhouette alone. Design outside-in.',rubric:[{name:'Silhouette First',desc:'Character reads as clear shape',d:{'0':'Not attempted','1':'Unclear shape','2':'Somewhat readable','3':'Mostly readable','4':'Immediately readable silhouette'}},{name:'8-Head Proportion',desc:'Full figure on correct proportions',d:{'0':'Not attempted','1':'Proportion not used','2':'Some errors','3':'Mostly correct','4':'Accurate 8-head construction visible'}},{name:'Close-up Detail',desc:'At least one detailed element',d:{'0':'Not attempted','1':'Minimal','2':'Some detail','3':'Good detail','4':'Rich, clearly rendered detail'}},{name:'Written Description',desc:'Character identity described',d:{'0':'Not attempted','1':'Barely written','2':'Partial description','3':'Most info present','4':'Name, role, and personality clearly written'}}]},
        {id:'ly-u20p5',tier:'TIER 2',name:'Character in 4 Styles',pts:3,desc:'Take one character -- yours or a provided one -- and redraw it in 4 distinct cartoon or comic styles. Each version should feel authentically like that style, not just a slight tweak.',materials:['Pencil','Pen or fine liner','Colored pencils or markers','Drawing paper'],steps:['Choose a character to use -- your Original Character Design works great here.','Choose 4 distinct styles: e.g. Disney, anime, Looney Tunes, superhero comic, chibi, noir.','Research each style before you draw -- look at 5+ examples per style.','Redraw the character in each style. Push the style hard -- subtle tweaks don\'t count.','Label each version with its style name.'],tip:'Ask yourself what actually DEFINES each style -- line weight, head size, eye shape, body proportion. Then exaggerate those things.',rubric:[{name:'Style Authenticity',desc:'Each version reads as that specific style',d:{'0':'Not attempted','1':'Versions are too similar','2':'Some styles clear','3':'Most styles clear','4':'All 4 styles immediately recognizable'}},{name:'Variety',desc:'4 styles are genuinely different',d:{'0':'Not attempted','1':'Very similar','2':'Some variation','3':'Mostly different','4':'Dramatically different from each other'}},{name:'Character Consistency',desc:'Same character across all 4 styles',d:{'0':'Not attempted','1':'Hard to tell it\'s the same character','2':'Somewhat consistent','3':'Mostly consistent','4':'Clearly the same character throughout'}}]},
        {id:'ly-u20p6',tier:'TIER 2',name:'Costume Design Variants',pts:3,desc:'Take a single character body and design 3 completely different outfits that each tell a different story about who that character is.',materials:['Pencil','Pen or fine liner','Colored pencils or markers','Drawing paper'],steps:['Draw the same character body pose 3 times -- you can trace or lightly block in the same figure.','Design 3 completely different outfits that each communicate a different personality or context.','Each costume should make the character feel like a completely different person.','Ink and add flat color to each variant.','Label each variant with the personality or role it communicates.'],tip:'Same body, totally different personality. The costume is doing the characterization work here.',rubric:[{name:'Costume Variety',desc:'3 outfits read as distinctly different',d:{'0':'Not attempted','1':'Too similar','2':'Some difference','3':'Mostly different','4':'Dramatically different -- each a distinct personality'}},{name:'Storytelling',desc:'Each costume communicates something specific',d:{'0':'Not attempted','1':'Not communicating much','2':'Some do','3':'Most do','4':'Each costume immediately communicates a role or personality'}},{name:'Completion',desc:'All 3 inked and colored',d:{'0':'Not attempted','1':'1 complete','2':'2 complete','3':'2 complete, 1 partial','4':'All 3 fully inked and colored'}}]},
        {id:'ly-u20p7',tier:'TIER 3',name:'Comic Strip',pts:8,desc:'Create a multi-panel comic strip (minimum 4 panels) featuring your original character. Figures must demonstrate consistent proportions across panels, dynamic poses, and clear storytelling through composition and expression.',materials:['Pencil','Pen or fine liner','Ruler','Markers or ink','Comic strip paper or heavy paper divided into panels'],steps:['Plan your story first -- write a 1-sentence summary: who, what, where, and why it matters.','Thumbnail all panels in tiny sketches before drawing full size.','Each panel should have a clear purpose -- establish, action, reaction, resolution.','Vary your panel sizes -- close-ups for emotion, wide shots for action.','Draw figures using the 8-head model.','Add speech bubbles and captions.','Ink all panels. Add color or value to finish.'],tip:'Comics are about what you leave OUT as much as what you include. Every panel earns its place.',rubric:[{name:'Visual Storytelling',desc:'Story is clear without needing explanation'},{name:'Panel Composition',desc:'Varied panel sizes and camera angles'},{name:'Figure Drawing',desc:'Consistent proportions across panels, dynamic poses'},{name:'Lettering & Dialogue',desc:'Text is legible and placed well'},{name:'Completion',desc:'4+ panels fully inked and finished'}]},
        {id:'ly-u20p8',tier:'TIER 3',name:'Emotional Figure Painting',pts:8,desc:'Pick an emotion, a mood, or a moment -- something you\'ve actually felt. Use the body as your subject but let go of accuracy. Exaggerate the pose, push the color, let the paint be messy if it needs to be. The goal isn\'t a perfect figure -- it\'s a painting that actually feels like something.',materials:['Paint (acrylic, watercolor, or oil pastel)','Canvas board or heavy paper','Brushes','Any additional mixed media'],steps:['Choose your emotion or moment. Be specific -- not "sad" but "the feeling after a bad day when you\'re sitting in your car."','Find or create a reference pose that physically embodies that feeling.','Sketch loosely -- don\'t be precious about accuracy.','Exaggerate: make the pose more extreme, the colors more intense, the marks more expressive.','Let the medium be part of the expression -- drips, texture, and mess can be intentional.','Ask yourself: does this actually FEEL like something when you look at it?'],tip:'This is the only project in this unit where accuracy doesn\'t matter. Expression does.',rubric:[{name:'Emotional Communication',desc:'Painting conveys a specific feeling',d:{'0':'Not attempted','1':'Feels generic or flat','2':'Some emotional content','3':'Feeling is readable','4':'Viewer can feel it without being told what it is'}},{name:'Expressive Use of Medium',desc:'Paint, marks, or color used expressively',d:{'0':'Not attempted','1':'Flat and even throughout','2':'Some expressive choices','3':'Mostly expressive','4':'Medium actively contributes to the emotion'}},{name:'Pose/Body Language',desc:'Figure communicates through its physicality',d:{'0':'Not attempted','1':'Generic or static pose','2':'Some intentional body language','3':'Mostly communicates through pose','4':'Body language is the main storyteller'}},{name:'Completion',desc:'Fully realized painting',d:{'0':'Not submitted','1':'Barely started','2':'Partially realized','3':'Mostly complete','4':'Complete, fully painted, feels resolved'}}]},
        {id:'ly-u20p12',tier:'TIER 3',name:'Master Study -- Jack Kirby',pts:8,desc:'Study and recreate a panel or figure from Jack Kirby\'s work, focusing on his dynamic figure construction, exaggerated proportions, and use of geometric form. Follow with your own figure in Kirby\'s style.',materials:['Kirby reference panel (printed)','Pencil','Pen or fine liner','Markers or ink','Drawing paper'],steps:['Research Jack Kirby -- look at Fantastic Four, New Gods, Captain America. Study 10+ panels.','Choose one full panel or figure to recreate exactly.','Lightly sketch the composition -- note the exaggerated foreshortening and massive geometric forms.','Look for the "Kirby Krackle" -- the pattern of black dots he uses to show energy and cosmic power.','Ink with bold, confident lines. Vary your line weight heavily.','Add spot black aggressively -- Kirby used heavy shadow for drama.','Design your own original character or scene in Kirby\'s style.','Write 2-3 sentences: what makes Kirby\'s figures feel so powerful?'],tip:'Kirby drew like the figures were about to explode off the page. Every muscle is a geometric form. Don\'t be timid.',rubric:[{name:'Study Accuracy',desc:'Recreated panel matches Kirby\'s original',d:{'0':'Not attempted','1':'Loosely based','2':'Partial match','3':'Good match, some differences','4':'Strong match -- energy, proportion, and black placement'}},{name:'Kirby Style Mastery',desc:'Geometric forms, exaggeration, Krackle',d:{'0':'Not attempted','1':'Minimal style elements','2':'Some elements','3':'Most elements present','4':'All key elements present and confident'}},{name:'Original Kirby-Style Piece',desc:'Student-created piece in Kirby\'s style',d:{'0':'Not attempted','1':'Barely started','2':'Some style elements','3':'Mostly in style','4':'Convincingly Kirby-style and original'}},{name:'Written Reflection',desc:'Analysis of what makes the panel work',d:{'0':'Not attempted','1':'Very vague','2':'Basic reflection','3':'Good reflection','4':'Thoughtful and specific'}}]},
      ]},
    ]
  },
  // Old Drafts: the polished Unit 1 Ramhaus had before the Unit Guides plan (same shape migrateToV3 builds).
  {
    id:'old-drafts',label:'Old Drafts',color:'#95A5A6',archived:true,
    units:[
      { id:'old-ru-pencil',num:1,title:'Pencil (Ramhaus draft)',overview:'Value + shading fundamentals, primitive forms, and one-point perspective. The foundation unit -- every other medium builds on the value and form skills here.', projects:[
        {id:'old-ru-pencil-u1p1',tier:'TIER 1',name:'Value Scales',pts:2,desc:'Build controlled gradients from light to dark. 5-9 step value scales.',materials:['Graphite pencil','Value scale worksheet','Eraser'],steps:['Draw a row of equal boxes.','Leave the first box white (lightest).','Make the last box as dark as your pencil goes.','Fill the middle boxes with even steps between.','Blend each box smooth -- no visible lines.','Repeat with a smooth continuous gradient strip.'],tip:'Press lighter than you think for the light end. You can always go darker, not lighter.',rubric:[{name:'Even Steps',desc:'Each value is distinct',d:{'0':'Not attempted','1':'Uneven','2':'Some jumps','3':'Mostly even','4':'Smooth, even progression'}},{name:'Full Range',desc:'Light to dark',d:{'0':'Not attempted','1':'Narrow','2':'Limited','3':'Good range','4':'True white to near-black'}},{name:'Blending',desc:'Smooth fills',d:{'0':'Not attempted','1':'Rough','2':'Some texture','3':'Mostly smooth','4':'No visible lines'}},{name:'Completion',desc:'All boxes + gradient',d:{'0':'Not submitted','1':'Started','2':'Half','3':'Most done','4':'All done'}}]},
        {id:'old-ru-pencil-u1p2',tier:'TIER 1',name:'Hatching & Crosshatching',pts:2,desc:'Build value with line -- direction, spacing, and density.',materials:['Graphite pencil or pen','Worksheet'],steps:['Practice parallel hatching lines, evenly spaced.','Vary spacing to create lighter and darker areas.','Add a second layer at an angle (crosshatching).','Build 3+ layers for the darkest values.','Apply to a simple shape to show form.'],tip:'Keep your lines confident and consistent. Speed helps -- draw from the wrist.',rubric:[{name:'Line Control',desc:'Even, confident lines',d:{'0':'Not attempted','1':'Uncontrolled','2':'Some wobble','3':'Mostly even','4':'Very controlled'}},{name:'Value via Density',desc:'Spacing creates value',d:{'0':'Not attempted','1':'Flat','2':'Some','3':'Good','4':'Clear range'}},{name:'Completion',desc:'All sections',d:{'0':'Not submitted','1':'Started','2':'Half','3':'Most','4':'Complete'}}]},
        {id:'old-ru-pencil-u1p3',tier:'TIER 1',name:'Blending',pts:2,desc:'Smooth gradients using stumps and controlled pressure.',materials:['Graphite pencil','Blending stump or tissue','Paper'],steps:['Lay down graphite in a small area.','Blend with a stump in one direction.','Practice a smooth dark-to-light transition.','Try blending on a sphere shape.'],tip:'Blend in the direction the form turns. A sphere blends in curves, not straight lines.',rubric:[{name:'Smoothness',desc:'No harsh edges',d:{'0':'Not attempted','1':'Rough','2':'Some','3':'Mostly','4':'Very smooth'}},{name:'Control',desc:'Intentional transitions',d:{'0':'Not attempted','1':'Muddy','2':'Some','3':'Good','4':'Full control'}}]},
        {id:'old-ru-pencil-u1p4',tier:'TIER 1',name:'Contour Line',pts:2,desc:'Blind + continuous contour. Training the eye to see edges.',materials:['Pencil','Paper','An object to observe'],steps:['Pick a subject (your hand, a shoe, a plant).','BLIND contour: draw without looking at paper. Go slow.','CONTINUOUS contour: one unbroken line, you can look.','Focus on edges and how they connect.','Do not erase -- commit to the line.'],tip:'The point is SEEING, not a pretty result. Wonky is expected and good.',rubric:[{name:'Observation',desc:'Line follows real edges',d:{'0':'Not attempted','1':'Rushed','2':'Some','3':'Good','4':'Careful seeing'}},{name:'Line Quality',desc:'Confident continuous line',d:{'0':'Not attempted','1':'Scratchy','2':'Broken','3':'Good','4':'Strong'}},{name:'Effort',desc:'Took it seriously',d:{'0':'Not submitted','1':'Minimal','2':'Some','3':'Mostly','4':'Clearly'}}]},
        {id:'old-ru-pencil-u1p5',tier:'QUIZ',name:'Value & Shading Quiz',pts:2,desc:'Vocab check: value, hatching, contour, gradient, light source.',materials:['Pencil','Quiz handout'],steps:['Complete all questions.','Label the value scale and shading examples.','Turn in when done.'],tip:'Review your value scale and contour worksheets first.',rubric:[]},
        {id:'old-ru-pencil-u1p6',tier:'TIER 2',name:'The Four Primitives',pts:3,desc:'Sphere, cylinder, cube, cone with one light source and all value zones.',materials:['Graphite pencil','Blending stump','Worksheet or paper'],steps:['Draw the four primitive forms.','Pick one light source (upper left).','Apply all 5 zones: highlight, midtone, core shadow, reflected light, cast shadow.','Blend transitions smooth.','Each form should read clearly as 3D.'],tip:'Reflected light = a slightly lighter band on the shadow edge, from light bouncing off the surface.',rubric:[{name:'5 Value Zones',desc:'All zones present',d:{'0':'Not attempted','1':'Flat','2':'Some','3':'Most','4':'All on every form'}},{name:'Light Source',desc:'Consistent direction',d:{'0':'Not attempted','1':'Inconsistent','2':'Some errors','3':'Mostly','4':'Perfect'}},{name:'3D Illusion',desc:'Forms read as solid',d:{'0':'Not attempted','1':'Flat','2':'Some','3':'Good','4':'Convincing'}},{name:'Blending',desc:'Smooth transitions',d:{'0':'Not attempted','1':'Rough','2':'Some','3':'Mostly','4':'Very smooth'}}]},
        {id:'old-ru-pencil-u1p7',tier:'TIER 2',name:'Forms in Combination',pts:3,desc:'Combine primitives into a simple object (mug, lamp, robot). The bridge to putting objects in a room.',materials:['Graphite pencil','Paper','Blending stump'],steps:['Choose or invent an object built from primitives.','Block in the basic forms lightly.','Establish one consistent light source.','Shade each form with the 5 value zones.','Add a cast shadow to ground it.'],tip:'Break any object into boxes, cylinders, and spheres first. Detail comes last.',rubric:[{name:'Form Construction',desc:'Built from primitives',d:{'0':'Not attempted','1':'Unclear','2':'Some','3':'Good','4':'Clear structure'}},{name:'Value',desc:'Consistent shading',d:{'0':'Not attempted','1':'Flat','2':'Some','3':'Good','4':'Strong'}},{name:'Craftsmanship',desc:'Clean and controlled',d:{'0':'Not attempted','1':'Messy','2':'Rough','3':'Mostly','4':'Polished'}}]},
        {id:'old-ru-pencil-u1p8',tier:'TIER 3',name:'One-Point Perspective Room',pts:8,desc:'Draw a simple room in one-point perspective. Place objects built from the primitives inside it. Apply value with a consistent light source.',materials:['Graphite pencil','Ruler','Eraser','Drawing paper'],steps:['Draw a horizon line and one vanishing point (VP).','Draw the back wall as a rectangle.','Draw orthogonal lines from each corner to the VP.','Establish floor, ceiling, and side walls.','Add furniture as boxes + primitives receding to the VP.','Erase construction lines and refine.','Shade everything with one consistent light source.'],tip:'Everything in the room -- furniture, windows, doors -- sends its depth lines to the SAME vanishing point.',rubric:[{name:'Perspective Accuracy',desc:'Lines converge to VP',d:{'0':'Not attempted','1':'Off','2':'Some errors','3':'Mostly','4':'Perfect convergence'}},{name:'Form / Value',desc:'Objects read as 3D',d:{'0':'Not attempted','1':'Flat','2':'Some','3':'Good','4':'Strong'}},{name:'Craftsmanship',desc:'Clean, construction lines erased',d:{'0':'Not attempted','1':'Messy','2':'Some stray','3':'Mostly','4':'Polished'}},{name:'Completion',desc:'Fully realized room',d:{'0':'Not submitted','1':'Started','2':'Partial','3':'Most','4':'Complete'}}]},
        {id:'old-ru-pencil-u1p9',tier:'TIER 3',name:'Master Value Study (3-4 track)',pts:8,desc:'ADVANCED: recreate a section of a master drawing, matching value structure, then apply the same lighting to an original subject.',materials:['Graphite pencil range (2H-6B)','Master drawing reference','Drawing paper','Blending stump'],steps:['Choose a master drawing with strong value (Kollwitz, Bargue).','Grid or carefully observe the value structure.','Recreate a section, matching values as closely as possible.','Then set up your own subject with similar lighting.','Draw the original applying what you learned.'],tip:'You are studying how a master SEES value, not just copying. Notice their choices.',rubric:[{name:'Value Accuracy',desc:'Matches the master',d:{'0':'Not attempted','1':'Off','2':'Approximate','3':'Close','4':'Very accurate'}},{name:'Technique',desc:'Advanced control',d:{'0':'Not attempted','1':'Struggling','2':'Developing','3':'Good','4':'Skilled'}},{name:'Original Application',desc:'Applied to own work',d:{'0':'Not attempted','1':'Weak','2':'Some','3':'Good','4':'Strong transfer'}},{name:'Craftsmanship',desc:'Clean and complete',d:{'0':'Not submitted','1':'Incomplete','2':'Rough','3':'Mostly','4':'Polished'}}]},

// curriculum state
var currCourseId = 'draw1';
var currUnitId   = 'u1';
var currProjId   = null;



function initCurriculumSidebarControls(wrap) {
  var left = document.getElementById('curr-left');
  var detail = document.getElementById('curr-detail');
  var leftHandle = document.getElementById('curr-left-resize');
  var detailHandle = document.getElementById('curr-detail-resize');
  var leftCollapse = document.getElementById('curr-left-collapse');
  var detailCollapse = document.getElementById('curr-detail-collapse');
  if (!wrap || !left || !detail || !leftHandle || !detailHandle || !leftCollapse || !detailCollapse) return;
  if (!S.ui) S.ui = {};

  function applyCurriculumLayout() {
    var mobile = window.innerWidth <= 900;
    if (mobile) {
      left.classList.remove('collapsed');
      detail.classList.remove('collapsed');
      left.style.width = '';
      detail.style.width = '';
      leftCollapse.style.display = 'none';
      detailCollapse.style.display = 'none';
      return;
    }

    left.style.width = clamp(S.ui.currLeftWidth || 230, 180, 420) + 'px';
    detail.style.width = clamp(S.ui.currDetailWidth || 400, 280, 620) + 'px';
    left.classList.toggle('collapsed', !!S.ui.currLeftCollapsed);
    detail.classList.toggle('collapsed', !!S.ui.currDetailCollapsed);

    leftCollapse.style.display = 'flex';
    detailCollapse.style.display = 'flex';
    leftCollapse.textContent = S.ui.currLeftCollapsed ? '>' : '◀';
    leftCollapse.title = S.ui.currLeftCollapsed ? 'Expand curriculum sidebar' : 'Collapse curriculum sidebar';
    leftCollapse.style.right = S.ui.currLeftCollapsed ? '-28px' : '8px';
    detailCollapse.textContent = S.ui.currDetailCollapsed ? '◀' : '>';
    detailCollapse.title = S.ui.currDetailCollapsed ? 'Expand project detail sidebar' : 'Collapse project detail sidebar';
    detailCollapse.style.left = S.ui.currDetailCollapsed ? '-28px' : '8px';
  }

  leftCollapse.onclick = function() {
    if (window.innerWidth <= 900) return;
    S.ui.currLeftCollapsed = !S.ui.currLeftCollapsed;
    save();
    applyCurriculumLayout();
  };

  detailCollapse.onclick = function() {
    if (window.innerWidth <= 900) return;
    S.ui.currDetailCollapsed = !S.ui.currDetailCollapsed;
    save();
    applyCurriculumLayout();
  };

  function startCurrResize(which, e) {
    if (window.innerWidth <= 900) return;
    e.preventDefault();
    wrap.classList.add('dragging-curr-sidebars');
    var handle = which === 'left' ? leftHandle : detailHandle;
    handle.classList.add('dragging');

    function move(ev) {
      var rect = wrap.getBoundingClientRect();
      if (which === 'left') {
        S.ui.currLeftCollapsed = false;
        S.ui.currLeftWidth = clamp(ev.clientX - rect.left, 180, 420);
      } else {
        S.ui.currDetailCollapsed = false;
        S.ui.currDetailWidth = clamp(rect.right - ev.clientX, 280, 620);
      }
      applyCurriculumLayout();
    }

    function up() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      wrap.classList.remove('dragging-curr-sidebars');
      handle.classList.remove('dragging');
      save();
    }

    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  leftHandle.onmousedown = function(e) { startCurrResize('left', e); };
  detailHandle.onmousedown = function(e) { startCurrResize('right', e); };
  applyCurriculumLayout();
}

function renderCurriculum(cv) {
  cv.style.cssText='padding:0;overflow:hidden;display:flex;flex-direction:column;flex:1';

  var curriculum = S.curriculum || CURRICULUM;
  var editMode = !!S.currEditMode;

  function saveCurr(){ save(); }
  function getCourse(){ return curriculum.find(function(c){return c.id===currCourseId;}); }
  function getUnit(course){ return (course&&course.units||[]).find(function(u){return u.id===currUnitId;}); }
  function getProj(unit){ return (unit&&unit.projects||[]).find(function(p){return p.id===currProjId;}); }

  function makeProjectTemplate(tier, sourceProj){
    var template = sourceProj ? dc(sourceProj) : {
      tier:tier,
      name:'New Project',
      pts:(CURR_TIER_PTS[tier]===undefined?2:CURR_TIER_PTS[tier]),
      desc:'',
      materials:[''],
      steps:[''],
      tip:'',
      rubric:[{name:'Category',desc:'',d:{4:'',3:'',2:'',1:'',0:''}}]
    };
    template.id = 'u'+Date.now()+Math.random().toString(36).slice(2,6);
    template.tier = tier;
    delete template.suggested;
    template.name = sourceProj && sourceProj.name ? sourceProj.name+' Copy' : 'New Project';
    template.materials = Array.isArray(template.materials) ? template.materials.slice() : [''];
    template.steps = Array.isArray(template.steps) ? template.steps.slice() : [''];
    template.rubric = Array.isArray(template.rubric) ? dc(template.rubric) : [{name:'Category',desc:'',d:{4:'',3:'',2:'',1:'',0:''}}];
    return template;
  }

  function addProjectToTier(unitObj, tier){
    if (!unitObj.projects) unitObj.projects = [];
    var source = null;
    (unitObj.projects||[]).forEach(function(p){ if (!source && p.tier===tier) source = p; });
    if (!source && unitObj.projects.length) source = unitObj.projects[0];
    var proj = makeProjectTemplate(tier, source);
    unitObj.projects.push(proj);
    currProjId = proj.id;
    saveCurr();
    renderCanvas();
  }

  function addUnitToCourse(courseObj){
    if (!courseObj.units) courseObj.units = [];
    var maxNum = 0;
    courseObj.units.forEach(function(u){ maxNum = Math.max(maxNum, parseInt(u.num,10)||0); });
    var newUnit = {
      id:'u'+Date.now(),
      num:maxNum+1,
      title:'New Unit',
      overview:'',
      deadlines:{t1:'',t2:'',t3:''},
      projects:[makeProjectTemplate('TIER 1')]
    };
    courseObj.units.push(newUnit);
    currUnitId = newUnit.id;
    currProjId = newUnit.projects[0].id;
    saveCurr();
    renderCanvas();
  }

  function fieldWrap(labelText){
    var wrap = el('div','');

    } else {

function buildEditor(placeholder, htmlContent, onSave) {
  var wrap = el('div','editor-wrap');

  // Toolbar
  var tb = el('div','editor-toolbar');

  // Font size
  var sizeSelect = el('select','tb-select');
  sizeSelect.title = 'Font size';
  [['1','Small'],['3','Normal'],['4','Large'],['5','X-Large'],['6','Huge']].forEach(function(o) {
    var opt = document.createElement('option');
    opt.value = o[0]; opt.textContent = o[1];
    if (o[0]==='3') opt.selected = true;
    sizeSelect.appendChild(opt);
  });
  sizeSelect.onchange = function() {
    document.execCommand('fontSize', false, sizeSelect.value);
    body.focus();
  };
  tb.appendChild(sizeSelect);

  var sep0 = el('div','tb-sep'); tb.appendChild(sep0);

  // Format buttons
  function tbBtn(label, cmd, val, title) {
    var btn = el('button','tb-btn');
    btn.innerHTML = label; btn.title = title || cmd;
    btn.onmousedown = function(e) {
      e.preventDefault();
      document.execCommand(cmd, false, val || null);
      body.focus();
      updateToolbarState();
    };
    tb.appendChild(btn);
    return btn;
  }

  var bBtn = tbBtn('<b>B</b>',   'bold',          null, 'Bold');
  var iBtn = tbBtn('<i>I</i>',   'italic',        null, 'Italic');
  var uBtn = tbBtn('<u>U</u>',   'underline',     null, 'Underline');
  var sBtn = tbBtn('<s>S</s>',   'strikeThrough', null, 'Strikethrough');

  var sep1 = el('div','tb-sep'); tb.appendChild(sep1);

  tbBtn('H1', 'formatBlock', 'h2', 'Heading 1');
  tbBtn('H2', 'formatBlock', 'h3', 'Heading 2');
  tbBtn('¶',  'formatBlock', 'p',  'Paragraph');

  var sep2 = el('div','tb-sep'); tb.appendChild(sep2);

  // Bullet list -- works on selection too
  var ulBtn = el('button','tb-btn'); ulBtn.textContent='• List'; ulBtn.title='Convert selection to bullet list';
  ulBtn.onmousedown = function(e) {
    e.preventDefault();
    var sel = window.getSelection();
    var selText = sel ? sel.toString().trim() : '';
    if (selText && selText.indexOf('\n') !== -1) {
      var lines = selText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
      var html = '<ul>' + lines.map(function(l){return '<li>'+l+'</li>';}).join('') + '</ul>';
      document.execCommand('insertHTML', false, html);
    } else {
      document.execCommand('insertUnorderedList', false, null);
    }
    body.focus(); updateToolbarState();
  };
  tb.appendChild(ulBtn);
  tbBtn('1. List', 'insertOrderedList', null, 'Numbered list');

  var sep3 = el('div','tb-sep'); tb.appendChild(sep3);

  // Checkbox
  var cbBtn = el('button','tb-btn');
  cbBtn.textContent = '☑ Check'; cbBtn.title = 'Convert selection to checkboxes (or insert one)';
  cbBtn.onmousedown = function(e) {
    e.preventDefault();
    var sel = window.getSelection();
    var selText = sel ? sel.toString().trim() : '';
    if (selText) {
      // Convert each selected line into a checkbox
      var lines = selText.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
      var html = lines.map(function(line) {
        var uid = 'cb' + Date.now() + Math.random().toString(36).slice(2,5);
        // No "for" attr on label -- clicking text places cursor, only checkbox itself toggles
        return '<div><input type="checkbox" id="'+uid+'"><label> '+line+'</label></div>';
      }).join('');
      document.execCommand('insertHTML', false, html);
    } else {
      var uid = 'cb' + Date.now();
      document.execCommand('insertHTML', false,
        '<div><input type="checkbox" id="'+uid+'"><label> &nbsp;</label></div>'
      );
    }
    body.focus();
  };
  tb.appendChild(cbBtn);

  // Table
  var tblBtn = el('button','tb-btn');
  tblBtn.textContent = '⊞ Table'; tblBtn.title = 'Insert table';
  tblBtn.onmousedown = function(e) {
    e.preventDefault();
    var rows = parseInt(prompt('Rows?', '3') || '3', 10);
    var cols = parseInt(prompt('Columns?', '3') || '3', 10);
    if (isNaN(rows)||rows<1) rows=3;
    if (isNaN(cols)||cols<1) cols=3;
    var html = '<table>';
    // Header row
    html += '<tr>';
    for (var c=0;c<cols;c++) html += '<th>Header</th>';
    html += '</tr>';
    for (var r=0;r<rows-1;r++) {
      html += '<tr>';
      for (var cc=0;cc<cols;cc++) html += '<td>&nbsp;</td>';
      html += '</tr>';
    }
    html += '</table><p><br></p>';
    document.execCommand('insertHTML', false, html);
    body.focus();
  };
  tb.appendChild(tblBtn);

  var sep4 = el('div','tb-sep'); tb.appendChild(sep4);

  tbBtn('❝ Quote', 'formatBlock', 'blockquote', 'Block quote');
  tbBtn('-- Line',  'insertHorizontalRule', null, 'Horizontal rule');

  var sep5 = el('div','tb-sep'); tb.appendChild(sep5);

  // Align
  tbBtn('⬛L', 'justifyLeft',   null, 'Align left');
  tbBtn('⬛C', 'justifyCenter', null, 'Center');

  var sep6 = el('div','tb-sep'); tb.appendChild(sep6);

  tbBtn('↩ Undo', 'undo', null, 'Undo');
  tbBtn('↪ Redo', 'redo', null, 'Redo');

  // Body
  var body = el('div','editor-body');
  body.contentEditable = 'true';
  body.setAttribute('data-placeholder', placeholder || 'Start writing...');
  if (htmlContent) body.innerHTML = htmlContent;

  // Save on input
  body.oninput = function() {
    if (onSave) onSave(body.innerHTML);
  };

  // Fix: clicking label text in a checkbox row should place cursor, not toggle checkbox.
  // We intercept clicks on labels that have a `for` attribute and only allow the toggle
  // if the click target was the label's own element (not text inside it).
  body.addEventListener('click', function(e) {
    var t = e.target;
    if (t && t.tagName === 'LABEL' && t.htmlFor) {
      // Remove the for link so the browser doesn't auto-toggle the checkbox.
      // The checkbox itself still toggles on direct click.
      t.removeAttribute('for');
    }
  }, true); // capture phase so we intercept before browser default

  // Update toolbar bold/italic state on selection change
  function updateToolbarState() {
    bBtn.classList.toggle('on', document.queryCommandState('bold'));
    iBtn.classList.toggle('on', document.queryCommandState('italic'));
    uBtn.classList.toggle('on', document.queryCommandState('underline'));
    sBtn.classList.toggle('on', document.queryCommandState('strikeThrough'));
  }
  body.addEventListener('keyup', updateToolbarState);
  body.addEventListener('mouseup', updateToolbarState);
  body.addEventListener('keydown', function(e) {
    // Find if cursor is inside a checkbox row
    function getCheckboxRow() {
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount) return null;
      var node = sel.getRangeAt(0).startContainer;
      while (node && node !== body) {
        if (node.nodeType === 1 && node.tagName === 'DIV') {
          var cb = node.querySelector('input[type=checkbox]');
          if (cb) return node;
        }
        node = node.parentNode;
      }
      return null;
    }

    if (e.key === 'Enter') {
      var row = getCheckboxRow();
      if (row) {
        e.preventDefault();
        // Get current indent
        var currentPad = parseInt(row.style.paddingLeft) || 0;
        var uid = 'cb' + Date.now();
        var newRow = document.createElement('div');
        newRow.style.paddingLeft = currentPad ? currentPad + 'px' : '';
        newRow.innerHTML = '<input type="checkbox" id="' + uid + '"><label for="' + uid + '"> \u00a0</label>';
        row.parentNode.insertBefore(newRow, row.nextSibling);
        // Place cursor in new row's label
        var label = newRow.querySelector('label');
        var range = document.createRange();
        var sel2 = window.getSelection();
        range.setStart(label, label.childNodes.length);
        range.collapse(true);
        sel2.removeAllRanges();
        sel2.addRange(range);
        return;
      }
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      var row = getCheckboxRow();
      if (row) {
        // Indent/outdent the checkbox row
        var cur = parseInt(row.style.paddingLeft) || 0;
        var next = e.shiftKey ? Math.max(0, cur - 24) : cur + 24;
        row.style.paddingLeft = next > 0 ? next + 'px' : '';
      } else {
        document.execCommand('insertHTML', false, e.shiftKey ? '' : '\u00a0\u00a0\u00a0\u00a0');
      }
    }
  });

  wrap.appendChild(tb);
  wrap.appendChild(body);
  return {wrap: wrap, body: body};
}

// Helper: convert plain text to basic HTML (preserve newlines)
function textToHtml(txt) {
  if (!txt) return '';
  // If it already looks like HTML, return as-is
  if (txt.indexOf('<') !== -1) return txt;

  var esc = function(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
  var lines = txt.split('\n');
  var out = [];

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();

    // Blank line -> spacer
    if (!trimmed) { out.push('<p><br></p>'); continue; }

    // Heavy divider (=== or ═══) -> bold rule
    if (/^[=═]{3,}$/.test(trimmed)) {
      out.push('<hr style="border:none;border-top:2px solid var(--gold);margin:14px 0">');
      continue;
    }
    // Light divider (--- or ─── or ...) -> subtle rule
    if (/^[-─]{3,}$/.test(trimmed)) {
      out.push('<hr style="border:none;border-top:1px solid var(--br);margin:10px 0">');
      continue;
    }

    // Measure leading indent (for nesting)
    var indent = line.length - line.replace(/^\s+/, '').length;
    var pad = indent > 0 ? 'padding-left:' + (indent * 7) + 'px;' : '';

    var letters = trimmed.replace(/[^A-Za-z]/g, '');
    var isCaps = letters.length >= 3 && letters === letters.toUpperCase();
    var endsColon = /[:：]\s*$/.test(trimmed);

    // LEVEL 1 -- big title: ALL CAPS, no trailing colon, not indented
    // (e.g. "UNIT 1: PENCIL", "PROJECT OVERVIEW", "1) WORK FLOW")
    if (isCaps && !endsColon && indent === 0) {
      out.push('<p style="font-size:1.2rem;font-weight:700;color:var(--text);margin:14px 0 5px;letter-spacing:.6px">' + esc(trimmed) + '</p>');
      continue;
    }

    // LEVEL 2 -- section sub-head: ALL CAPS ending in colon, low indent
    // (e.g. "CORE SKILLS:", "BRIEF:", "MATERIALS:", "TWO TRACKS:")
    if (isCaps && endsColon && indent <= 2) {
      out.push('<p style="' + pad + 'font-size:.95rem;font-weight:700;color:var(--gold);margin:10px 0 2px;letter-spacing:.3px">' + esc(trimmed) + '</p>');
      continue;
    }

    // LEVEL 3 -- minor label: Title-case line ending in colon
    // (e.g. "Instructions:", "Concept:", "Title:")
    if (endsColon && trimmed.length < 48 && indent <= 6) {
      out.push('<p style="' + pad + 'font-weight:700;color:var(--mid);margin:6px 0 1px">' + esc(trimmed) + '</p>');
      continue;
    }

    // Body line
    out.push('<p style="' + pad + 'margin:1px 0;line-height:1.55">' + esc(trimmed) + '</p>');
  }

  return out.join('');
}

  var GAP=0.015;

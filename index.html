  var outerData=[
    {label:'Observation & Seeing',color:'#1e4976',tip:'<b>Observation & Seeing</b><br>Training the eye before the hand -- contour, negative space, gesture, drawing what you actually see rather than what you think you see.'},

  var dividers=[];
  (function(){var a=-Math.PI/2; for(var i=0;i<6;i++){dividers.push(a);a+=(outerLens[i]/outerTotal)*Math.PI*2;}})();

  var elData=[
    {label:'Line',color:'#1a5930',textColor:'#c8f0d8',tip:'<b>Line</b><br>Contour, gesture, implied, expressive. The primary tool of drawing.'},

  function buildFixed(data,r1,r2,rot){

  function lighten(hex,a){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return 'rgb('+Math.min(255,r+a*255)+','+Math.min(255,g+a*255)+','+Math.min(255,b+a*255)+')';

    wCtx.save();wCtx.beginPath();
    if(seg.r1===0){wCtx.arc(wcx,wcy,seg.r2,0,Math.PI*2);}
    else{wCtx.arc(wcx,wcy,seg.r2,seg.startAngle,seg.endAngle);wCtx.arc(wcx,wcy,seg.r1,seg.endAngle,seg.startAngle,true);wCtx.closePath();}
    wCtx.fillStyle=hov?lighten(seg.color,.16):seg.color;wCtx.fill();
    wCtx.strokeStyle='rgba(255,255,255,0.35)';wCtx.lineWidth=1.5;wCtx.stroke();
    wCtx.restore();
  }
  function wrapLines(words,maxW){
    var lines=[],cur='';
    for(var wi=0;wi<words.length;wi++){var w=words[wi];var t=cur?cur+' '+w:w;if(wCtx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
    if(cur)lines.push(cur);return lines;
  }
  function drawLabel(seg){
    if(seg.r1===0){
      wCtx.save();wCtx.textAlign='center';wCtx.textBaseline='middle';
      wCtx.fillStyle='#e8d0f8';wCtx.font='700 13px sans-serif';wCtx.fillText('RAMHAUS',wcx,wcy-9);
      wCtx.font='400 10px sans-serif';wCtx.fillStyle='rgba(232,208,248,0.75)';wCtx.fillText('Free Expression',wcx,wcy+6);
      wCtx.font='400 9px sans-serif';wCtx.fillStyle='rgba(232,208,248,0.42)';wCtx.fillText('medium of choice',wcx,wcy+18);
      wCtx.restore();return;
    }
    var mid=(seg.startAngle+seg.endAngle)/2;
    var arcLen=(seg.endAngle-seg.startAngle)*(seg.r1+seg.r2)/2;
    if(arcLen<26)return;
    var lr=(seg.r1+seg.r2)/2;
    var lx=wcx+lr*Math.cos(mid),ly=wcy+lr*Math.sin(mid);
    wCtx.save();wCtx.translate(lx,ly);
    var rot=mid+Math.PI/2;
    if(rot>Math.PI*.5&&rot<Math.PI*1.5)rot-=Math.PI;
    wCtx.rotate(rot);
    var bh=seg.r2-seg.r1,fs=bh>65?11:bh>42?10:9;
    wCtx.font='500 '+fs+'px sans-serif';wCtx.fillStyle=seg.textColor;
    wCtx.textAlign='center';wCtx.textBaseline='middle';
    var words=seg.label.split(' ');
    if(arcLen<55||words.length===1){wCtx.fillText(seg.label,0,0);}
    else{var lines=wrapLines(words,arcLen*.82);var lh=fs+2.5,th=lines.length*lh;lines.forEach(function(l,i){wCtx.fillText(l,0,-th/2+i*lh+lh/2);});}
    wCtx.restore();
  }
  function drawHandles(){
    for(var i=0;i<6;i++){
      var a=dividers[i]+rotOut;
      var hr=R_OUT_I+(R_OUT_O-R_OUT_I)*.5;
      var hx=wcx+hr*Math.cos(a),hy=wcy+hr*Math.sin(a);
      wCtx.save();wCtx.beginPath();wCtx.arc(hx,hy,7,0,Math.PI*2);
      wCtx.fillStyle='rgba(255,255,255,0.18)';wCtx.fill();
      wCtx.strokeStyle='rgba(255,255,255,0.7)';wCtx.lineWidth=1.2;wCtx.stroke();
      wCtx.strokeStyle='rgba(255,255,255,0.8)';wCtx.lineWidth=1.1;
      for(var d=-2;d<=2;d+=2){wCtx.beginPath();wCtx.moveTo(hx-2.5,hy+d);wCtx.lineTo(hx+2.5,hy+d);wCtx.stroke();}
      wCtx.restore();
    }
  }

  var wAllSegs=[];
  function wRebuild(hovIdx){
    var outer=buildOuter();
    var med=buildFixed(medData,R_MED_I,R_MED_O,rotMed);
    var elS=buildFixed(elData,R_EL_I,R_EL_O,rotEl);
    var core=[{label:'RAMHAUS',r1:0,r2:R_CORE,startAngle:0,endAngle:Math.PI*2,color:'#5e2d80',textColor:'#e8d0f8',
      tip:'<b>Free Expression</b><br>Students choose their preferred medium(s) and apply everything learned to create fully personal, expressive work.'}];
    wAllSegs=core.concat(elS).concat(med).concat(outer);
    wCtx.clearRect(0,0,SIZE,SIZE);
    wAllSegs.forEach(function(s,i){drawSeg(s,i===hovIdx);});
    wAllSegs.forEach(function(s){drawLabel(s);});
    drawHandles();
  }

  var DRAG_HIT=14;
  var wState='idle',wDragHdl=-1,wDragStartA=0,wDragStartR=0,wLastHov=-1;

  function wGetHandle(mx,my){
    for(var i=0;i<6;i++){
      var a=dividers[i]+rotOut,hr=R_OUT_I+(R_OUT_O-R_OUT_I)*.5;
      var hx=wcx+hr*Math.cos(a),hy=wcy+hr*Math.sin(a);
      if(Math.hypot(mx-hx,my-hy)<DRAG_HIT)return i;
    }
    return -1;
  }
  function wGetZone(mx,my){
    var d=Math.hypot(mx-wcx,my-wcy);
    if(d<R_CORE)return 'core';
    if(d<R_EL_O)return 'el';
    if(d<R_MED_O)return 'med';
    if(d<R_OUT_O)return 'out';
    return 'none';
  }
  function wGetHov(mx,my){
    var dist=Math.hypot(mx-wcx,my-wcy);
    var angle=((Math.atan2(my-wcy,mx-wcx)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    for(var i=0;i<wAllSegs.length;i++){
      var s=wAllSegs[i];
      if(dist<s.r1||dist>s.r2)continue;
      if(s.r1===0)return i;
      var sa=((s.startAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      var ea=((s.endAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      if(sa<=ea?(angle>=sa&&angle<=ea):(angle>=sa||angle<=ea))return i;
    }
    return -1;
  }
  function wToC(e){
    var rect=wheelCanvas.getBoundingClientRect(),sc=SIZE/rect.width;
    var ex=e.touches?e.touches[0].clientX:e.clientX;
    var ey=e.touches?e.touches[0].clientY:e.clientY;
    return[(ex-rect.left)*sc,(ey-rect.top)*sc];
  }

  wheelCanvas.addEventListener('mousedown',function(e){
    var c=wToC(e),mx=c[0],my=c[1];
    var dh=wGetHandle(mx,my);
    if(dh>=0){wState='handle';wDragHdl=dh;wheelCanvas.style.cursor='grabbing';e.preventDefault();return;}
    var zone=wGetZone(mx,my);
    if(zone==='el'||zone==='med'||zone==='out'){
      wState='ring-'+zone;wDragStartA=Math.atan2(my-wcy,mx-wcx);
      wDragStartR=zone==='el'?rotEl:zone==='med'?rotMed:rotOut;
      wheelCanvas.style.cursor='grabbing';e.preventDefault();
    }
  });
  wheelCanvas.addEventListener('mousemove',function(e){
    var c=wToC(e),mx=c[0],my=c[1];
    if(wState==='handle'){dividers[wDragHdl]=Math.atan2(my-wcy,mx-wcx)-rotOut;tooltip.style.opacity='0';wRebuild(-1);return;}
    if(wState.indexOf('ring-')===0){
      var cur=Math.atan2(my-wcy,mx-wcx),delta=cur-wDragStartA;
      if(wState==='ring-el')rotEl=wDragStartR+delta;
      else if(wState==='ring-med')rotMed=wDragStartR+delta;
      else rotOut=wDragStartR+delta;
      tooltip.style.opacity='0';wRebuild(-1);return;
    }
    var dh=wGetHandle(mx,my),zone=wGetZone(mx,my);
    wheelCanvas.style.cursor=dh>=0?'ew-resize':(zone==='el'||zone==='med'||zone==='out')?'grab':'default';
    var idx=wGetHov(mx,my);
    if(idx!==wLastHov){wLastHov=idx;wRebuild(idx);}
    if(idx>=0){
      var wr=wheelWrap.getBoundingClientRect();
      var tx2=e.clientX-wr.left+14,ty2=e.clientY-wr.top+14;
      if(tx2+225>wr.width)tx2=e.clientX-wr.left-228;
      tooltip.style.left=tx2+'px';tooltip.style.top=ty2+'px';
      tooltip.innerHTML=wAllSegs[idx].tip||wAllSegs[idx].label;
      tooltip.style.opacity='1';
    } else tooltip.style.opacity='0';
  });
  window.addEventListener('mouseup',function(){
    if(wState!=='idle'){wState='idle';wDragHdl=-1;wheelCanvas.style.cursor='pointer';wRebuild(wLastHov);}
  });
  wheelCanvas.addEventListener('mouseleave',function(){
    if(wState==='idle'){wLastHov=-1;wRebuild(-1);tooltip.style.opacity='0';}
  });
  wheelCanvas.addEventListener('touchstart',function(e){
    var c=wToC(e),mx=c[0],my=c[1];
    var dh=wGetHandle(mx,my);
    if(dh>=0){wState='handle';wDragHdl=dh;e.preventDefault();return;}
    var zone=wGetZone(mx,my);
    if(zone==='el'||zone==='med'||zone==='out'){
      wState='ring-'+zone;wDragStartA=Math.atan2(my-wcy,mx-wcx);
      wDragStartR=zone==='el'?rotEl:zone==='med'?rotMed:rotOut;
      e.preventDefault();
    }
  },{passive:false});
  wheelCanvas.addEventListener('touchmove',function(e){
    if(wState==='idle')return;e.preventDefault();
    var c=wToC(e),mx=c[0],my=c[1];
    if(wState==='handle'){dividers[wDragHdl]=Math.atan2(my-wcy,mx-wcx)-rotOut;wRebuild(-1);return;}
    var cur=Math.atan2(my-wcy,mx-wcx),delta=cur-wDragStartA;
    if(wState==='ring-el')rotEl=wDragStartR+delta;
    else if(wState==='ring-med')rotMed=wDragStartR+delta;
    else rotOut=wDragStartR+delta;
    wRebuild(-1);
  },{passive:false});
  wheelCanvas.addEventListener('touchend',function(){wState='idle';wDragHdl=-1;wRebuild(-1);});

  // Click -> open unit page
  wheelCanvas.addEventListener('click', function(e) {
    if (wState !== 'idle') return;
    var c = wToC(e), mx = c[0], my = c[1];
    var idx = wGetHov(mx, my);
    if (idx < 0) return;
    var seg = wAllSegs[idx];
    if (!seg) return;
    openRamhausUnit(cv, meta, box, ch, seg);
  });

  wRebuild(-1);
}

// Prevent Tab from shifting focus out of textareas (inputs use their own handlers).
// Skip checkboxes and any element that handles Tab itself.
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Tab') return;
  var el2 = document.activeElement;
  if (!el2) return;
  // Only handle plain text inputs and textareas
  if (el2.tagName === 'INPUT' && el2.type !== 'text' && el2.type !== 'search' && el2.type !== '') return;
  if (el2.tagName !== 'INPUT' && el2.tagName !== 'TEXTAREA') return;
  // Skip contenteditable -- handled by the rich text editor
  if (el2.isContentEditable) return;
  e.preventDefault();
  try {
    var start = el2.selectionStart;
    var end   = el2.selectionEnd;
    var spaces = '    ';
    el2.value = el2.value.substring(0, start) + spaces + el2.value.substring(end);
    el2.selectionStart = el2.selectionEnd = start + spaces.length;
    el2.dispatchEvent(new Event('input', { bubbles: true }));
  } catch(err) {}
}, true);

<!-- GitHub Sync — drop-in replacement for Firebase, same _fbLoad/_fbSave interface -->
<script>
(function(){
  // Config persisted locally (never leaves your browser except to call GitHub)
  var CFG_KEY = 'teacher_book_gh_cfg';
  function getCfg(){
    var c; try{ c = JSON.parse(localStorage.getItem(CFG_KEY)||'{}'); }catch(e){ return {}; }
    // Teaching data belongs in the private repo, never the public SUBROUTINE one
    if(String(c.owner||'').toLowerCase()==='zjaylewis94' && String(c.repo||'').toLowerCase()==='subroutine'){
      c.repo = 'subroutine-data'; delete c._sha; setCfg(c);
    }
    return c;
  }
  function setCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }

  function ghHeaders(token){
    return { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' };
  }
  function apiURL(c){
    return 'https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'teacher_book_data.json')+(c.branch?('?ref='+c.branch):'');
  }

  // LOAD: returns parsed state object or null
  window._fbLoad = async function(){
    var c = getCfg();
    if(!c.token || !c.owner || !c.repo) return null;
    try{
      var res = await fetch(apiURL(c), { headers: ghHeaders(c.token) });
      if(res.status===404) return null; // file not created yet
      if(!res.ok){ console.warn('GitHub load failed:', res.status); return null; }
      var j = await res.json();
      // remember the blob sha for next write
      c._sha = j.sha; setCfg(c);
      var content = decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
      return JSON.parse(content);
    }catch(e){ console.warn('GitHub load error:', e); return null; }
  };

  // SAVE: accepts a JSON string (matches old Firebase interface)
  var saveTimer=null, pending=null;
  window._fbSave = async function(json){
    var c = getCfg();
    if(!c.token || !c.owner || !c.repo) return;
    pending = json;
    // debounce writes so we don't hammer the API on every keystroke
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1500);
  };
  async function doSave(){
    var c = getCfg();
    if(!c.token || pending===null) return;
    var body = {
      message: 'teacher book update '+new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(pending))),
      branch: c.branch || undefined
    };
    if(c._sha) body.sha = c._sha;
    try{
      var res = await fetch('https://api.github.com/repos/'+c.owner+'/'+c.repo+'/contents/'+(c.path||'teacher_book_data.json'), {
        method:'PUT', headers: ghHeaders(c.token), body: JSON.stringify(body)
      });
      if(res.ok){
        var j = await res.json();
        c._sha = j.content.sha; setCfg(c);
        ghFlash('Synced to GitHub', 'var(--ok)');
      } else if(res.status===409){
        // sha conflict — refetch sha and retry once
        delete c._sha; setCfg(c);
        var r2 = await fetch(apiURL(c), { headers: ghHeaders(c.token) });
        if(r2.ok){ var jj=await r2.json(); c._sha=jj.sha; setCfg(c); return doSave(); }
      } else {
        ghFlash('Sync failed ('+res.status+')', 'var(--danger)');
      }
    }catch(e){ ghFlash('Sync error', 'var(--danger)'); }
    pending=null;
  }

  function ghFlash(msg,color){
    var el=document.getElementById('sync-status');
    if(el){ el.textContent=msg; el.style.color=color||'var(--dim)'; setTimeout(function(){ el.textContent=''; },2500); }
  }

  // ── Settings UI ──
  function openSyncSettings(){
    var c = getCfg();
    var existing = document.getElementById('gh-modal'); if(existing) existing.remove();
    var ov = document.createElement('div'); ov.id='gh-modal';
    ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    var box = document.createElement('div');
    box.style.cssText='background:var(--s1);border:1px solid var(--br2);border-radius:14px;padding:24px;max-width:440px;width:100%;font-family:DM Sans,sans-serif';
    box.innerHTML =
      '<div style="font-family:Rajdhani,sans-serif;font-size:1rem;font-weight:700;letter-spacing:1px;color:var(--text);margin-bottom:4px">GITHUB SYNC</div>'+
      '<div style="font-size:.72rem;color:var(--dim);margin-bottom:18px;line-height:1.5">Edits save to a JSON file in your repo. Create a <b>fine-grained token</b> with Contents read/write on the repo, then paste below.</div>'+
      fld('Owner (username)','gh-owner',c.owner||'zjaylewis94')+
      fld('Repo','gh-repo',c.repo||'subroutine-data')+
      fld('Branch (optional)','gh-branch',c.branch||'')+
      fld('File path','gh-path',c.path||'teacher_book_data.json')+
      fld('Token','gh-token',c.token||'','password')+
      '<div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end">'+
        '<button id="gh-cancel" style="background:none;border:1px solid var(--br2);border-radius:7px;color:var(--dim);padding:8px 14px;cursor:pointer;font-family:Rajdhani,sans-serif;font-weight:600;letter-spacing:1px">CANCEL</button>'+
        '<button id="gh-save" style="background:var(--teaching);border:none;border-radius:7px;color:#fff;padding:8px 16px;cursor:pointer;font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:1px">SAVE & SYNC</button>'+
      '</div>';
    function fld(label,id,val,type){
      return '<div style="margin-bottom:11px"><label style="display:block;font-size:.64rem;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:4px">'+label+'</label>'+
        '<input id="'+id+'" type="'+(type||'text')+'" value="'+(val||'').replace(/"/g,'&quot;')+'" style="width:100%;background:var(--s2);border:1px solid var(--br2);border-radius:7px;color:var(--text);padding:8px 10px;font-family:DM Sans,sans-serif;font-size:.82rem;outline:none"></div>';
    }
    ov.appendChild(box); document.body.appendChild(ov);
    document.getElementById('gh-cancel').onclick=function(){ ov.remove(); };
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
    document.getElementById('gh-save').onclick=async function(){
      var nc = {
        owner: document.getElementById('gh-owner').value.trim(),
        repo: document.getElementById('gh-repo').value.trim(),
        branch: document.getElementById('gh-branch').value.trim(),
        path: document.getElementById('gh-path').value.trim()||'teacher_book_data.json',
        token: document.getElementById('gh-token').value.trim()
      };
      setCfg(nc);
      ov.remove();
      ghFlash('Connecting…','var(--gold)');
      // pull remote; if newer, hydrate
      var remote = await window._fbLoad();
      if(remote && remote._ts && (!S._ts || remote._ts > S._ts)){
        if(confirm('Found newer data on GitHub. Load it? (Cancel keeps what is on this device.)')){
          localStorage.setItem('teacher_book_v2', JSON.stringify(remote));
          location.reload(); return;
        }
      }
      // otherwise push current up
      if(typeof S!=='undefined'){ window._fbSave(JSON.stringify(S)); }
    };
  }
  window.openSyncSettings = openSyncSettings;

  // Wire the existing Sync button to settings, and do an initial pull
  document.addEventListener('DOMContentLoaded', function(){
    var sb=document.getElementById('sync-btn');
    if(sb) sb.onclick = openSyncSettings;
    var c=getCfg();
    if(c.token && c.owner && c.repo && typeof S!=='undefined'){
      window._fbLoad().then(function(remote){
        if(remote && remote._ts && (!S._ts || remote._ts > S._ts)){
          localStorage.setItem('teacher_book_v2', JSON.stringify(remote));
          location.reload();
        }
      });
    }
  });
})();
</script>
</body>
</html>

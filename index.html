      { id:'u3',num:3,title:'Tempera',overview:'Tempera is your first real paint, and it teaches you how color behaves before you have to worry about subtle blending. You\'ll mix a color wheel, blend smooth and segmented gradients, and learn to paint clean, flat shapes with sharp edges. Then you\'ll use that control to make ordinary objects look bold and graphic. By the end, you should be able to mix the color you need and paint it cleanly where you want it.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u3p1',tier:'TIER 1',name:'Tempera Intro Worksheet',pts:2,desc:'Learn brushes, paint handling, cleanup, and the vocabulary for opacity, tint, and shade.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p2',tier:'TIER 1',name:'Color Theory Worksheet',pts:2,desc:'Mix the primaries into a full color wheel, then add tints, shades, and complementary pairs.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p3',tier:'TIER 2',name:'Blending Tubes (Smooth + Segmented)',pts:4,desc:'Paint two tubes that turn in space, one blended smoothly and one in stepped bands of color.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p4',tier:'TIER 2',name:'Sparkmatik Blobs',pts:4,desc:'Paint a set of glossy, candy-colored blob forms with crisp highlights and color-mixed shadows, in the style of Sparkmatik.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p5',tier:'TIER 2',name:'Impossible Shape Painting',pts:4,desc:'Paint an impossible figure, like a Penrose triangle, using flat value planes to sell an illusion that can\'t exist.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p6',tier:'TIER 2',name:'2D Mecca Chameleon',pts:4,desc:'Paint a chameleon built from flat, bold color shapes and pattern, keeping every edge clean and every color vibrant.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p7',tier:'TIER 3',name:'Burton Morris Product Painting',pts:8,desc:'Paint an oversized everyday product with bold outlines and flat color in the Pop Art style of Burton Morris.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p8',tier:'WILD CARD',name:'Digital Painting (TBD)',pts:null,desc:'Take this unit\'s color mixing into a digital painting app; project details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u3p9',tier:'WILD CARD',name:'Disco Ball Painting',pts:null,desc:'Paint a disco ball, using a grid of tiles and bounced color to show reflection and light.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u4',num:4,title:'Water Color',overview:'Watercolor works backward from everything you\'ve painted so far: you save your lights instead of adding them. You\'ll learn flat, graded, and wet-on-wet washes, how to layer transparent color, and when to stop. Then you\'ll take it outside to paint real places quickly and loosely. By the end, you should be able to plan a painting from light to dark and capture a scene with fresh, confident washes.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u4p1',tier:'TIER 1',name:'Water Color Worksheet',pts:2,desc:'Practice flat, graded, wet-on-wet, and wet-on-dry washes, plus lifting and salt texture.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u4p2',tier:'TIER 1',name:'Value Wash Scale',pts:2,desc:'Build a value scale from one color by layering transparent washes from light to dark.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u4p3',tier:'TIER 2',name:'Object Study Painting',pts:4,desc:'Paint a single object from observation, building its form in layers from light washes to dark details.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u4p4',tier:'TIER 2',name:'Contour Watercolor Portrait',pts:4,desc:'Draw a continuous-line ink portrait, then drop loose watercolor washes over and around the lines.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u4p5',tier:'TIER 3',name:'Urban Sketching Final',pts:8,desc:'Draw and paint a real location on site or from your own photo, using ink line and watercolor washes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u4p6',tier:'WILD CARD',name:'Holiday Project (TBD)',pts:null,desc:'A seasonal project to close the semester; details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},

  {
    id:'draw2',label:'Draw + Paint 2',color:'#D35400',
    units:[
      { id:'u5',num:5,title:'Colored Pencil',overview:'Colored pencil rewards patience: color builds up slowly in thin layers until it looks painted. You\'ll learn layering, blending, and burnishing, then use them to render shiny, reflective surfaces. The unit closes with a portrait in full color. By the end, you should be able to mix color right on the paper and render skin, shine, and texture with control.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u5p1',tier:'TIER 1',name:'Colored Pencil Intro Worksheet',pts:2,desc:'Learn pressure control, layering, blending, and burnishing, and when to use each.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u5p2',tier:'TIER 1',name:'Color Layering Gradients',pts:2,desc:'Blend two and three colors into smooth gradients by layering, without a blender.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u5p3',tier:'TIER 2',name:'Koons Dog',pts:4,desc:'Render Jeff Koons\' Balloon Dog, using layered color to show its mirror-like reflections and highlights.',materials:['Balloon Dog reference','Pencil or colored pencil','Drawing paper'],steps:['Research Jeff Koons and his Balloon Dog sculpture.','Sketch the basic balloon tube shapes.','Identify where light hits the shiny surface -- sharp highlights.','Apply full value range within each tube form.','Add a sharp bright highlight using eraser or white pencil.','Remember: reflection wraps around each balloon.'],tip:'Shiny = sharpest highlights AND darkest darks right next to each other.',rubric:[{name:'Reflective Highlights',desc:'Sharp, bright highlight present'},{name:'Value Range',desc:'Full range including very dark'},{name:'Form',desc:'Balloon tubes read as 3D'},{name:'Craftsmanship',desc:'Clean, polished work'}]},
        {id:'u5p4',tier:'TIER 2',name:'Layered Fruit Study',pts:4,desc:'Draw a piece of fruit from observation, building at least five layers of color for form and texture.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u5p5',tier:'TIER 3',name:'Half Face Celeb (Color Edition)',pts:8,desc:'Complete the missing half of a celebrity photo, matching its skin tones, values, and shadows in colored pencil.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u5p6',tier:'WILD CARD',name:'Guided Landscape Revisited',pts:null,desc:'Redraw your first-week landscape now that you know layering, and compare the two side by side.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u5p7',tier:'WILD CARD',name:'Sneaker Design',pts:null,desc:'Design a custom sneaker and render it in colored pencil with shine, stitching, and texture.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u6',num:6,title:'Charcoal',overview:'Charcoal is messy, fast, and dramatic, and that\'s the point. You\'ll push value further than pencil allows, work on toned paper, and pull light out of dark with an eraser. Then you\'ll turn to the human figure, starting with gesture and building to a full drawing. By the end, you should be able to draw with bold, expressive value and capture a figure\'s pose and proportions.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u6p1',tier:'TIER 1',name:'Charcoal Intro Worksheet',pts:2,desc:'Learn vine, compressed, and white charcoal, blending tools, and subtractive erasing.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p2',tier:'TIER 1',name:'Toned Paper Shading',pts:2,desc:'Shade forms on toned paper, adding darks with charcoal and highlights with white.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u6p3',tier:'TIER 2',name:'Charcoal Water Droplet',pts:4,desc:'Render realistic water droplets by blending soft shadows and lifting out sharp highlights.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p4',tier:'TIER 2',name:'Still Life Practice',pts:4,desc:'Draw a lit still life from observation, focusing on dramatic contrast and cast shadows.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p5',tier:'TIER 2',name:'Gesture Drawings',pts:4,desc:'Capture a model\'s pose in 30-second to 2-minute gestures, focusing on movement over detail.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u6p6',tier:'TIER 3',name:'Figure Drawing',pts:8,desc:'Draw a full figure from a live model or reference, with accurate proportions and dramatic value.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u6p7',tier:'WILD CARD',name:'Expressive Self-Portrait',pts:null,desc:'Draw a large, loose self-portrait that exaggerates contrast to show a mood.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u6p8',tier:'WILD CARD',name:'Night Scene',pts:null,desc:'Draw a street or room at night lit by a single lamp or window, working light out of a dark ground.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u7',num:7,title:'Pastel',overview:'Pastel sits between drawing and painting: you draw with pure pigment and blend it like paint. You\'ll explore both soft pastel and oil pastel, from smooth blends to scratch-through sgraffito and wax resist. Then you\'ll use bold, saturated color to build a still life or landscape that glows. By the end, you should be able to layer and blend pastel color to create vivid, expressive images.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u7p1',tier:'TIER 1',name:'Pastel Intro Worksheet',pts:2,desc:'Learn soft pastel and oil pastel handling, layering, and the vocabulary for both.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u7p2',tier:'TIER 1',name:'Soft Pastel Blending',pts:2,desc:'Practice smooth gradients and color mixing, blending with fingers, stumps, and paper towels.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p3',tier:'TIER 1',name:'Oil Pastel Techniques',pts:2,desc:'Try sgraffito, wax resist, and heavy layering on a technique sampler.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p4',tier:'TIER 2',name:'Color Blend Sunset',pts:4,desc:'Blend a sunset sky in soft pastel, moving through at least four colors without muddy transitions.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p5',tier:'TIER 2',name:'Sgraffito Pattern Study',pts:4,desc:'Layer oil pastel colors, then scratch a pattern through the top layer to reveal the color underneath.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p6',tier:'TIER 2',name:'Complementary Shadow Study',pts:4,desc:'Draw a simple object with shadows mixed from its complement instead of black.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p7',tier:'TIER 3',name:'Bold Still Life',pts:8,desc:'Draw a still life with saturated color and strong light, filling the whole page with no bare paper.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u7p8',tier:'WILD CARD',name:'Wayne Thiebaud Desserts',pts:null,desc:'Draw a row of cakes or pies with thick color and colored shadows in the style of Wayne Thiebaud.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u8',num:8,title:'Scratchboard',overview:'Scratchboard flips drawing upside down: you start with black and scratch your way to the light. Every mark removes ink, so you\'ll plan your highlights first and build texture one line at a time. You\'ll practice fur, feathers, and scales before taking on an animal portrait. By the end, you should be able to reverse your value thinking and render detailed texture with subtractive lines.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u8p1',tier:'TIER 1',name:'Scratchboard Intro Worksheet',pts:2,desc:'Learn the tools, safe scratching, and the basic marks: hatching, stippling, and crosshatching in reverse.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u8p2',tier:'TIER 1',name:'Value Reversal Study',pts:2,desc:'Draw a simple form on black by scratching out its highlights first, then its midtones.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u8p3',tier:'TIER 2',name:'Texture Sampler',pts:4,desc:'Scratch a grid of textures such as fur, feathers, scales, wood, and water, each in its own box.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u8p4',tier:'TIER 2',name:'Animal Eye Study',pts:4,desc:'Render a close-up animal eye with its reflection and the fur, feathers, or scales around it.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u8p5',tier:'TIER 3',name:'Scratchboard Animal',pts:8,desc:'Render an animal from reference, using directional lines to show its fur, feathers, or scales.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u8p6',tier:'WILD CARD',name:'Colored Scratchboard',pts:null,desc:'Add ink or watercolor over your scratched lines to bring color into one area of emphasis.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u9',num:9,title:'Animation',overview:'Animation is drawing in time: each frame is a drawing, and the life comes from the changes between them. You\'ll start with flipbooks and simple loops, then learn timing, squash and stretch, and anticipation. You\'ll plan a short sequence with a storyboard and bring it to life. By the end, you should be able to make a drawing move with believable timing and personality.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u9p1',tier:'TIER 1',name:'Animation Intro Worksheet',pts:2,desc:'Learn key frames, in-betweens, frame rate, and the principles that make movement believable.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u9p2',tier:'TIER 1',name:'Flipbook',pts:2,desc:'Draw a flipbook of at least 24 frames showing one simple action, like a growing plant or a melting ice cream cone.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p3',tier:'TIER 2',name:'Bouncing Ball',pts:4,desc:'Animate a ball bouncing to a stop, using squash, stretch, and spacing to show weight.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p4',tier:'TIER 2',name:'Looping GIF',pts:4,desc:'Create a seamless 8 to 12 frame loop, such as a flickering flame, a waving flag, or blinking eyes.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p5',tier:'TIER 2',name:'Zoetrope Strip',pts:4,desc:'Draw a looping strip for a zoetrope and watch your animation spin.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p6',tier:'TIER 3',name:'10-Second Short',pts:8,desc:'Storyboard and animate a 10-second scene with a clear beginning, middle, and end.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u9p7',tier:'WILD CARD',name:'Rammy Mini Lesson',pts:null,desc:'Animate Rammy, the Ramhaus mascot, teaching one art skill from this year in a 15-second short.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u10',num:10,title:'Masterpiece',overview:'This is your capstone: one piece, your choice of medium, your idea. You\'ll look back at everything you tried this year, pick the medium you control best, and plan a finished work from proposal to critique. You\'ll also prepare your work for display. By the end, you should be able to take an original idea from sketch to a finished, presented artwork on your own.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u10p1',tier:'TIER 1',name:'Masterpiece Intro Worksheet',pts:2,desc:'Review every medium from the year and choose the one you\'ll use, with reasons.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u10p2',tier:'TIER 1',name:'Project Proposal',pts:2,desc:'Write a short plan with your idea, medium, references, and timeline, and get it approved.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p3',tier:'TIER 1',name:'Thumbnail Sketches',pts:2,desc:'Draw at least three thumbnail compositions and pick the strongest with a partner\'s feedback.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p4',tier:'TIER 2',name:'Medium Test Panels',pts:4,desc:'Test your planned colors, textures, and techniques on scrap before you touch the final.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p5',tier:'TIER 2',name:'Composition Study',pts:4,desc:'Draw a full-size value sketch of your final layout to test the composition before you commit.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p6',tier:'TIER 3',name:'Final Masterpiece',pts:8,desc:'Create a finished, original work in your chosen medium that shows the best of what you learned this year.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u10p7',tier:'WILD CARD',name:'Art Show Setup',pts:null,desc:'Help hang and label the end-of-year art show, and write the placard for your own piece.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},

  {
    id:'draw3',label:'Draw + Paint 3',color:'#2471A3',
    units:[
      { id:'u11',num:11,title:'Advanced Pencil',overview:'You already know how to shade a sphere; now you\'ll make light and form do what you want. You\'ll push gradients further, construct complex objects from simple forms, and study how cast shadows bend over surfaces. The unit ends with a surreal landscape where impossible forms still obey real light. By the end, you should be able to invent forms from imagination and light them convincingly.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u11p1',tier:'TIER 1',name:'Pencil Intro Worksheet+',pts:2,desc:'Review pencil grades and value zones, then push into edge control, lost and found edges, and full-range values.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p2',tier:'TIER 1',name:'Advanced Gradients',pts:2,desc:'Blend long, seamless gradients across curved and flat planes without visible steps.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p3',tier:'TIER 2',name:'Fruit Studies',pts:4,desc:'Draw fruit from observation, matching subtle value shifts and surface texture.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p4',tier:'TIER 2',name:'Constructing + Editing Form',pts:4,desc:'Build complex objects from basic forms, then refine the drawing by editing edges and proportions.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p5',tier:'TIER 2',name:'Cast Shadow Studies',pts:4,desc:'Draw how cast shadows stretch, bend, and soften as they fall across different surfaces.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p6',tier:'TIER 3',name:'Surrealist Forms Landscape',pts:8,desc:'Invent a surreal landscape of impossible forms that still follow one consistent light source.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p7',tier:'WILD CARD',name:'Tunnel Book',pts:null,desc:'Build a tunnel book of five or more layers, each shaded to push atmospheric depth.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u11p8',tier:'WILD CARD',name:'Food Truck',pts:null,desc:'Design a food truck in two-point perspective with a full menu, branding, and a shaded 3D body.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u12',num:12,title:'Advanced Pen + Ink',overview:'In the intro course you learned ink\'s rules; now you\'ll learn to bend them. You\'ll combine precise pen texture with loose ink wash and study how a single brushstroke can hold a whole form. The unit builds to Sumi-e, the Japanese ink painting tradition where restraint does the work. By the end, you should be able to move between controlled line and expressive wash in the same piece.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u12p1',tier:'TIER 1',name:'Pen + Ink Intro Worksheet+',pts:2,desc:'Review ink tools and vocabulary, then add brush pens, dip pens, and ink dilution to your toolkit.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p2',tier:'TIER 1',name:'Pen Shading Techniques',pts:2,desc:'Build value scales in hatching, crosshatching, stippling, and scribbling, with tighter control and a wider range.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p3',tier:'TIER 1',name:'Line Quality + Line Weights',pts:2,desc:'Use line weight to show light direction, overlap, and distance in a single contour drawing.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p4',tier:'TIER 2',name:'Contour Line Forms/Objects',pts:4,desc:'Draw complex objects with cross-contour lines that wrap around each form to describe its surface.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p5',tier:'TIER 2',name:'Ink Wash Blockout / Pen Texture',pts:4,desc:'Block in values with diluted ink wash, then layer pen texture on top for detail.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p6',tier:'TIER 3',name:'Ink Wash (Sumi-e)',pts:8,desc:'Paint a subject in the Sumi-e tradition, using as few brushstrokes as possible to capture its essence.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p7',tier:'WILD CARD',name:'Inktober Sketchbook',pts:null,desc:'Complete the daily Inktober prompts through October, trying a new ink technique each week.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u12p8',tier:'WILD CARD',name:'Halloween Masks',pts:null,desc:'Design and build a Halloween mask decorated with layered ink pattern and wash.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u13',num:13,title:'Acrylic',overview:'Acrylic is fast, flexible, and unforgiving of muddy color, which makes it the right paint for this level. You\'ll mix precise value scales, paint crinkled and reflective surfaces, and learn to glaze, layer, and build texture. You\'ll finish with a large painting that pulls all of it together. By the end, you should be able to mix and layer acrylic to paint convincing light, reflection, and surface.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u13p1',tier:'TIER 1',name:'Acrylic Intro Worksheet',pts:2,desc:'Learn acrylic handling, brushes, canvas prep, drying time, and palette care.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p2',tier:'TIER 1',name:'Color Theory / Value Scales Worksheet+',pts:2,desc:'Mix tints, shades, tones, and a matched value scale for each color on the wheel.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p3',tier:'TIER 2',name:'That\'s a Wrap!',pts:4,desc:'Paint a wrapped object, capturing the folds, crinkles, and highlights of foil or plastic.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p4',tier:'TIER 2',name:'Sparkmatik Blobs',pts:4,desc:'Paint glossy blob forms with smooth acrylic blends, crisp highlights, and reflected color, in the style of Sparkmatik.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p5',tier:'TIER 2',name:'3D Mecca Chameleon',pts:4,desc:'Paint a chameleon with full form, light, and texture instead of flat shapes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p6',tier:'TIER 3',name:'Candy Box',pts:8,desc:'Paint a candy box composition that shows off color, reflection, and packaging detail.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p7',tier:'WILD CARD',name:'Digital Painting (TBD)',pts:null,desc:'Take this unit\'s painting skills into a digital painting app; project details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u13p8',tier:'WILD CARD',name:'Vector Painting',pts:null,desc:'Paint an image in flat, hard-edged color shapes inspired by vector art.',materials:[],steps:[],tip:'',rubric:[]},
      ]},
      { id:'u14',num:14,title:'Advanced Water Color',overview:'Now that you can control a wash, you\'ll combine watercolor with other media and work from life. You\'ll layer transparent color under colored pencil detail, paint still lifes from observation, and practice sketching fast on location. The unit ends with an urban sketching piece that captures the feeling of a real place, not just its outline. By the end, you should be able to paint from life with speed and mix watercolor with other media on purpose.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u14p1',tier:'TIER 1',name:'Water Color Worksheet+',pts:2,desc:'Review washes and layering, then add glazing, granulation, masking fluid, and lifting.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p2',tier:'TIER 1',name:'Limited Palette Study',pts:2,desc:'Paint a small scene using only three colors plus water, mixing every other color you need.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u14p3',tier:'TIER 2',name:'Sweet Treats Painting',pts:4,desc:'Paint a dessert in layered watercolor, then add colored pencil details for texture and shine.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p4',tier:'TIER 2',name:'Still Life Practice',pts:4,desc:'Paint a still life from observation, planning your lights before your first wash.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p5',tier:'TIER 3',name:'Urban Sketching Final',pts:8,desc:'Draw and paint a real location on site, capturing its atmosphere with loose line and layered washes.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u14p6',tier:'WILD CARD',name:'Holiday Project (TBD)',pts:null,desc:'A seasonal project to close the semester; details are still to be set.',materials:[],steps:[],tip:'',rubric:[]},

  {
    id:'draw4',label:'Draw + Paint 4',color:'#7D3C98',
    units:[
      { id:'u15',num:15,title:'Advanced Colored Pencil',overview:'You know how to layer color; now you\'ll use it to fool the eye. You\'ll render reflective, transparent, and textured surfaces with enough layers that the paper disappears. The unit ends with a full-face portrait in color. By the end, you should be able to render realistic skin, reflection, and texture in colored pencil.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u15p1',tier:'TIER 1',name:'Colored Pencil Intro Worksheet+',pts:2,desc:'Review layering and burnishing, then add solvent blending, impressed lines, and toned paper.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p2',tier:'TIER 1',name:'Skin Tone Mixing',pts:2,desc:'Mix a range of skin tones by layering, then match three tones from photo references.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u15p3',tier:'TIER 2',name:'Colored Pencil Candy Drawing',pts:4,desc:'Render wrapped or glossy candy, capturing transparency, reflections, and crinkled wrappers.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p4',tier:'TIER 2',name:'Glass + Metal Study',pts:4,desc:'Render a glass or metal object, capturing its reflections and the distorted view through it.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u15p5',tier:'TIER 3',name:'Full Face Celeb (Color Edition)',pts:8,desc:'Draw a full celebrity portrait from a photo, with accurate proportions, skin tones, and lighting.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u15p6',tier:'WILD CARD',name:'Album Cover',pts:null,desc:'Design and render a cover for a real or imagined album, combining lettering with a realistic object.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u16',num:16,title:'Advanced Charcoal',overview:'Charcoal at this level is about drama and control at the same time. You\'ll build still lifes with strong light, draw a stylized portrait, and spend serious time with the figure. You\'ll work larger and faster than you\'re used to. By the end, you should be able to draw an expressive, anatomically sound figure with a full range of value.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u16p1',tier:'TIER 1',name:'Charcoal Intro Worksheet+',pts:2,desc:'Review charcoal types and erasing, then push into toned paper, white charcoal, and drawing out of a dark ground.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p2',tier:'TIER 1',name:'8 Head Figure Proportions',pts:2,desc:'Map the human figure in 8-head proportions and draw it standing, seated, and in motion.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u16p3',tier:'TIER 1',name:'Gesture Speed Drills',pts:2,desc:'Draw 30-second and 1-minute gestures to warm up for figure work.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u16p4',tier:'TIER 2',name:'Still Life Practice',pts:4,desc:'Draw a still life with dramatic side lighting, focusing on edges and cast shadows.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p5',tier:'TIER 2',name:'Tim Burton Portrait',pts:4,desc:'Draw a portrait in Tim Burton\'s style on toned paper, exaggerating features while keeping the value realistic.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p6',tier:'TIER 3',name:'Figure Drawing',pts:8,desc:'Draw a full figure from a live model or reference, with accurate proportions, weight, and expressive value.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u16p7',tier:'WILD CARD',name:'Cinematic Frame',pts:null,desc:'Recreate a single frame from a film in charcoal, keeping its lighting and mood.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u17',num:17,title:'Advanced Pastel',overview:'At this level, pastel is about bold, expressive color choices, not just blending. You\'ll build color with visible, layered strokes and push it beyond what you see. You\'ll combine soft and oil pastel on purpose and work on colored grounds. By the end, you should be able to use color expressively to set a mood and lead the viewer\'s eye.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u17p1',tier:'TIER 1',name:'Pastel Intro Worksheet+',pts:2,desc:'Review soft and oil pastel techniques, then add colored grounds, fixative layering, and optical color mixing.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u17p2',tier:'TIER 1',name:'Color Temperature Study',pts:2,desc:'Draw the same object twice, once in warm colors and once in cool, and compare the moods.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u17p3',tier:'TIER 2',name:'Layered Stroke Study',pts:4,desc:'Build a small drawing entirely from visible, layered strokes, letting colors mix in the eye instead of by blending.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u17p4',tier:'TIER 2',name:'Expressive Color Portrait',pts:4,desc:'Draw a portrait using unexpected colors for skin and shadow, in the spirit of the Fauvists.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u17p5',tier:'TIER 3',name:'Expressive Color Composition',pts:8,desc:'Create an original composition where color, not realism, carries the emotion.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u17p6',tier:'WILD CARD',name:'Pastel on Black',pts:null,desc:'Draw a glowing subject, like neon signs or city lights, on black paper.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u18',num:18,title:'Lino Prints',overview:'Printmaking is carving in reverse: what you cut away stays white, and everything you leave prints. You\'ll learn to plan a design in positive and negative space, carve safely, and ink and pull clean prints. Then you\'ll make an edition, a matching set of prints from one block. By the end, you should be able to design, carve, and print a linoleum block with crisp, consistent results.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u18p1',tier:'TIER 1',name:'Lino Print Intro Worksheet+',pts:2,desc:'Learn carving tools, safety, printing vocabulary, and why your image prints in reverse.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u18p2',tier:'TIER 1',name:'Carving Sampler',pts:2,desc:'Carve a small practice block with lines, textures, and solid areas to learn each gouge.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u18p3',tier:'TIER 2',name:'Positive / Negative Space Design',pts:4,desc:'Design an image in pure black and white, deciding which areas to carve away and which to keep.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u18p4',tier:'TIER 2',name:'Stamp Set',pts:4,desc:'Carve a small stamp and print it in repeat to build a pattern.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u18p5',tier:'TIER 3',name:'Lino Block Print',pts:8,desc:'Design, carve, and print a linoleum block, then pull a numbered edition of clean prints.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u18p6',tier:'WILD CARD',name:'Printed Poster',pts:null,desc:'Design a poster for a school event and print a small run from your block.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u19',num:19,title:'Advanced Animation',overview:'You know how to make a drawing move; now you\'ll make it act. You\'ll animate walk cycles, lip sync, and characters with weight and emotion, and you\'ll plan a short with a storyboard and animatic. The unit ends with a finished short film. By the end, you should be able to plan, animate, and edit a short piece that tells a story.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u19p1',tier:'TIER 1',name:'Animation Intro Worksheet+',pts:2,desc:'Review the principles of animation, then add timing charts, arcs, and overlapping action.',materials:[],steps:[],tip:'',rubric:[]},
        {id:'u19p2',tier:'TIER 1',name:'Walk Cycle',pts:2,desc:'Animate a character\'s walk as a looping cycle, with weight shifting on every step.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u19p3',tier:'TIER 2',name:'Storyboard + Animatic',pts:4,desc:'Plan a short shot by shot in a storyboard, then time it out as a rough animatic.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u19p4',tier:'TIER 2',name:'Lip Sync',pts:4,desc:'Animate a character saying one short line, matching mouth shapes to the audio.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u19p5',tier:'TIER 3',name:'Animated Short',pts:8,desc:'Animate a 15 to 30 second short with a clear story, sound, and a character who acts.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u19p6',tier:'WILD CARD',name:'Rammy Mini Lesson',pts:null,desc:'Animate Rammy, the Ramhaus mascot, teaching one art or track technique as a short for Raminations.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
      ]},
      { id:'u20',num:20,title:'Masterpiece',overview:'This is your final statement as an artist in this course. You\'ll choose your strongest medium, develop an original concept over several weeks, and defend your choices in critique. You\'ll also look back at your growth across all four semesters. By the end, you should be able to plan, create, and present a body of work that is clearly your own.',deadlines:{t1:'TBD',t2:'TBD',t3:'TBD'},times:{t1:'1-2 days each',t2:'4-6 days',t3:'1-2 weeks'}, projects:[
        {id:'u20p1',tier:'TIER 1',name:'Masterpiece Intro Worksheet+',pts:2,desc:'Reflect on your work from all four semesters and name the themes and skills you want to push.',materials:[],steps:[],tip:'',rubric:[]},

        {id:'u20p5',tier:'TIER 2',name:'Mid-Point Critique',pts:4,desc:'Present your work in progress and revise it based on specific feedback.',materials:[],steps:[],tip:'',rubric:[],suggested:true},
        {id:'u20p6',tier:'TIER 3',name:'Final Masterpiece',pts:8,desc:'Create an ambitious, original work in your chosen medium that shows your personal voice.',materials:[],steps:[],tip:'',rubric:[],suggested:true},

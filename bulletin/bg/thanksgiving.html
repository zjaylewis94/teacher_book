<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style>
<script src="node_modules/roughjs/bundled/rough.js"></script>
</head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
// Params from the query string: accent colours, paper, seed
const q = new URLSearchParams(location.search);
const A = (q.get('a') || '#ED0A3F,#FF8833,#FBE870').split(',');
const PAPER = q.get('paper') || '#FFF8E7';
const TEX = q.get('tex') || '#E9DFC6';
let seed = +(q.get('seed') || 7);
function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
const svg = document.getElementById('s');
const rc = rough.svg(svg);
const NS = 'http://www.w3.org/2000/svg';
const add = n => (svg.appendChild(n), n);
const g = (tx, ty, rot, sc) => { const e = document.createElementNS(NS,'g'); e.setAttribute('transform',`translate(${tx},${ty}) rotate(${rot||0}) scale(${sc||1})`); return add(e); };
const INK = '#1b1b1b';

// paper
const bg = document.createElementNS(NS,'rect'); bg.setAttribute('width',1920); bg.setAttribute('height',1080); bg.setAttribute('fill',PAPER); add(bg);


const O=(x)=>({stroke:INK,strokeWidth:4,roughness:1.3,seed:Math.floor(rnd()*1e4),...x});
const F=(c,x)=>O({fill:c,fillStyle:'solid',...x});
const D = {
  leaf(p,c){ // maple leaf
    const pts=[[0,-55],[12,-28],[34,-38],[28,-12],[52,-6],[30,8],[38,30],[12,22],[4,40],[0,30],[-4,40],[-12,22],[-38,30],[-30,8],[-52,-6],[-28,-12],[-34,-38],[-12,-28]];
    p.appendChild(rc.polygon(pts,F(c,{roughness:1.1})));
    p.appendChild(rc.line(0,-30,0,62,O({strokeWidth:4})));
    p.appendChild(rc.line(0,0,-24,-14,O({strokeWidth:2.5}))); p.appendChild(rc.line(0,0,24,-14,O({strokeWidth:2.5}))); },
  oak(p,c){
    p.appendChild(rc.path('M0 -55 C 14 -50, 10 -38, 22 -36 C 34 -34, 30 -20, 22 -14 C 36 -10, 34 6, 22 8 C 32 16, 26 30, 12 30 C 10 40, 4 46, 0 48 C -4 46, -10 40, -12 30 C -26 30, -32 16, -22 8 C -34 6, -36 -10, -22 -14 C -30 -20, -34 -34, -22 -36 C -10 -38, -14 -50, 0 -55 Z',F(c)));
    p.appendChild(rc.line(0,-40,0,64,O({strokeWidth:3.5}))); },
  acorn(p,c){
    p.appendChild(rc.path('M-26 -4 C -26 30, -10 48, 0 52 C 10 48, 26 30, 26 -4 Z',F('#C88A4D')));
    p.appendChild(rc.path('M-34 -4 C -34 -30, 34 -30, 34 -4 Z',F('#8B5A2B')));
    p.appendChild(rc.line(0,-24,6,-42,O({strokeWidth:5})));
    p.appendChild(rc.arc(-10,16,14,24,Math.PI*0.6,Math.PI*1.1,false,{stroke:'#fff',strokeWidth:3,roughness:1})); },
  pumpkin(p,c){
    const o=F('#FF8833');
    p.appendChild(rc.ellipse(-26,10,52,84,o)); p.appendChild(rc.ellipse(26,10,52,84,F('#FF8833')));
    p.appendChild(rc.ellipse(0,10,56,90,F('#FF9F4A')));
    p.appendChild(rc.path('M-4 -32 C -6 -46, 0 -56, 10 -60 L 14 -54 C 6 -50, 4 -42, 6 -32 Z',F('#01A368')));
    p.appendChild(rc.path('M8 -44 C 26 -62, 44 -44, 30 -36',O({strokeWidth:3,stroke:'#01A368'}))); },
  pie(p,c){ // slice of pumpkin pie with whipped cream
    p.appendChild(rc.polygon([[-60,30],[60,30],[0,-50]],F('#E8862F')));
    p.appendChild(rc.polygon([[-60,30],[60,30],[60,44],[-60,44]],F('#F3D9A4')));
    p.appendChild(rc.path('M-58 30 C -40 22, -20 38, 0 30 C 20 22, 40 38, 58 30',O({strokeWidth:6,stroke:'#C88A4D'})));
    p.appendChild(rc.path('M-14 -6 C -24 -14, -12 -30, 0 -24 C 8 -36, 26 -24, 16 -10 C 26 -2, 12 10, 0 4 C -10 12, -26 2, -14 -6 Z',F('#ffffff'))); },
  corn(p,c){
    p.appendChild(rc.ellipse(0,-6,44,104,F('#FBE870')));
    for(let y=-44;y<=34;y+=13){ p.appendChild(rc.line(-16,y,16,y,O({strokeWidth:2,roughness:0.8}))); }
    p.appendChild(rc.line(0,-54,0,40,O({strokeWidth:2,roughness:0.8})));
    p.appendChild(rc.path('M0 48 C -30 30, -40 0, -34 -30 C -24 0, -10 20, 0 30 Z',F('#C5E17A')));
    p.appendChild(rc.path('M0 48 C 30 30, 40 0, 34 -30 C 24 0, 10 20, 0 30 Z',F('#01A368'))); },
  turkey(p,c){
    const fc=['#ED0A3F','#FF8833','#FBE870','#8B5A2B','#FF8833','#ED0A3F','#FBE870'];
    for(let i=0;i<7;i++){ const a=-Math.PI*0.95+i*(Math.PI*0.9/6); const x=Math.cos(a)*70, y=Math.sin(a)*70+10;
      const e=document.createElementNS(NS,'g'); e.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(a*180/Math.PI+90).toFixed(1)})`); p.appendChild(e);
      e.appendChild(rc.ellipse(0,0,34,82,F(fc[i]))); }
    p.appendChild(rc.ellipse(0,30,96,92,F('#8B5A2B')));
    p.appendChild(rc.circle(0,-14,58,F('#A86B32')));
    p.appendChild(rc.circle(-11,-20,13,F('#fff',{strokeWidth:3}))); p.appendChild(rc.circle(11,-20,13,F('#fff',{strokeWidth:3})));
    p.appendChild(rc.circle(-10,-19,5,F(INK,{strokeWidth:2}))); p.appendChild(rc.circle(12,-19,5,F(INK,{strokeWidth:2})));
    p.appendChild(rc.polygon([[-8,-8],[8,-8],[0,4]],F('#FBE870',{strokeWidth:3})));
    p.appendChild(rc.path('M4 0 C 12 6, 10 20, 2 20 C -2 14, 0 6, 4 0 Z',F('#ED0A3F',{strokeWidth:3})));
    p.appendChild(rc.line(-14,74,-14,90,O({stroke:'#FF8833',strokeWidth:5}))); p.appendChild(rc.line(14,74,14,90,O({stroke:'#FF8833',strokeWidth:5}))); },
};

// faint texture: leaf and acorn outlines scattered across the page
const tex = document.createElementNS(NS,'g'); add(tex);
for (let i=0;i<55;i++){
  const x=60+rnd()*1800, y=60+rnd()*960, k=['leaf','oak','acorn','leaf','oak'][Math.floor(rnd()*5)];
  const e=document.createElementNS(NS,'g'); e.setAttribute('transform',`translate(${x},${y}) rotate(${rnd()*360}) scale(${0.3+rnd()*0.25})`); tex.appendChild(e);
  D[k](e,TEX); e.querySelectorAll('path').forEach(pth=>{ pth.setAttribute('stroke',TEX); if(pth.getAttribute('fill') && pth.getAttribute('fill')!=='none') pth.setAttribute('fill',TEX); });
}

// bold doodles flanking the title and in the bottom corners
const put=(k,x,y,r,s,c)=>D[k](g(x,y,r,s),c);
put('turkey',240,225,-4,1.2);
put('leaf',395,150,24,0.85,'#ED0A3F');
put('acorn',150,395,-18,0.8);
put('pie',1715,165,8,1.15);
put('pumpkin',1545,250,-8,0.95);
put('oak',1780,370,30,0.8,'#FF8833');
put('corn',170,925,-28,0.9);
put('leaf',1755,930,-20,0.95,'#FF8833');
put('oak',1640,960,15,0.6,'#ED0A3F');
document.title='ready';
</script></body></html>
